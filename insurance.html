<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Cards</title>
    <style>
        body {
            background-color: #0F1115;
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%; max-width: 400px;
            text-align: center;
        }
        h1 { color: #3B82F6; margin-bottom: 30px; }
        .card-btn {
            display: block;
            width: 100%;
            background-color: #1F2937;
            border: 1px solid #374151;
            color: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.2s;
        }
        .card-btn:hover { background-color: #374151; border-color: #3B82F6; }
        .back { color: #9CA3AF; text-decoration: none; display: block; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Insurance Cards</h1>
        
        <a href="/amazon.pdf" target="_blank" class="card-btn">
            Download Amazon Insurance (PDF)
        </a>

        <a href="/hertz.pdf" target="_blank" class="card-btn">
            Download Hertz Insurance (PDF)
        </a>

        <a href="/" class="back">← Back to Menu</a>
    </div>
</body>
</html>
