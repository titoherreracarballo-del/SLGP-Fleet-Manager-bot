<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Cards</title>
    <style>
        :root {
            --bg-body: #0F1115;
            --bg-card: #161B28;
            --bg-btn: #242c3d;
            --text-label: #3B82F6;
            --radius: 12px;
        }

        body {
            background-color: var(--bg-body);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: var(--bg-card);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid #1f2937;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        h1 {
            color: var(--text-label); font-size: 24px; font-weight: 900; 
            text-transform: uppercase; margin-bottom: 30px;
        }

        .card-btn {
            display: block;
            width: 100%;
            background-color: var(--bg-btn);
            border: 1px solid #2d3748;
            color: #cbd5e1;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: var(--radius);
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 14px;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .card-btn:hover {
            background-color: #334155;
            border-color: var(--text-label);
            color: white;
        }

        .back-link { color: #94a3b8; text-decoration: none; margin-top: 20px; display: inline-block; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Insurance Cards</h1>
        
        <a href="/amazon.pdf" target="_blank" class="card-btn">
            Amazon Fleet Insurance (PDF)
        </a>

        <a href="/hertz.pdf" target="_blank" class="card-btn">
            Hertz Fleet Insurance (PDF)
        </a>

        <a href="/" class="back-link">← Back to Menu</a>
    </div>

</body>
</html>
