<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Wallet</title>
    <style>
        :root {
            --bg-body: #0F1115;
            --bg-card: #161B28;
            --text-label: #3B82F6;
            --radius: 20px;
        }

        /* --- SECURITY LAYERS --- */
        body {
            background-color: var(--bg-body);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            /* Disable Selection */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            /* Disable Touch Callouts */
            -webkit-touch-callout: none;
        }

        /* Privacy Blur Filter */
        body.blurred {
            filter: blur(15px);
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px 10px; 
            text-align: center;
            position: relative;
        }

        h1 {
            color: white;
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 40px;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        /* --- WALLET CARD STYLES --- */
        .wallet-card {
            display: block;
            width: 100%;
            height: 200px;
            border-radius: var(--radius);
            position: relative;
            text-decoration: none;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.5);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.27);
            margin-bottom: -60px; 
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            background-size: cover;
            background-position: center;
        }

        .wallet-card:hover {
            transform: translateY(-25px) scale(1.02);
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        /* --- WATERMARK OVERLAY (Security) --- */
        .watermark {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 20px,
                rgba(255, 255, 255, 0.03) 20px,
                rgba(255, 255, 255, 0.03) 40px
            );
            pointer-events: none;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .watermark::after {
            content: "CONFIDENTIAL";
            font-size: 24px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.08);
            transform: rotate(-30deg);
            white-space: nowrap;
        }

        /* Card Content Layout */
        .card-content {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 1;
            /* Ensure text is readable over images */
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .company-name {
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            opacity: 0.9;
            border: 2px solid currentColor;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(0,0,0,0.3);
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .policy-text { font-size: 12px; opacity: 1; font-weight: 700; text-align: left; }
        .tap-hint { font-size: 11px; font-weight: 800; text-transform: uppercase; display: flex; align-items: center; gap: 5px; }

        /* --- THEMES --- */

        /* AMAZON (Updated with Truck) */
        .card-amazon {
            /* Layered background: Image on top of gradient */
            background-image: url('https://purepng.com/public/uploads/large/purepng.com-white-delivery-vanvantransportvehicle-981524673346vdsgq.png'), linear-gradient(135deg, #232f3e 0%, #0a0e14 100%);
            background-size: 60%, cover; /* Truck size, Gradient size */
            background-position: 110% 90%, center; /* Truck position (bottom right), Gradient position */
            background-repeat: no-repeat, no-repeat;
            color: white;
        }
        .card-amazon .company-name { color: #ff9900; } 
        .card-amazon .card-label { border-color: #ff9900; color: #ff9900; }

        /* HERTZ (Untouched) */
        .card-hertz { background: linear-gradient(135deg, #ffcc00 0%, #ffb700 100%); color: #1a1a1a; text-shadow: none; }
        .card-hertz .card-content { text-shadow: none; }
        .card-hertz .card-label { border-color: #1a1a1a; background: transparent; opacity: 0.8; border-width: 1px; }


        /* UTILS */
        .icon-doc { width: 20px; height: 20px; fill: currentColor; }
        .spacer { height: 80px; } 
        .back-link {
            color: var(--text-label); text-decoration: none; font-size: 14px; font-weight: bold;
            display: inline-block; margin-top: 20px; padding: 10px 20px;
            background: rgba(59, 130, 246, 0.1); border-radius: 20px; transition: all 0.2s;
        }
        .back-link:hover { background: rgba(59, 130, 246, 0.2); }

        /* Security Alert Overlay */
        #security-alert {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9999;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 40px; box-sizing: border-box;
        }
        #security-alert h2 { color: #ef4444; font-size: 24px; text-transform: uppercase; margin-bottom: 10px; }
        #security-alert p { color: #cbd5e1; font-size: 14px; }

    </style>
</head>
<body>

    <div id="security-alert">
        <h2>Security Violation</h2>
        <p>Screenshots and screen recording are disabled for sensitive documents.</p>
    </div>

    <div class="container">
        <h1>Fleet Insurance Cards</h1>
        
        <a href="/amazon.pdf" target="_blank" class="wallet-card card-amazon">
            <div class="watermark"></div> <div class="card-content">
                <div class="card-header">
                    <div class="company-name">Amazon</div>
                    <div class="card-label">Fleet Insurance</div>
                </div>
                <div class="card-footer">
                    <div class="policy-text">COMMERCIAL AUTO<br>SECURE DOCUMENT</div>
                    <div class="tap-hint">VIEW <svg class="icon-doc" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/></svg></div>
                </div>
            </div>
        </a>

        <a href="/hertz.pdf" target="_blank" class="wallet-card card-hertz">
            <div class="watermark"></div> <div class="card-content">
                <div class="card-header">
                    <div class="company-name">Hertz</div>
                    <div class="card-label">Rental Fleet</div>
                </div>
                <div class="card-footer">
                    <div class="policy-text">INSURANCE ID<br>SECURE DOCUMENT</div>
                    <div class="tap-hint">VIEW <svg class="icon-doc" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/></svg></div>
                </div>
            </div>
        </a>

        <div class="spacer"></div>
        <a href="/" class="back-link">← Back to Menu</a>
    </div>

    <script>
        // --- SECURITY SUITE ---

        // 1. Disable Context Menu (Right Click)
        document.addEventListener('contextmenu', event => event.preventDefault());

        // 2. Disable Drag and Drop
        document.addEventListener('dragstart', event => event.preventDefault());

        // 3. Print Screen / Shortcut Detection (Best Effort)
        document.addEventListener('keydown', function(e) {
            // Check for PrintScreen or Mac Command+Shift combinations
            if (e.key === 'PrintScreen' || (e.metaKey && e.shiftKey)) {
                // Instantly blur content before OS can capture (race condition)
                document.body.style.display = 'none';
                alert('Screenshots are disabled for this sensitive data.');
                setTimeout(() => document.body.style.display = 'flex', 100);
            }
        });

        // 4. Privacy Blur on Focus Loss (Tab switching/Snipping Tool usage)
        window.addEventListener('blur', function() {
            document.body.classList.add('blurred');
        });

        window.addEventListener('focus', function() {
            document.body.classList.remove('blurred');
        });

        // 5. Mobile Protection (Prevent long press to save image)
        document.addEventListener("touchstart", function(e) {
            if(e.touches.length > 1) {
                // Prevent multi-touch gestures often used for screenshots
                e.preventDefault(); 
            }
        }, { passive: false });

    </script>

</body>
</html>
