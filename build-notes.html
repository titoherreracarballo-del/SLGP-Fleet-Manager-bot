<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Notes & Updates</title>
    <style>
        :root {
            --bg-body: #0A6CF1;
            --bg-card: #1C1C1E;
            --bg-section: #2C2C2E;
            --primary-blue: #1976D2;
            --primary-gradient: linear-gradient(135deg, #1E88E5 0%, #42A5F5 100%);
            --text-label: #1976D2;
            --text-primary: #FFFFFF;
            --text-gray: #8E8E93;
            --text-green: #4CAF50;
            --text-orange: #FF9800;
            --text-red: #EF4444;
            --border-color: rgba(255, 255, 255, 0.1);
            --space-xs: clamp(4px, 1vw, 6px);
            --space-sm: clamp(6px, 1.5vw, 10px);
            --space-md: clamp(10px, 2.5vw, 15px);
            --space-lg: clamp(15px, 3.5vw, 20px);
            --space-xl: clamp(20px, 4.5vw, 30px);
            --font-xs: clamp(10px, 2.2vw, 12px);
            --font-sm: clamp(12px, 2.8vw, 14px);
            --font-base: clamp(14px, 3.2vw, 16px);
            --font-md: clamp(16px, 3.6vw, 18px);
            --font-xl: clamp(22px, 5vw, 26px);
            --font-xxl: clamp(26px, 6vw, 30px);
            --radius: clamp(12px, 3vw, 16px);
        }

        * { -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-body);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            padding: clamp(10px, 4vw, 20px);
            margin: 0;
            min-height: 100vh;
            font-size: var(--font-base);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--bg-card);
            border-radius: clamp(18px, 5vw, 24px);
            padding: clamp(18px, 5vw, 24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            color: #ffffff;
            background: var(--primary-gradient);
            text-decoration: none;
            font-size: var(--font-md);
            font-weight: 700;
            padding: var(--space-md) var(--space-lg);
            border-radius: var(--radius);
            border: none;
            box-shadow: 0 4px 12px rgba(30, 136, 229, 0.35);
            transition: all 0.2s ease;
            margin-bottom: var(--space-lg);
        }
        .back-link:hover { background: linear-gradient(135deg, #1565C0 0%, #42A5F5 100%); transform: translateY(-2px); }
        .back-link:active { transform: translateY(0); }

        .header { text-align: center; margin-bottom: var(--space-xl); }

        h1 {
            color: var(--text-label);
            font-size: var(--font-xxl);
            font-weight: 900;
            text-transform: uppercase;
            margin: 0 0 var(--space-xs) 0;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        .version { color: var(--text-green); font-size: var(--font-sm); font-weight: 700; }

        /* Loading state */
        .loading {
            text-align: center;
            padding: var(--space-xl);
            color: var(--text-gray);
            font-size: var(--font-sm);
        }
        .loading-dot {
            display: inline-block;
            animation: pulse 1.2s ease-in-out infinite;
        }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

        /* Build sections */
        .build-section {
            background: var(--bg-section);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: var(--space-md);
            margin-bottom: var(--space-lg);
        }

        .build-section.latest {
            border-color: rgba(76, 175, 80, 0.4);
            box-shadow: 0 0 12px rgba(76, 175, 80, 0.1);
        }

        .build-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-sm);
            padding-bottom: var(--space-sm);
            border-bottom: 1px solid var(--border-color);
        }

        .build-date { color: var(--text-label); font-size: var(--font-md); font-weight: 900; }

        .build-version {
            background: var(--primary-blue);
            color: white;
            padding: var(--space-xs) var(--space-sm);
            border-radius: clamp(6px, 1.5vw, 8px);
            font-size: var(--font-xs);
            font-weight: 700;
        }

        .build-version.latest-badge { background: #4CAF50; }

        .category { margin-top: var(--space-md); }

        .category-title {
            font-size: var(--font-sm);
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: var(--space-xs);
            display: flex;
            align-items: center;
            gap: var(--space-xs);
        }
        .category-title.new      { color: var(--text-green); }
        .category-title.fix      { color: var(--text-orange); }
        .category-title.optimize { color: var(--text-label); }
        .category-title.remove   { color: var(--text-red); }

        .change-list { list-style: none; padding: 0; margin: 0; }

        .change-item {
            color: var(--text-gray);
            font-size: var(--font-sm);
            line-height: 1.6;
            padding-left: var(--space-md);
            position: relative;
            margin-bottom: var(--space-xs);
        }
        .change-item::before { content: "•"; position: absolute; left: 0; color: var(--text-label); font-weight: 900; }
        .highlight { color: #FFFFFF; font-weight: 700; }
        .code {
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: var(--font-xs);
            color: var(--text-green);
        }

        /* Error state */
        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: var(--radius);
            padding: var(--space-lg);
            text-align: center;
            color: var(--text-red);
            font-size: var(--font-sm);
        }

        @media (max-width: 340px) { body { padding: 8px; } .container { padding: 12px; } }
        @media (min-width: 768px) {
            :root { --font-xs: 12px; --font-sm: 13px; --font-base: 15px; --font-md: 16px; --font-xl: 24px; --font-xxl: 28px; }
        }
        @supports (-webkit-touch-callout: none) { input, textarea, select { font-size: 16px !important; } }
    </style>
</head>
<body>
<div class="container">
    <a href="/" class="back-link">← Back to Menu</a>

    <div class="header">
        <h1>Build Notes</h1>
        <div class="version" id="currentVersion">Loading...</div>
    </div>

    <div id="notes-container">
        <div class="loading">
            <span class="loading-dot">●</span>
            <span class="loading-dot">●</span>
            <span class="loading-dot">●</span>
        </div>
    </div>

    <div style="text-align: center; color: var(--text-gray); font-size: var(--font-xs); margin-top: var(--space-xl); padding-top: var(--space-lg); border-top: 1px solid var(--border-color);">
        SLGP Fleet System · Strategic Logistics Group
    </div>
</div>

<script>
    const TYPE_COLORS = { new: 'new', fix: 'fix', optimize: 'optimize', remove: 'remove' };

    function renderNotes(notes, currentVersion) {
        const container = document.getElementById('notes-container');
        document.getElementById('currentVersion').textContent = 'Current Version: ' + currentVersion;

        if (!notes || notes.length === 0) {
            container.innerHTML = '<div class="error-msg">No build notes available.</div>';
            return;
        }

        container.innerHTML = notes.map(function(build, idx) {
            var isLatest = idx === 0;
            var changesHtml = build.changes.map(function(cat) {
                var typeClass = TYPE_COLORS[cat.type] || 'optimize';
                var itemsHtml = cat.items.map(function(item) {
                    return '<li class="change-item"><span class="highlight">' + escHtml(item.highlight) + '</span> ' + escHtml(item.text) + '</li>';
                }).join('');
                return '<div class="category"><div class="category-title ' + typeClass + '">' + escHtml(cat.title) + '</div><ul class="change-list">' + itemsHtml + '</ul></div>';
            }).join('');

            return '<div class="build-section' + (isLatest ? ' latest' : '') + '">' +
                '<div class="build-header">' +
                '<div class="build-date">' + escHtml(build.date) + '</div>' +
                '<div class="build-version' + (isLatest ? ' latest-badge' : '') + '">v' + escHtml(build.version) + (isLatest ? ' ★' : '') + '</div>' +
                '</div>' +
                changesHtml +
                '</div>';
        }).join('');
    }

    function escHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    async function loadBuildNotes() {
        try {
            const res = await fetch('/api/build-notes');
            if (!res.ok) throw new Error('Server returned ' + res.status);
            const data = await res.json();
            if (!data.success) throw new Error('API error');
            renderNotes(data.notes, data.currentVersion);
        } catch (e) {
            console.error('Build notes fetch failed:', e);
            document.getElementById('notes-container').innerHTML =
                '<div class="error-msg">⚠️ Could not load build notes.<br>Please try refreshing the page.</div>';
            document.getElementById('currentVersion').textContent = 'Version unavailable';
        }
    }

    loadBuildNotes();
</script>

<script src="/auto-refresh.js"></script>
</body>
</html>
