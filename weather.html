<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Today's Forecast - SLGP Fleet</title>
    
    <!-- Leaflet CSS for OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        :root {
            --bg-body: #0A6CF1;
            --bg-card: #1C1C1E;
            --bg-section: #2C2C2E;
            --primary-blue: #1976D2;
            --primary-gradient: linear-gradient(135deg, #1E88E5 0%, #42A5F5 100%);
            --text-white: #ffffff;
            --text-primary: #FFFFFF;
            --text-gray: #8E8E93;
            --border-color: rgba(255, 255, 255, 0.1);
            
            --space-xs: clamp(4px, 1vw, 6px);
            --space-sm: clamp(6px, 1.5vw, 10px);
            --space-md: clamp(10px, 2.5vw, 15px);
            --space-lg: clamp(15px, 3.5vw, 20px);
            --space-xl: clamp(20px, 4.5vw, 30px);
            
            --font-xs: clamp(10px, 2.2vw, 12px);
            --font-sm: clamp(12px, 2.8vw, 14px);
            --font-base: clamp(14px, 3.2vw, 16px);
            --font-md: clamp(16px, 3.6vw, 18px);
            --font-lg: clamp(18px, 4.2vw, 20px);
            --font-xl: clamp(22px, 5vw, 26px);
            --font-xxl: clamp(32px, 8vw, 48px);
            
            --radius: clamp(12px, 3vw, 16px);
            --min-touch: 44px;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-body);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            padding: clamp(10px, 4vw, 20px);
            margin: 0;
            min-height: 100vh;
            font-size: var(--font-base);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--bg-card);
            border-radius: clamp(18px, 5vw, 24px);
            padding: clamp(18px, 5vw, 24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            color: #ffffff;
            background: var(--primary-gradient);
            text-decoration: none;
            font-size: var(--font-md);
            font-weight: 700;
            padding: var(--space-md) var(--space-lg);
            border-radius: var(--radius);
            border: none;
            box-shadow: 0 4px 12px rgba(30, 136, 229, 0.35);
            transition: all 0.2s ease;
            margin-bottom: var(--space-lg);
        }
        .back-link:hover {
            background: linear-gradient(135deg, #1565C0 0%, #42A5F5 100%);
            box-shadow: 0 6px 16px rgba(30, 136, 229, 0.45);
            transform: translateY(-2px);
        }

        .header {
            text-align: center;
            margin-bottom: var(--space-xl);
        }

        h1 {
            font-size: var(--font-xl);
            font-weight: 900;
            color: #ffffff;
            margin-bottom: var(--space-sm);
            letter-spacing: -0.03em;
        }

        .subtitle {
            color: var(--text-gray);
            font-size: var(--font-sm);
            font-weight: 600;
        }

        .current-weather {
            background: linear-gradient(135deg, #2C2C2E 0%, #1C1C1E 100%);
            border-radius: var(--radius);
            padding: var(--space-lg);
            text-align: center;
            margin-bottom: var(--space-lg);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .temp-display {
            font-size: var(--font-xxl);
            font-weight: 800;
            color: #ffffff;
            margin: var(--space-sm) 0;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .condition {
            font-size: var(--font-lg);
            color: rgba(255, 255, 255, 0.95);
            font-weight: 700;
            margin-bottom: var(--space-xs);
        }

        .feels-like {
            color: var(--text-gray);
            font-size: var(--font-sm);
            font-weight: 600;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(120px, 100%), 1fr));
            gap: var(--space-md);
            margin-top: var(--space-lg);
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.05);
            padding: var(--space-md);
            border-radius: calc(var(--radius) * 0.7);
            text-align: center;
        }

        .detail-label {
            color: var(--text-gray);
            font-size: var(--font-xs);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: var(--space-xs);
        }

        .detail-value {
            color: #ffffff;
            font-size: var(--font-md);
            font-weight: 800;
        }

        .alert-banner {
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
            border-radius: var(--radius);
            padding: var(--space-md);
            margin-bottom: var(--space-md);
            border: 2px solid #F87171;
            animation: pulse 2s ease-in-out infinite;
        }

        .warning-banner {
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            border-radius: var(--radius);
            padding: var(--space-md);
            margin-bottom: var(--space-md);
            border: 2px solid #FBBF24;
        }

        .info-banner {
            background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
            border-radius: var(--radius);
            padding: var(--space-md);
            margin-bottom: var(--space-md);
            border: 2px solid #60A5FA;
        }

        .success-banner {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: var(--radius);
            padding: var(--space-md);
            margin-bottom: var(--space-md);
            border: 2px solid #34d399;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.95; transform: scale(1.01); }
        }

        .alert-title {
            font-size: var(--font-md);
            font-weight: 800;
            margin-bottom: var(--space-xs);
            text-transform: uppercase;
            color: #1C1C1E;
        }

        .alert-description {
            font-size: var(--font-sm);
            line-height: 1.5;
            color: #1C1C1E;
        }

        .section-title {
            font-size: var(--font-lg);
            font-weight: 800;
            color: #ffffff;
            margin: var(--space-lg) 0 var(--space-md) 0;
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .hourly-forecast {
            display: flex;
            gap: var(--space-md);
            overflow-x: auto;
            padding: var(--space-md) 0;
            margin-bottom: var(--space-lg);
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .hourly-forecast::-webkit-scrollbar { display: none; }

        .hourly-item {
            flex: 0 0 auto;
            background: var(--bg-section);
            border-radius: var(--radius);
            padding: var(--space-md);
            text-align: center;
            min-width: min(90px, 25vw);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hourly-time {
            font-size: var(--font-xs);
            color: var(--text-gray);
            font-weight: 700;
            margin-bottom: var(--space-xs);
        }

        .hourly-icon {
            font-size: clamp(24px, 6vw, 32px);
            margin: var(--space-xs) 0;
        }

        .hourly-temp {
            font-size: var(--font-md);
            font-weight: 800;
            color: #ffffff;
            margin-bottom: var(--space-xs);
        }

        .hourly-pop {
            font-size: var(--font-xs);
            color: #60A5FA;
            font-weight: 700;
        }

        .sunset-info {
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            border-radius: var(--radius);
            padding: var(--space-lg);
            text-align: center;
            margin-bottom: var(--space-lg);
            border: 2px solid #FBBF24;
        }

        .sunset-label {
            font-size: var(--font-sm);
            color: #1C1C1E;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: var(--space-sm);
        }

        .sunset-time {
            font-size: var(--font-xl);
            font-weight: 900;
            color: #1C1C1E;
        }

        .map-container {
            background: var(--bg-section);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: var(--space-lg);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        #traffic-map {
            width: 100%;
            height: 300px;
        }

        .legend {
            background: var(--bg-section);
            border-radius: var(--radius);
            padding: var(--space-lg);
            margin-bottom: var(--space-lg);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .legend-title {
            font-size: var(--font-md);
            font-weight: 800;
            color: #ffffff;
            margin-bottom: var(--space-md);
        }

        .legend-items {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .legend-item {
            display: flex;
            align-items: center;
            font-size: var(--font-sm);
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
        }

        .safety-reminders {
            background: var(--bg-section);
            border-radius: var(--radius);
            padding: var(--space-lg);
            margin-bottom: var(--space-lg);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .reminder-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .reminder-list li {
            padding: var(--space-sm) 0;
            color: rgba(255, 255, 255, 0.9);
            font-size: var(--font-sm);
            line-height: 1.6;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-weight: 500;
        }

        .reminder-list li:last-child {
            border-bottom: none;
        }

        .reminder-list li::before {
            content: "✓ ";
            color: #10b981;
            font-weight: 800;
            margin-right: var(--space-sm);
        }

        .coverage-area {
            background: var(--bg-section);
            border-radius: var(--radius);
            padding: var(--space-lg);
            margin-bottom: var(--space-lg);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .area-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(140px, 100%), 1fr));
            gap: var(--space-sm);
            margin-top: var(--space-md);
        }

        .area-item {
            background: rgba(255, 255, 255, 0.05);
            padding: var(--space-sm);
            border-radius: calc(var(--radius) * 0.6);
            font-size: var(--font-sm);
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            text-align: center;
        }

        .last-updated {
            text-align: center;
            color: var(--text-gray);
            font-size: var(--font-xs);
            margin-top: var(--space-lg);
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: var(--space-xl);
            color: rgba(255, 255, 255, 0.7);
            font-size: var(--font-md);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 2px solid #EF4444;
            border-radius: var(--radius);
            padding: var(--space-lg);
            text-align: center;
            color: #FCA5A5;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .area-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back to Menu</a>
        
        <div class="header">
            <h1>⛅ Today's Forecast</h1>
            <div class="subtitle">Weather & Road Conditions</div>
        </div>
        
        <div id="weather-content" class="loading">
            Loading weather data...
        </div>

        <!-- Build Notes Button -->
        <a href="/build-notes" style="display: inline-flex; align-items: center; justify-content: center; gap: var(--space-sm); color: #ffffff; background: linear-gradient(135deg, #6B7280 0%, #4B5563 100%); text-decoration: none; font-size: var(--font-sm); font-weight: 700; padding: var(--space-md) var(--space-lg); border-radius: var(--radius); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 2px 8px rgba(0,0,0,0.2); transition: all 0.2s ease; margin-top: var(--space-lg); width: 100%; text-align: center;">
            📋 Build Notes & Changelog
        </a>
    </div>

    <script>
        let userLat = 33.7490;  // Default: Atlanta, GA
        let userLon = -84.3880;
        let locationName = "Atlanta, GA";
        let map = null;

        // Get user's actual location
        async function getUserLocation() {
            try {
                const position = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 300000
                    });
                });
                
                userLat = position.coords.latitude;
                userLon = position.coords.longitude;
                
                // Reverse geocode to get location name
                const geoResponse = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${userLat}&lon=${userLon}&format=json`);
                const geoData = await geoResponse.json();
                
                if (geoData.address) {
                    const city = geoData.address.city || geoData.address.town || geoData.address.village || '';
                    const state = geoData.address.state || '';
                    locationName = city && state ? `${city}, ${state}` : 'Current Location';
                }
                
                console.log('✅ Location acquired:', locationName, userLat, userLon);
            } catch (error) {
                console.warn('⚠️ Using default location (Atlanta, GA):', error.message);
            }
        }

        async function fetchWeather() {
            try {
                // Get user's location first
                await getUserLocation();
                
                // Fetch weather data
                const weatherURL = `https://api.open-meteo.com/v1/forecast?latitude=${userLat}&longitude=${userLon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,weather_code&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=America/New_York&forecast_days=1`;
                
                const weatherRes = await fetch(weatherURL);
                const weatherData = await weatherRes.json();
                
                // Fetch sunset time
                const sunsetURL = `https://api.sunrise-sunset.org/json?lat=${userLat}&lng=${userLon}&formatted=0`;
                const sunsetRes = await fetch(sunsetURL);
                const sunsetData = await sunsetRes.json();
                
                // Fetch traffic data for major corridors
                let corridorTraffic = await fetchCorridorTraffic();
                
                displayWeather(weatherData, sunsetData, corridorTraffic);
                
            } catch (error) {
                console.error('Weather fetch error:', error);
                document.getElementById('weather-content').innerHTML = `
                    <div class="error-message">
                        ⚠️ Unable to load weather data. Please try again later.
                    </div>
                `;
            }
        }

        // Fetch traffic for major corridors in Atlanta metro
        async function fetchCorridorTraffic() {
            const tomtomKey = 'lpdiXsgvIHDW7f4aTxBt17XEW30a4uNW';
            
            // Major corridors in delivery area
            const corridors = [
                { name: 'I-75 South', lat: 33.6405, lon: -84.4194, direction: 'southbound' },
                { name: 'I-75 North', lat: 33.7701, lon: -84.3944, direction: 'northbound' },
                { name: 'I-85 South', lat: 33.6890, lon: -84.2960, direction: 'southbound' },
                { name: 'I-85 North', lat: 33.7756, lon: -84.3863, direction: 'northbound' },
                { name: 'I-285 Perimeter', lat: 33.7490, lon: -84.3880, direction: 'loop' },
                { name: 'US-19/41 Southbound', lat: 33.6850, lon: -84.4450, direction: 'southbound' },
                { name: 'SR-74 West', lat: 33.3866, lon: -84.5755, direction: 'westbound' },
                { name: 'US-29 South', lat: 33.3826, lon: -84.7938, direction: 'southbound' }
            ];
            
            let results = [];
            
            for (let corridor of corridors) {
                try {
                    const trafficURL = `https://api.tomtom.com/traffic/services/4/flowSegmentData/absolute/10/json?key=${tomtomKey}&point=${corridor.lat},${corridor.lon}`;
                    const response = await fetch(trafficURL);
                    const data = await response.json();
                    
                    if (data.flowSegmentData) {
                        const currentSpeed = data.flowSegmentData.currentSpeed || 0;
                        const freeFlowSpeed = data.flowSegmentData.freeFlowSpeed || 60;
                        const speedRatio = currentSpeed / freeFlowSpeed;
                        
                        results.push({
                            name: corridor.name,
                            direction: corridor.direction,
                            currentSpeed: Math.round(currentSpeed),
                            normalSpeed: Math.round(freeFlowSpeed),
                            ratio: speedRatio,
                            status: speedRatio >= 0.8 ? 'clear' : speedRatio >= 0.5 ? 'moderate' : 'heavy'
                        });
                    }
                } catch (e) {
                    console.warn(`Failed to fetch traffic for ${corridor.name}:`, e.message);
                }
                
                // Small delay to avoid rate limiting
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            
            return results;
        }

        function getWeatherIcon(code) {
            const icons = {
                0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
                45: '🌫️', 48: '🌫️',
                51: '🌦️', 53: '🌦️', 55: '🌦️',
                61: '🌧️', 63: '🌧️', 65: '🌧️',
                71: '🌨️', 73: '🌨️', 75: '🌨️',
                80: '🌦️', 81: '🌦️', 82: '🌧️',
                95: '⛈️', 96: '⛈️', 99: '⛈️'
            };
            return icons[code] || '🌡️';
        }

        function getWeatherDescription(code) {
            const descriptions = {
                0: 'Clear Sky', 1: 'Mainly Clear', 2: 'Partly Cloudy', 3: 'Overcast',
                45: 'Foggy', 48: 'Foggy',
                51: 'Light Drizzle', 53: 'Drizzle', 55: 'Heavy Drizzle',
                61: 'Light Rain', 63: 'Rain', 65: 'Heavy Rain',
                71: 'Light Snow', 73: 'Snow', 75: 'Heavy Snow',
                80: 'Light Showers', 81: 'Showers', 82: 'Heavy Showers',
                95: 'Thunderstorm', 96: 'Thunderstorm with Hail', 99: 'Severe Thunderstorm'
            };
            return descriptions[code] || 'Unknown';
        }

        function displayWeather(weather, sunset, traffic) {
            const current = weather.current;
            const hourly = weather.hourly;
            const now = new Date();
            const hour = now.getHours();
            
            // Parse sunset time
            const sunsetTime = new Date(sunset.results.sunset);
            const sunsetFormatted = sunsetTime.toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit'
            });
            
            // Calculate time until sunset (in minutes)
            const minutesUntilSunset = Math.floor((sunsetTime - now) / 1000 / 60);
            
            // Build alerts
            let alertsHTML = '';
            
            // SUNSET APPROACHING ALERT (within 60 minutes)
            if (minutesUntilSunset > 0 && minutesUntilSunset <= 60) {
                alertsHTML += `
                    <div class="warning-banner">
                        <div class="alert-title">🌅 SUNSET APPROACHING (${minutesUntilSunset} min)</div>
                        <div class="alert-description">Sunset at ${sunsetFormatted}. Flash detection will be active for remaining deliveries. Check camera settings and ensure flash is enabled.</div>
                    </div>
                `;
            }
            
            // CORRIDOR TRAFFIC ALERTS (Major Highways)
            if (traffic && traffic.length > 0) {
                // Find problem corridors
                const heavyCorridors = traffic.filter(c => c.status === 'heavy');
                const moderateCorridors = traffic.filter(c => c.status === 'moderate');
                const clearCorridors = traffic.filter(c => c.status === 'clear');
                
                // Show heavy traffic alerts first
                if (heavyCorridors.length > 0) {
                    let corridorList = heavyCorridors.map(c => 
                        `<strong>${c.name}</strong>: ${c.currentSpeed} mph (${Math.round(c.ratio * 100)}% normal)`
                    ).join('<br>');
                    
                    let alternatives = clearCorridors.length > 0 
                        ? `<br><br>💡 <strong>Alternative Routes:</strong><br>${clearCorridors.slice(0, 2).map(c => `${c.name}: ${Math.round(c.ratio * 100)}% normal speed`).join('<br>')}`
                        : '';
                    
                    alertsHTML += `
                        <div class="alert-banner">
                            <div class="alert-title">🚨 HEAVY TRAFFIC ON MAJOR ROUTES</div>
                            <div class="alert-description">${corridorList}${alternatives}<br><br>⚠️ Allow extra 20-30 minutes for affected routes. Check GPS for real-time detours.</div>
                        </div>
                    `;
                }
                // Show moderate traffic as warning
                else if (moderateCorridors.length > 0) {
                    let corridorList = moderateCorridors.slice(0, 3).map(c => 
                        `${c.name}: ${c.currentSpeed} mph (${Math.round(c.ratio * 100)}% normal)`
                    ).join(' • ');
                    
                    alertsHTML += `
                        <div class="warning-banner">
                            <div class="alert-title">⚠️ MODERATE TRAFFIC CONDITIONS</div>
                            <div class="alert-description">${corridorList}<br>Some slowdowns expected. Monitor conditions and allow extra time.</div>
                        </div>
                    `;
                }
                // All clear - show positive message
                else if (clearCorridors.length >= traffic.length * 0.7) {
                    alertsHTML += `
                        <div class="success-banner">
                            <div class="alert-title">✅ CLEAR TRAFFIC CONDITIONS</div>
                            <div class="alert-description">All major routes flowing well (${Math.round(traffic.reduce((sum, c) => sum + c.ratio, 0) / traffic.length * 100)}% average). Good conditions for deliveries.</div>
                        </div>
                    `;
                }
            }
            
            // High wind alert
            if (current.wind_speed_10m >= 25) {
                alertsHTML += `
                    <div class="warning-banner">
                        <div class="alert-title">💨 HIGH WIND ADVISORY</div>
                        <div class="alert-description">Winds at ${Math.round(current.wind_speed_10m)} mph. Use caution when driving, especially with high-profile vehicles. Secure loose items.</div>
                    </div>
                `;
            }
            
            // Temperature extreme alerts
            if (current.temperature_2m >= 95) {
                alertsHTML += `
                    <div class="warning-banner">
                        <div class="alert-title">🌡️ EXCESSIVE HEAT WARNING</div>
                        <div class="alert-description">Temperature at ${Math.round(current.temperature_2m)}°F. Stay hydrated, take breaks in air conditioning, and check vehicle cooling system.</div>
                    </div>
                `;
            } else if (current.temperature_2m <= 32) {
                alertsHTML += `
                    <div class="warning-banner">
                        <div class="alert-title">🥶 FREEZING TEMPERATURE ALERT</div>
                        <div class="alert-description">Temperature at ${Math.round(current.temperature_2m)}°F. Watch for ice on roads, bridges, and overpasses. Allow extra time for vehicle warm-up.</div>
                    </div>
                `;
            }
            
            // Severe weather alerts
            if (current.weather_code >= 95) {
                alertsHTML += `
                    <div class="alert-banner">
                        <div class="alert-title">⛈️ SEVERE WEATHER ALERT</div>
                        <div class="alert-description">Thunderstorms expected. Exercise extreme caution while driving. Contact dispatch immediately if conditions deteriorate.</div>
                    </div>
                `;
            } else if (current.weather_code >= 71 && current.weather_code <= 75) {
                alertsHTML += `
                    <div class="alert-banner">
                        <div class="alert-title">❄️ WINTER WEATHER ALERT</div>
                        <div class="alert-description">Snow conditions expected. Roads may be impassable. Drive safely and allow extra time for deliveries.</div>
                    </div>
                `;
            } else if (current.weather_code >= 61 && current.weather_code <= 65) {
                alertsHTML += `
                    <div class="warning-banner">
                        <div class="alert-title">🌧️ WET ROAD CONDITIONS</div>
                        <div class="alert-description">Rain expected today. Roads may be slippery. Increase following distance and reduce speed.</div>
                    </div>
                `;
            } else if (current.weather_code >= 45 && current.weather_code <= 48) {
                alertsHTML += `
                    <div class="warning-banner">
                        <div class="alert-title">🌫️ FOG / LOW VISIBILITY</div>
                        <div class="alert-description">Foggy conditions reducing visibility. Use low-beam headlights, reduce speed, and increase following distance.</div>
                    </div>
                `;
            }
            
            // Early morning optimal conditions
            if (hour >= 5 && hour < 7) {
                alertsHTML += `
                    <div class="success-banner">
                        <div class="alert-title">🌅 EARLY MORNING - OPTIMAL CONDITIONS</div>
                        <div class="alert-description">Light traffic and good visibility. Excellent time for deliveries.</div>
                    </div>
                `;
            }
            
            // Build hourly forecast (next 12 hours)
            let hourlyHTML = '';
            const currentHour = now.getHours();
            
            for (let i = 0; i < 12; i++) {
                const hourIndex = currentHour + i;
                if (hourIndex >= hourly.time.length) break;
                
                const time = new Date(hourly.time[hourIndex]);
                const temp = Math.round(hourly.temperature_2m[hourIndex]);
                const pop = hourly.precipitation_probability[hourIndex];
                const code = hourly.weather_code[hourIndex];
                
                hourlyHTML += `
                    <div class="hourly-item">
                        <div class="hourly-time">${time.getHours() === currentHour ? 'Now' : time.toLocaleTimeString('en-US', {hour: 'numeric'})}</div>
                        <div class="hourly-icon">${getWeatherIcon(code)}</div>
                        <div class="hourly-temp">${temp}°</div>
                        ${pop > 0 ? `<div class="hourly-pop">💧 ${pop}%</div>` : ''}
                    </div>
                `;
            }
            
            document.getElementById('weather-content').innerHTML = `
                ${alertsHTML}
                
                <div class="current-weather">
                    <div style="font-size: 48px;">${getWeatherIcon(current.weather_code)}</div>
                    <div class="temp-display">${Math.round(current.temperature_2m)}°F</div>
                    <div class="condition">${getWeatherDescription(current.weather_code)}</div>
                    <div class="feels-like">Feels like ${Math.round(current.apparent_temperature)}°F</div>
                    
                    <div class="weather-details">
                        <div class="detail-item">
                            <div class="detail-label">Humidity</div>
                            <div class="detail-value">${current.relative_humidity_2m}%</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Wind</div>
                            <div class="detail-value">${Math.round(current.wind_speed_10m)} mph</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Precipitation</div>
                            <div class="detail-value">${current.precipitation}"</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Location</div>
                            <div class="detail-value">${locationName}</div>
                        </div>
                    </div>
                </div>
                
                <div class="section-title">📅 Hourly Forecast</div>
                <div class="hourly-forecast">
                    ${hourlyHTML}
                </div>
                
                <div class="sunset-info">
                    <div class="sunset-label">🌅 Sunset Today</div>
                    <div class="sunset-time">${sunsetFormatted}</div>
                </div>
                
                <div class="section-title">🗺️ Your Location & Area Map</div>
                
                <div class="map-container">
                    <div id="traffic-map"></div>
                </div>
                
                <div class="legend">
                    <div class="legend-title">🗺️ Map Legend</div>
                    <div class="legend-items">
                        <div class="legend-item">
                            <div style="width: 20px; height: 20px; background: #1E88E5; border-radius: 50%; margin-right: 8px;"></div>
                            <span>📍 Your Location</span>
                        </div>
                        <div class="legend-item">
                            <div style="width: 20px; height: 4px; background: #42A5F5; border-radius: 2px; margin-right: 8px; opacity: 0.5;"></div>
                            <span>Delivery Area</span>
                        </div>
                    </div>
                    <div style="margin-top: var(--space-md); padding-top: var(--space-md); border-top: 1px solid rgba(255,255,255,0.1);">
                        <div class="legend-title" style="margin-top: 0;">🚦 Traffic Flow (when enabled)</div>
                        <div class="legend-items">
                            <div class="legend-item">
                                <div style="width: 30px; height: 4px; background: #10B981; border-radius: 2px; margin-right: 8px;"></div>
                                <span>Light (>80% normal speed)</span>
                            </div>
                            <div class="legend-item">
                                <div style="width: 30px; height: 4px; background: #F59E0B; border-radius: 2px; margin-right: 8px;"></div>
                                <span>Moderate (50-80%)</span>
                            </div>
                            <div class="legend-item">
                                <div style="width: 30px; height: 4px; background: #EF4444; border-radius: 2px; margin-right: 8px;"></div>
                                <span>Heavy (<50%)</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="section-title">🚦 Major Route Conditions</div>
                <div class="legend">
                    <div class="legend-title">Current Traffic on Major Corridors</div>
                    ${traffic && traffic.length > 0 ? traffic.map(corridor => {
                        let statusColor = corridor.status === 'clear' ? '#10B981' : 
                                        corridor.status === 'moderate' ? '#F59E0B' : '#EF4444';
                        let statusIcon = corridor.status === 'clear' ? '✅' : 
                                       corridor.status === 'moderate' ? '⚠️' : '🚨';
                        let statusText = corridor.status === 'clear' ? 'Clear' : 
                                       corridor.status === 'moderate' ? 'Moderate' : 'Heavy';
                        
                        return `
                            <div style="display: flex; align-items: center; justify-content: space-between; padding: var(--space-md); background: rgba(255,255,255,0.03); border-radius: calc(var(--radius) * 0.7); margin-bottom: var(--space-sm); border-left: 4px solid ${statusColor};">
                                <div style="flex: 1;">
                                    <div style="font-size: var(--font-sm); font-weight: 700; color: #ffffff; margin-bottom: 4px;">${statusIcon} ${corridor.name}</div>
                                    <div style="font-size: var(--font-xs); color: var(--text-gray);">${corridor.currentSpeed} mph current • ${corridor.normalSpeed} mph normal</div>
                                </div>
                                <div style="text-align: right;">
                                    <div style="font-size: var(--font-md); font-weight: 800; color: ${statusColor};">${Math.round(corridor.ratio * 100)}%</div>
                                    <div style="font-size: var(--font-xs); color: var(--text-gray);">${statusText}</div>
                                </div>
                            </div>
                        `;
                    }).join('') : '<div style="color: var(--text-gray); text-align: center; padding: var(--space-md);">Traffic data loading...</div>'}
                </div>
                
                <div class="safety-reminders">
                    <div class="legend-title">⚠️ Safety Reminders</div>
                    <ul class="reminder-list">
                        <li>Check GPS for real-time traffic updates before each route</li>
                        <li>Allow extra time during peak hours and adverse weather</li>
                        <li>Reduce speed in wet or icy conditions</li>
                        <li>Report any road hazards or closures via the app</li>
                        <li>Contact dispatch immediately for impassable roads</li>
                    </ul>
                </div>
                
                <div class="coverage-area">
                    <div class="legend-title">📍 Primary Delivery Zones</div>
                    <div class="area-grid">
                        <div class="area-item">Atlanta</div>
                        <div class="area-item">Peachtree City</div>
                        <div class="area-item">Fayetteville</div>
                        <div class="area-item">McDonough</div>
                        <div class="area-item">Stockbridge</div>
                        <div class="area-item">Hampton</div>
                        <div class="area-item">Jonesboro</div>
                        <div class="area-item">Riverdale</div>
                        <div class="area-item">Union City</div>
                        <div class="area-item">Newnan</div>
                        <div class="area-item">Senoia</div>
                        <div class="area-item">Sharpsburg</div>
                        <div class="area-item">Moreland</div>
                        <div class="area-item">Grantville</div>
                        <div class="area-item">Hogansville</div>
                        <div class="area-item">Luthersville</div>
                        <div class="area-item">Greenville</div>
                        <div class="area-item">Griffin</div>
                        <div class="area-item">LaGrange</div>
                    </div>
                </div>
                
                <div class="last-updated">
                    Last updated: ${now.toLocaleString('en-US', { 
                        month: 'short', 
                        day: 'numeric', 
                        hour: 'numeric', 
                        minute: '2-digit' 
                    })}
                </div>
            `;
            
            // Initialize the map
            initializeMap();
        }

        function initializeMap() {
            setTimeout(() => {
                if (map) {
                    map.remove();
                }
                
                map = L.map('traffic-map', {
                    center: [userLat, userLon],
                    zoom: 12,
                    zoomControl: true,
                    scrollWheelZoom: true
                });
                
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors',
                    maxZoom: 19
                }).addTo(map);
                
                // Add blue marker for user's location
                const userIcon = L.divIcon({
                    className: 'custom-marker',
                    html: '<div style="background: #1E88E5; width: 20px; height: 20px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.3);"></div>',
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                });
                
                L.marker([userLat, userLon], { icon: userIcon }).addTo(map)
                    .bindPopup(`<b>📍 Your Location</b><br>${locationName}`);
                
                // Add TomTom traffic layer
                const tomtomKey = 'lpdiXsgvIHDW7f4aTxBt17XEW30a4uNW';
                L.tileLayer(`https://api.tomtom.com/traffic/map/4/tile/flow/relative/{z}/{x}/{y}.png?key=${tomtomKey}`, {
                    opacity: 0.7,
                    maxZoom: 19
                }).addTo(map);
                
                map.invalidateSize();
            }, 100);
        }

        // Auto-refresh every 60 minutes
        fetchWeather();
        setInterval(fetchWeather, 60 * 60 * 1000);
    </script>
</body>
</html>
