<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Today's Forecast - SLGP Fleet</title>
    
    <!-- Leaflet CSS for OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        :root {
            --bg-body: #0A6CF1;
            --bg-card: #1C1C1E;
            --bg-section: #2C2C2E;
            --primary-blue: #1976D2;
            --primary-gradient: linear-gradient(135deg, #1E88E5 0%, #42A5F5 100%);
            --text-white: #ffffff;
            --text-primary: #FFFFFF;
            --text-gray: #8E8E93;
            --border-color: rgba(255, 255, 255, 0.1);
            
            --space-xs: clamp(4px, 1vw, 6px);
            --space-sm: clamp(6px, 1.5vw, 10px);
            --space-md: clamp(10px, 2.5vw, 15px);
            --space-lg: clamp(15px, 3.5vw, 20px);
            --space-xl: clamp(20px, 4.5vw, 30px);
            
            --font-xs: clamp(10px, 2.2vw, 12px);
            --font-sm: clamp(12px, 2.8vw, 14px);
            --font-base: clamp(14px, 3.2vw, 16px);
            --font-md: clamp(16px, 3.6vw, 18px);
            --font-lg: clamp(18px, 4.2vw, 20px);
            --font-xl: clamp(22px, 5vw, 26px);
            --font-xxl: clamp(32px, 8vw, 48px);
            
            --radius: clamp(12px, 3vw, 16px);
            --min-touch: 44px;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-body);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            padding: clamp(10px, 4vw, 20px);
            margin: 0;
            min-height: 100vh;
            font-size: var(--font-base);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--bg-card);
            border-radius: clamp(18px, 5vw, 24px);
            padding: clamp(18px, 5vw, 24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            color: #ffffff;
            background: var(--primary-gradient);
            text-decoration: none;
            font-size: var(--font-md);
            font-weight: 700;
            padding: var(--space-md) var(--space-lg);
            border-radius: var(--radius);
            border: none;
            box-shadow: 0 4px 12px rgba(30, 136, 229, 0.35);
            transition: all 0.2s ease;
            margin-bottom: var(--space-lg);
        }
        .back-link:hover {
            background: linear-gradient(135deg, #1565C0 0%, #42A5F5 100%);
            box-shadow: 0 6px 16px rgba(30, 136, 229, 0.45);
            transform: translateY(-2px);
        }

        .header {
            text-align: center;
            margin-bottom: var(--space-xl);
        }

        h1 {
            font-size: var(--font-xl);
            font-weight: 800;
            margin-bottom: var(--space-xs);
            color: #42A5F5;
        }

        .last-updated {
            font-size: var(--font-xs);
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .loading {
            text-align: center;
            padding: var(--space-xl);
            font-size: var(--font-md);
            color: var(--text-gray);
        }

        .current-weather {
            background: var(--bg-section);
            border-radius: var(--radius);
            padding: var(--space-lg);
            margin-bottom: var(--space-md);
            text-align: center;
        }

        .temp-display {
            font-size: var(--font-xxl);
            font-weight: 800;
            margin: var(--space-md) 0;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .condition {
            font-size: var(--font-lg);
            margin-bottom: var(--space-sm);
            text-transform: capitalize;
        }

        .feels-like {
            font-size: var(--font-sm);
            color: var(--text-gray);
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-sm);
            margin-top: var(--space-md);
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.05);
            padding: var(--space-md);
            border-radius: var(--radius);
            text-align: center;
        }

        .detail-label {
            font-size: var(--font-xs);
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: var(--space-xs);
        }

        .detail-value {
            font-size: var(--font-md);
            font-weight: 700;
        }

        .section-title {
            font-size: var(--font-md);
            font-weight: 700;
            margin: var(--space-lg) 0 var(--space-md) 0;
            color: #42A5F5;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hourly-forecast {
            display: flex;
            gap: var(--space-sm);
            overflow-x: auto;
            padding-bottom: var(--space-sm);
            margin-bottom: var(--space-md);
            -webkit-overflow-scrolling: touch;
        }

        .hourly-item {
            background: var(--bg-section);
            border-radius: var(--radius);
            padding: var(--space-md);
            min-width: 80px;
            text-align: center;
            flex-shrink: 0;
        }

        .hourly-time {
            font-size: var(--font-xs);
            color: var(--text-gray);
            margin-bottom: var(--space-xs);
        }

        .hourly-icon {
            font-size: 24px;
            margin: var(--space-xs) 0;
        }

        .hourly-temp {
            font-size: var(--font-md);
            font-weight: 700;
        }

        .hourly-pop {
            font-size: var(--font-xs);
            color: #42A5F5;
            margin-top: var(--space-xs);
        }

        .alert-banner {
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
            border-radius: var(--radius);
            padding: var(--space-md);
            margin-bottom: var(--space-md);
            border: 2px solid #F87171;
            animation: pulse 2s ease-in-out infinite;
        }

        .warning-banner {
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            border-radius: var(--radius);
            padding: var(--space-md);
            margin-bottom: var(--space-md);
            border: 2px solid #FBBF24;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.95; }
        }

        .alert-title {
            font-size: var(--font-md);
            font-weight: 800;
            margin-bottom: var(--space-xs);
            text-transform: uppercase;
            color: #1C1C1E;
        }

        .alert-description {
            font-size: var(--font-sm);
            line-height: 1.5;
            color: #1C1C1E;
        }

        .sunset-info {
            background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%);
            border-radius: var(--radius);
            padding: var(--space-md);
            text-align: center;
            margin: var(--space-md) 0;
        }

        .sunset-label {
            font-size: var(--font-sm);
            margin-bottom: var(--space-xs);
            opacity: 0.9;
        }

        .sunset-time {
            font-size: var(--font-xl);
            font-weight: 800;
        }

        .map-container {
            border-radius: var(--radius);
            overflow: hidden;
            margin: var(--space-md) 0;
            border: 2px solid rgba(255, 255, 255, 0.1);
            height: 300px;
        }

        #traffic-map {
            width: 100%;
            height: 100%;
            border: none;
        }

        .legend {
            background: var(--bg-section);
            border-radius: var(--radius);
            padding: var(--space-md);
            margin-bottom: var(--space-md);
        }

        .legend-title {
            font-size: var(--font-sm);
            font-weight: 700;
            margin-bottom: var(--space-sm);
            color: #42A5F5;
            text-transform: uppercase;
        }

        .legend-items {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-md);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
            font-size: var(--font-xs);
        }

        .info-section {
            background: var(--bg-section);
            border-radius: var(--radius);
            padding: var(--space-md);
            margin-bottom: var(--space-md);
        }

        .info-list {
            list-style: none;
        }

        .info-item {
            padding: var(--space-sm) 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: var(--font-sm);
            line-height: 1.6;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #EF4444;
            border-radius: var(--radius);
            padding: var(--space-md);
            color: #FCA5A5;
            text-align: center;
            margin: var(--space-md) 0;
        }

        .refresh-notice {
            text-align: center;
            font-size: var(--font-xs);
            color: var(--text-gray);
            margin-top: var(--space-md);
            padding: var(--space-sm);
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--radius);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back to Menu</a>
        
        <div class="header">
            <h1>⛅ Today's Forecast</h1>
            <div class="last-updated" id="last-updated">📍 Getting your location...</div>
        </div>

        <div id="weather-content" class="loading">
            <div>📍 Getting your location...</div>
            <div style="font-size: var(--font-xs); margin-top: var(--space-sm); color: var(--text-gray);">Weather and traffic will be based on your current GPS location</div>
        </div>
    </div>

    <script>
        let userLat = null;
        let userLon = null;
        let locationName = "Getting location...";
        let trafficLayer = null;
        let globalMap = null;
        const UPDATE_INTERVAL = 60 * 60 * 1000; // 1 hour
        
        // TomTom Traffic API Key - Get free key at: https://developer.tomtom.com/
        // Free tier: 2,500 requests/day (plenty for fleet use)
        const TOMTOM_API_KEY = 'lpdiXsgvIHDW7f4aTxBt17XEW30a4uNW';
        
        // Fetch traffic incidents (accidents, closures, construction)
        async function fetchTrafficIncidents() {
            if (!userLat || !userLon) return [];
            
            try {
                // Using HERE Traffic API (free tier: 250k transactions/month)
                // Get free key at: https://developer.here.com/
                const HERE_API_KEY = 'YOUR_HERE_API_KEY'; // Replace with your free HERE key
                
                if (HERE_API_KEY === 'YOUR_HERE_API_KEY') {
                    console.warn('HERE API key not configured - traffic incidents disabled');
                    return [];
                }
                
                // Search for incidents within 10km radius
                const radius = 10000; // 10km
                const url = `https://data.traffic.hereapi.com/v7/incidents?in=circle:${userLat},${userLon};r=${radius}&apiKey=${HERE_API_KEY}`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                return data.results || [];
            } catch (error) {
                console.error('Traffic incident fetch failed:', error);
                return [];
            }
        }
        
        // Check for heavy traffic based on current time and weather
        function detectHeavyTraffic(weatherCode, hour) {
            const alerts = [];
            
            // Peak hours traffic
            if ((hour >= 7 && hour <= 9) || (hour >= 16 && hour <= 19)) {
                alerts.push({
                    type: 'peak_hours',
                    severity: 'moderate',
                    title: '🚦 Peak Hours Traffic',
                    message: 'Heavy traffic expected on major routes. Allow extra delivery time and use alternate routes when possible.'
                });
            }
            
            // Weather-based traffic
            if (weatherCode >= 61 && weatherCode <= 65) {
                alerts.push({
                    type: 'rain_traffic',
                    severity: 'high',
                    title: '🌧️ Rain Causing Slowdowns',
                    message: 'Wet roads are slowing traffic. Reduce speed, increase following distance, and expect delays.'
                });
            }
            
            if (weatherCode >= 71 && weatherCode <= 75) {
                alerts.push({
                    type: 'snow_traffic',
                    severity: 'critical',
                    title: '❄️ Snow Impacting Traffic',
                    message: 'Snow is causing significant delays and hazardous conditions. Use extreme caution and consider route changes.'
                });
            }
            
            if (weatherCode >= 95) {
                alerts.push({
                    type: 'storm_traffic',
                    severity: 'critical',
                    title: '⛈️ Severe Weather Traffic Impact',
                    message: 'Thunderstorms causing dangerous driving conditions. Seek shelter if possible and avoid travel during severe weather.'
                });
            }
            
            return alerts;
        }
        
        // Get user's current GPS location
        async function getUserLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error('Geolocation not supported'));
                    return;
                }
                
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        userLat = position.coords.latitude;
                        userLon = position.coords.longitude;
                        
                        // Get city name from coordinates (reverse geocoding)
                        try {
                            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${userLat}&lon=${userLon}&format=json`);
                            const data = await response.json();
                            const city = data.address.city || data.address.town || data.address.village || data.address.county || 'Your Location';
                            const state = data.address.state || 'GA';
                            locationName = `${city}, ${state}`;
                        } catch (e) {
                            locationName = 'Your Current Location';
                        }
                        
                        resolve({ lat: userLat, lon: userLon, name: locationName });
                    },
                    (error) => {
                        // Fallback to Peachtree City area if location denied
                        console.warn('Location access denied, using default area');
                        userLat = 33.3968;
                        userLon = -84.5954;
                        locationName = 'Peachtree City Area (Default)';
                        resolve({ lat: userLat, lon: userLon, name: locationName });
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 300000 // 5 minutes
                    }
                );
            });
        }
        
        async function fetchWeather() {
            try {
                // Get user's location first
                await getUserLocation();
                
                // Using Open-Meteo API with user's coordinates
                const weatherURL = `https://api.open-meteo.com/v1/forecast?latitude=${userLat}&longitude=${userLon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,weather_code&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=America/New_York&forecast_days=1`;
                
                const weatherRes = await fetch(weatherURL);
                const weatherData = await weatherRes.json();
                
                // Fetch sunset time for user's location
                const sunsetURL = `https://api.sunrise-sunset.org/json?lat=${userLat}&lng=${userLon}&formatted=0`;
                const sunsetRes = await fetch(sunsetURL);
                const sunsetData = await sunsetRes.json();
                
                displayWeather(weatherData, sunsetData);
                
            } catch (error) {
                console.error('Weather fetch error:', error);
                document.getElementById('weather-content').innerHTML = `
                    <div class="error-message">
                        ⚠️ Unable to load weather data. Please try again later.
                    </div>
                `;
            }
        }

        function getWeatherIcon(code) {
            const icons = {
                0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
                45: '🌫️', 48: '🌫️',
                51: '🌦️', 53: '🌦️', 55: '🌦️',
                61: '🌧️', 63: '🌧️', 65: '🌧️',
                71: '🌨️', 73: '🌨️', 75: '🌨️',
                80: '🌦️', 81: '🌦️', 82: '🌧️',
                95: '⛈️', 96: '⛈️', 99: '⛈️'
            };
            return icons[code] || '🌡️';
        }

        function getWeatherDescription(code) {
            const descriptions = {
                0: 'Clear Sky', 1: 'Mainly Clear', 2: 'Partly Cloudy', 3: 'Overcast',
                45: 'Foggy', 48: 'Foggy',
                51: 'Light Drizzle', 53: 'Drizzle', 55: 'Heavy Drizzle',
                61: 'Light Rain', 63: 'Rain', 65: 'Heavy Rain',
                71: 'Light Snow', 73: 'Snow', 75: 'Heavy Snow',
                80: 'Light Showers', 81: 'Showers', 82: 'Heavy Showers',
                95: 'Thunderstorm', 96: 'Thunderstorm with Hail', 99: 'Severe Thunderstorm'
            };
            return descriptions[code] || 'Unknown';
        }

        function displayWeather(weather, sunset) {
            const current = weather.current;
            const hourly = weather.hourly;
            const now = new Date();
            const hour = now.getHours();
            const isWeekend = (now.getDay() === 0 || now.getDay() === 6);
            
            // Build alerts
            let alertsHTML = '';
            
            // High wind alert
            if (current.wind_speed_10m >= 25) {
                alertsHTML += `
                    <div class="warning-banner">
                        <div class="alert-title">💨 HIGH WIND ADVISORY</div>
                        <div class="alert-description">Winds at ${Math.round(current.wind_speed_10m)} mph. Use caution when driving, especially with high-profile vehicles. Secure loose items.</div>
                    </div>
                `;
            }
            
            // Temperature extreme alerts
            if (current.temperature_2m >= 95) {
                alertsHTML += `
                    <div class="warning-banner">
                        <div class="alert-title">🌡️ EXCESSIVE HEAT WARNING</div>
                        <div class="alert-description">Temperature at ${Math.round(current.temperature_2m)}°F. Stay hydrated, take breaks in air conditioning, and check vehicle cooling system.</div>
                    </div>
                `;
            } else if (current.temperature_2m <= 32) {
                alertsHTML += `
                    <div class="warning-banner">
                        <div class="alert-title">🥶 FREEZING TEMPERATURE ALERT</div>
                        <div class="alert-description">Temperature at ${Math.round(current.temperature_2m)}°F. Watch for ice on roads, bridges, and overpasses. Allow extra time for vehicle warm-up.</div>
                    </div>
                `;
            }
            
            // Severe weather alerts
            if (current.weather_code >= 95) {
                alertsHTML += `
                    <div class="alert-banner">
                        <div class="alert-title">⛈️ SEVERE WEATHER ALERT</div>
                        <div class="alert-description">Thunderstorms expected. Exercise extreme caution while driving. Contact dispatch immediately if conditions deteriorate.</div>
                    </div>
                `;
            } else if (current.weather_code >= 71 && current.weather_code <= 75) {
                alertsHTML += `
                    <div class="alert-banner">
                        <div class="alert-title">❄️ WINTER WEATHER ALERT</div>
                        <div class="alert-description">Snow conditions expected. Roads may be impassable. Drive safely and allow extra time for deliveries.</div>
                    </div>
                `;
            } else if (current.weather_code >= 61 && current.weather_code <= 65) {
                alertsHTML += `
                    <div class="warning-banner">
                        <div class="alert-title">🌧️ WET ROAD CONDITIONS</div>
                        <div class="alert-description">Rain expected today. Roads may be slippery. Increase following distance and reduce speed.</div>
                    </div>
                `;
            } else if (current.weather_code >= 45 && current.weather_code <= 48) {
                alertsHTML += `
                    <div class="warning-banner">
                        <div class="alert-title">🌫️ FOG / LOW VISIBILITY</div>
                        <div class="alert-description">Foggy conditions reducing visibility. Use low-beam headlights, reduce speed, and increase following distance.</div>
                    </div>
                `;
            }
            
            // Peak hour warning (weekday only)
            if (!isWeekend && ((hour >= 7 && hour <= 9) || (hour >= 16 && hour <= 19))) {
                alertsHTML += `
                    <div class="warning-banner">
                        <div class="alert-title">⏰ PEAK HOURS ALERT</div>
                        <div class="alert-description">Heavy traffic expected on major routes. Allow extra delivery time and use alternate routes when possible.</div>
                    </div>
                `;
            }
            
            // Weekend light traffic notice
            if (isWeekend && hour >= 10 && hour <= 15) {
                alertsHTML += `
                    <div style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); border-radius: var(--radius); padding: var(--space-md); margin-bottom: var(--space-md); border: 2px solid #34d399;">
                        <div style="font-size: var(--font-md); font-weight: 800; margin-bottom: var(--space-xs); text-transform: uppercase; color: #1C1C1E;">✅ WEEKEND - LIGHT TRAFFIC</div>
                        <div style="font-size: var(--font-sm); line-height: 1.5; color: #1C1C1E;">Reduced traffic expected. Good conditions for deliveries.</div>
                    </div>
                `;
            }
            
            // Early morning optimal conditions
            if (hour >= 5 && hour < 7) {
                alertsHTML += `
                    <div style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); border-radius: var(--radius); padding: var(--space-md); margin-bottom: var(--space-md); border: 2px solid #34d399;">
                        <div style="font-size: var(--font-md); font-weight: 800; margin-bottom: var(--space-xs); text-transform: uppercase; color: #1C1C1E;">🌅 EARLY MORNING - OPTIMAL CONDITIONS</div>
                        <div style="font-size: var(--font-sm); line-height: 1.5; color: #1C1C1E;">Light traffic and good visibility. Excellent time for deliveries.</div>
                    </div>
                `;
            }
            
            // Build hourly forecast (next 12 hours)
            let hourlyHTML = '';
            const currentHour = now.getHours();
            
            for (let i = 0; i < 12; i++) {
                const hourIndex = currentHour + i;
                if (hourIndex >= hourly.time.length) break;
                
                const time = new Date(hourly.time[hourIndex]);
                const temp = Math.round(hourly.temperature_2m[hourIndex]);
                const pop = hourly.precipitation_probability[hourIndex];
                const code = hourly.weather_code[hourIndex];
                
                hourlyHTML += `
                    <div class="hourly-item">
                        <div class="hourly-time">${time.getHours() === currentHour ? 'Now' : time.toLocaleTimeString('en-US', {hour: 'numeric'})}</div>
                        <div class="hourly-icon">${getWeatherIcon(code)}</div>
                        <div class="hourly-temp">${temp}°</div>
                        ${pop > 0 ? `<div class="hourly-pop">💧 ${pop}%</div>` : ''}
                    </div>
                `;
            }
            
            // Format sunset time
            const sunsetTime = new Date(sunset.results.sunset);
            const sunsetFormatted = sunsetTime.toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit'
            });
            
            document.getElementById('weather-content').innerHTML = `
                ${alertsHTML}
                
                <div class="current-weather">
                    <div style="font-size: 48px;">${getWeatherIcon(current.weather_code)}</div>
                    <div class="temp-display">${Math.round(current.temperature_2m)}°F</div>
                    <div class="condition">${getWeatherDescription(current.weather_code)}</div>
                    <div class="feels-like">Feels like ${Math.round(current.apparent_temperature)}°F</div>
                    
                    <div class="weather-details">
                        <div class="detail-item">
                            <div class="detail-label">Humidity</div>
                            <div class="detail-value">${current.relative_humidity_2m}%</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Wind</div>
                            <div class="detail-value">${Math.round(current.wind_speed_10m)} mph</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Precipitation</div>
                            <div class="detail-value">${current.precipitation}"</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Location</div>
                            <div class="detail-value">${locationName}</div>
                        </div>
                    </div>
                </div>
                
                <div class="section-title">📅 Hourly Forecast</div>
                <div class="hourly-forecast">
                    ${hourlyHTML}
                </div>
                
                <div class="sunset-info">
                    <div class="sunset-label">🌅 Sunset Today</div>
                    <div class="sunset-time">${sunsetFormatted}</div>
                </div>
                
                <div class="section-title">🗺️ Your Location & Area Map</div>
                
                <div class="map-container">
                    <div id="traffic-map"></div>
                </div>
                
                <div class="legend">
                    <div class="legend-title">🗺️ Map Legend</div>
                    <div class="legend-items">
                        <div class="legend-item">
                            <div style="width: 20px; height: 20px; background: #1E88E5; border-radius: 50%; margin-right: 8px;"></div>
                            <span>📍 Your Location</span>
                        </div>
                        <div class="legend-item">
                            <div style="width: 20px; height: 4px; background: #42A5F5; border-radius: 2px; margin-right: 8px; opacity: 0.5;"></div>
                            <span>Delivery Area</span>
                        </div>
                    </div>
                    <div style="margin-top: var(--space-md); padding-top: var(--space-md); border-top: 1px solid rgba(255,255,255,0.1);">
                        <div class="legend-title" style="margin-top: 0;">🚦 Traffic Flow (when enabled)</div>
                        <div class="legend-items">
                            <div class="legend-item">
                                <div style="width: 20px; height: 6px; background: #22C55E; border-radius: 2px; margin-right: 8px;"></div>
                                <span>Free Flow</span>
                            </div>
                            <div class="legend-item">
                                <div style="width: 20px; height: 6px; background: #FBBF24; border-radius: 2px; margin-right: 8px;"></div>
                                <span>Moderate Traffic</span>
                            </div>
                            <div class="legend-item">
                                <div style="width: 20px; height: 6px; background: #F97316; border-radius: 2px; margin-right: 8px;"></div>
                                <span>Heavy Traffic</span>
                            </div>
                            <div class="legend-item">
                                <div style="width: 20px; height: 6px; background: #EF4444; border-radius: 2px; margin-right: 8px;"></div>
                                <span>Congested</span>
                            </div>
                        </div>
                    </div>
                    <div style="margin-top: var(--space-sm); font-size: var(--font-xs); color: var(--text-gray);">
                        💡 Zoom and pan the map to explore routes • Traffic updates every 5 minutes
                    </div>
                </div>

                <!-- Traffic Incidents Section -->
                <div id="traffic-incidents-section" style="display: none;">
                    <div class="section-title">🚨 Active Traffic Incidents</div>
                    <div id="traffic-incidents-list"></div>
                </div>
                
                <div class="info-section">
                    <div class="section-title" style="margin-top: 0;">⚠️ Safety Reminders</div>
                    <ul class="info-list">
                        <li class="info-item">🚧 Always check GPS for real-time route updates</li>
                        <li class="info-item">⏰ Allow extra time during peak hours (7-9 AM, 4-7 PM weekdays)</li>
                        <li class="info-item">🌧️ Reduce speed in wet conditions</li>
                        <li class="info-item">📱 Report road hazards via Report Issue feature</li>
                        <li class="info-item">🚨 Call dispatch for severe road closures</li>
                    </ul>
                </div>
                
                <div style="background: rgba(66, 165, 245, 0.1); border-radius: var(--radius); padding: var(--space-md); border-left: 4px solid #42A5F5;">
                    <div style="font-size: var(--font-sm); font-weight: 700; margin-bottom: var(--space-xs); color: #42A5F5;">💡 SMART ALERTS SYSTEM</div>
                    <div style="font-size: var(--font-xs); color: var(--text-gray); line-height: 1.6;">
                        Alerts appear automatically based on current conditions:<br>
                        • Peak traffic hours (weekday rush hours)<br>
                        • Weather conditions (rain, snow, fog, storms)<br>
                        • Temperature extremes (heat, freezing)<br>
                        • High winds (25+ mph)<br>
                        • Optimal delivery times (early morning, weekends)
                    </div>
                </div>
                
                <div class="refresh-notice">
                    💡 Weather & traffic auto-refresh every hour • Last updated: ${new Date().toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'})}
                </div>
            `;
            
            // Initialize OpenStreetMap with user's location
            setTimeout(() => {
                globalMap = L.map('traffic-map').setView([userLat, userLon], 12);
                
                // Add OpenStreetMap tiles (free, no API key needed)
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors',
                    maxZoom: 19
                }).addTo(globalMap);
                
                // Add TomTom Traffic Flow overlay (shows congestion levels)
                if (TOMTOM_API_KEY && TOMTOM_API_KEY !== 'YOUR_TOMTOM_API_KEY') {
                    trafficLayer = L.tileLayer(
                        `https://api.tomtom.com/traffic/map/4/tile/flow/relative/{z}/{x}/{y}.png?key=${TOMTOM_API_KEY}&thickness=10`,
                        {
                            attribution: '© TomTom',
                            maxZoom: 19,
                            opacity: 0.7
                        }
                    ).addTo(globalMap);
                    
                    // Add traffic toggle button
                    const trafficToggle = L.control({position: 'topright'});
                    trafficToggle.onAdd = function() {
                        const div = L.DomUtil.create('div', 'traffic-toggle-btn');
                        div.innerHTML = `
                            <button onclick="toggleTraffic()" style="
                                background: linear-gradient(135deg, #1E88E5, #42A5F5);
                                color: white;
                                border: none;
                                padding: 10px 15px;
                                border-radius: 8px;
                                font-weight: bold;
                                cursor: pointer;
                                box-shadow: 0 2px 8px rgba(0,0,0,0.3);
                                font-size: 13px;
                            ">
                                🚦 Traffic: ON
                            </button>
                        `;
                        return div;
                    };
                    trafficToggle.addTo(globalMap);
                } else {
                    console.warn('TomTom API key not configured - traffic layer disabled');
                }
                
                // Add marker for user's location
                L.marker([userLat, userLon])
                    .addTo(globalMap)
                    .bindPopup(`📍 ${locationName}`)
                    .openPopup();
                
                // Add circle to show delivery area
                L.circle([userLat, userLon], {
                    color: '#1E88E5',
                    fillColor: '#42A5F5',
                    fillOpacity: 0.15,
                    radius: 8000 // 8km radius
                }).addTo(globalMap);
                
                // Fetch and display traffic incidents
                fetchTrafficIncidents().then(incidents => {
                    if (incidents.length > 0) {
                        displayTrafficIncidents(incidents, globalMap);
                    }
                });
            }, 500);
            
            document.getElementById('last-updated').textContent = locationName;
        }

        // Initial load
        fetchWeather();
        
        // Auto-refresh every hour
        setInterval(fetchWeather, UPDATE_INTERVAL);
        
        // Display traffic incidents on map and in list
        function displayTrafficIncidents(incidents, map) {
            const section = document.getElementById('traffic-incidents-section');
            const list = document.getElementById('traffic-incidents-list');
            
            if (!incidents || incidents.length === 0) {
                section.style.display = 'none';
                return;
            }
            
            section.style.display = 'block';
            let incidentsHTML = '';
            
            incidents.forEach(incident => {
                const type = incident.properties?.iconCategory || 'OTHER';
                const description = incident.properties?.description || 'Traffic incident reported';
                const location = incident.properties?.from || 'Unknown location';
                const lat = incident.geometry?.coordinates?.[1];
                const lon = incident.geometry?.coordinates?.[0];
                
                // Get incident icon and color
                let icon = '⚠️';
                let color = '#F59E0B';
                
                if (type.includes('ACCIDENT')) {
                    icon = '🚗💥';
                    color = '#EF4444';
                } else if (type.includes('ROADWORK') || type.includes('CONSTRUCTION')) {
                    icon = '🚧';
                    color = '#FBBF24';
                } else if (type.includes('ROAD_CLOSED')) {
                    icon = '🚫';
                    color = '#DC2626';
                } else if (type.includes('CONGESTION')) {
                    icon = '🐌';
                    color = '#F97316';
                }
                
                // Add to list
                incidentsHTML += `
                    <div style="background: rgba(255, 255, 255, 0.05); border-left: 4px solid ${color}; padding: var(--space-md); margin-bottom: var(--space-sm); border-radius: var(--radius);">
                        <div style="display: flex; align-items: center; gap: var(--space-sm); margin-bottom: var(--space-xs);">
                            <span style="font-size: 20px;">${icon}</span>
                            <span style="font-weight: bold; color: ${color};">${type.replace(/_/g, ' ')}</span>
                        </div>
                        <div style="font-size: var(--font-sm); color: var(--text-gray); margin-bottom: var(--space-xs);">📍 ${location}</div>
                        <div style="font-size: var(--font-sm); line-height: 1.5;">${description}</div>
                    </div>
                `;
                
                // Add marker to map if coordinates available
                if (lat && lon) {
                    const marker = L.circleMarker([lat, lon], {
                        radius: 8,
                        fillColor: color,
                        color: '#ffffff',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).addTo(map);
                    
                    marker.bindPopup(`<strong>${icon} ${type.replace(/_/g, ' ')}</strong><br>${description}`);
                }
            });
            
            list.innerHTML = incidentsHTML;
        }
        
        // Toggle traffic layer on/off
        let trafficVisible = true;
        function toggleTraffic() {
            if (trafficLayer && globalMap) {
                if (trafficVisible) {
                    trafficLayer.remove();
                    document.querySelector('.traffic-toggle-btn button').innerHTML = '🚦 Traffic: OFF';
                    document.querySelector('.traffic-toggle-btn button').style.background = '#666';
                } else {
                    trafficLayer.addTo(globalMap);
                    document.querySelector('.traffic-toggle-btn button').innerHTML = '🚦 Traffic: ON';
                    document.querySelector('.traffic-toggle-btn button').style.background = 'linear-gradient(135deg, #1E88E5, #42A5F5)';
                }
                trafficVisible = !trafficVisible;
            }
        }
    </script>
</body>
</html>
