<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLGP Fleet Portal</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SLGP Fleet">
    <link rel="apple-touch-icon" href="Final-01.jpg">
    
    <style>
        :root {
            --brand-blue: #0066ff;
            --brand-dark: #0a0e17;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--brand-dark);
            background-image: radial-gradient(circle at top right, #1a2a44, var(--brand-dark));
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            margin-top: 20px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container img {
            width: 100%;
            max-width: 280px;
            filter: drop-shadow(0 0 10px rgba(0, 102, 255, 0.3));
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        h2 {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin: 0 0 25px 0;
            letter-spacing: 0.5px;
            color: var(--brand-blue);
            text-transform: uppercase;
        }

        .form-group { margin-bottom: 20px; }
        
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--brand-blue);
            outline: none;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 15px rgba(0, 102, 255, 0.2);
        }

        .toggle-group {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .toggle-btn {
            flex: 1;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-dim);
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toggle-btn.active {
            background: var(--brand-blue);
            color: white;
            border-color: var(--brand-blue);
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.4);
        }

        .upload-area {
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 25px;
            position: relative;
        }

        .upload-area:active { background: rgba(255, 255, 255, 0.08); }

        #fileLabel { font-size: 14px; font-weight: 500; color: var(--text-dim); }

        input[type="file"] {
            position: absolute;
            width: 100%; height: 100%;
            top: 0; left: 0;
            opacity: 0; cursor: pointer;
        }

        #submitBtn {
            background: linear-gradient(135deg, #0066ff, #0044cc);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 14px;
            width: 100%;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        #submitBtn:disabled { opacity: 0.5; filter: grayscale(1); }

        #status {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: var(--text-dim);
        }

        .success-screen { text-align: center; display: none; }
        .success-icon { font-size: 60px; margin-bottom: 20px; }
        
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="Final-01.jpg" alt="Strategic Logistics">
    </div>

    <div class="card" id="mainCard">
        <h2>Fleet Inspection</h2>
        
        <div class="form-group">
            <label>Driver Full Name</label>
            <input type="text" id="driverName" placeholder="Enter Name">
        </div>

        <div class="form-group">
            <label>Last 4 of VIN</label>
            <input type="text" id="vin" placeholder="e.g. 1234" maxlength="4">
        </div>

        <label>Inspection Type</label>
        <div class="toggle-group">
            <div class="toggle-btn active" id="btnPre" onclick="setType('Precheck')">Precheck</div>
            <div class="toggle-btn" id="btnPost" onclick="setType('Postcheck')">Postcheck</div>
        </div>

        <label>Walkaround Video</label>
        <div class="upload-area">
            <span id="fileLabel">📸 Tap to Record Video</span>
            <input type="file" id="videoFile" accept="video/*" capture="environment">
        </div>

        <button id="submitBtn">Submit to Dispatch</button>
        <div id="status">Secure Connection Active</div>
    </div>

    <div class="card success-screen" id="successCard">
        <div class="success-icon">✅</div>
        <h2 style="color: white; margin-bottom: 10px;">Submission Successful</h2>
        <p style="color: var(--text-dim); margin-bottom: 25px;">Your vehicle report has been sent to the Discord Fleet Channel.</p>
        <button onclick="location.reload()" style="background: rgba(255,255,255,0.1); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600;">Submit Another</button>
    </div>
</div>

<script>
    const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1454676273140858932/06AdTvRi9R2NoPhwOva7f4332Gz69G2Uv7a0QS2nLA3erMEmh_taxyQRlDbpyk1-XxVx';

    let inspectionType = 'Precheck';
    const submitBtn = document.getElementById('submitBtn');
    const videoInput = document.getElementById('videoFile');
    const fileLabel = document.getElementById('fileLabel');

    function setType(type) {
        inspectionType = type;
        document.getElementById('btnPre').classList.toggle('active', type === 'Precheck');
        document.getElementById('btnPost').classList.toggle('active', type === 'Postcheck');
    }

    videoInput.onchange = () => {
        if (videoInput.files.length > 0) {
            fileLabel.innerText = "📹 Video Attached: " + Math.round(videoInput.files[0].size/1024/1024) + "MB";
            fileLabel.style.color = "#0066ff";
        }
    };

    submitBtn.onclick = async () => {
        const name = document.getElementById('driverName').value;
        const vin = document.getElementById('vin').value;
        const file = videoInput.files[0];

        if (!name || !vin || !file) {
            alert("All fields are required.");
            return;
        }

        submitBtn.disabled = true;
        document.getElementById('status').innerHTML = "⏳ <b>Uploading Report...</b>";

        const formData = new FormData();
        const messageContent = `**🚨 STRATEGIC LOGISTICS: ${inspectionType.toUpperCase()}**\n**Driver:** \`${name}\`\n**VIN (Last 4):** \`${vin}\`\n**Timestamp:** ${new Date().toLocaleString()}`;
        
        formData.append('payload_json', JSON.stringify({
            content: messageContent,
            username: "SLGP Fleet Portal"
        }));
        formData.append('file', file);

        try {
            const response = await fetch(DISCORD_WEBHOOK_URL, { method: 'POST', body: formData });
            if (response.ok) {
                document.getElementById('mainCard').style.display = 'none';
                document.getElementById('successCard').style.display = 'block';
            } else { throw new Error(); }
        } catch (err) {
            document.getElementById('status').innerHTML = "❌ Upload Failed. Check signal.";
            submitBtn.disabled = false;
        }
    };
</script>

</body>
</html>
