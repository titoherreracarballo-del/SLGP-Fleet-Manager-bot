<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLGP Fleet Health Check v1.1.2</title>
    
    <link rel="apple-touch-icon" href="Final-01.jpg">
    
    <style>
        :root {
            --brand-blue: #0066ff;
            --brand-dark: #0a0e17;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--brand-dark);
            background-image: radial-gradient(circle at top right, #1a2a44, var(--brand-dark));
            color: var(--text-main);
            margin: 0; padding: 15px;
            display: flex; justify-content: center; min-height: 100vh;
        }

        .container { width: 100%; max-width: 420px; margin-top: 10px; }
        .logo-container { text-align: center; margin-bottom: 20px; }
        .logo-container img { width: 100%; max-width: 280px; filter: drop-shadow(0 0 15px rgba(0, 102, 255, 0.4)); }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        h2 { font-size: 16px; font-weight: 800; text-align: center; margin: 0 0 20px 0; color: var(--brand-blue); text-transform: uppercase; }
        label { display: block; font-size: 10px; font-weight: 700; color: var(--brand-blue); margin-bottom: 8px; text-transform: uppercase; }

        input {
            width: 100%; padding: 16px; background: rgba(0, 0, 0, 0.4);
            border: 1.5px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
            color: white; font-size: 16px; box-sizing: border-box; margin-bottom: 20px;
        }

        .toggle-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .toggle-btn {
            flex: 1 1 calc(50% - 8px); padding: 14px;
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; color: var(--text-dim); font-weight: 700;
            text-align: center; text-transform: uppercase; font-size: 11px;
        }

        .active { background: linear-gradient(135deg, #0066ff, #0044cc) !important; color: white !important; box-shadow: 0 4px 15px rgba(0, 102, 255, 0.6); border: 1px solid var(--brand-blue) !important; }
        .disabled-state { opacity: 0.15; pointer-events: none; }

        .upload-area {
            background: rgba(255, 255, 255, 0.02); border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 14px; padding: 25px 15px; text-align: center; cursor: pointer; margin-bottom: 15px;
        }

        #submitBtn {
            background: linear-gradient(135deg, #0066ff, #0044cc);
            color: white; border: none; padding: 18px; border-radius: 14px;
            width: 100%; font-size: 15px; font-weight: 800; text-transform: uppercase; cursor: pointer;
        }
        #submitBtn:disabled { opacity: 0.5; }
        
        #progressBar { width: 0%; height: 8px; background: #4ade80; border-radius: 4px; margin-top: 10px; transition: width 0.3s; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="Final-01.jpg" alt="Strategic Logistics">
    </div>

    <div class="card" id="mainCard">
        <h2>Fleet Health Check</h2>
        
        <label>Driver Full Name</label>
        <input type="text" id="driverName" placeholder="Tito">

        <label>Last 4 of VIN</label>
        <input type="tel" id="vin" placeholder="3754" maxlength="4" oninput="autoDetect()">

        <label>Service Type (Auto-Detect)</label>
        <div class="toggle-group" id="groupVehicle">
            <div class="toggle-btn" id="v_EDV">EDV</div>
            <div class="toggle-btn" id="v_CDV">CDV</div>
            <div class="toggle-btn" id="v_Cargo">Cargo</div>
            <div class="toggle-btn" id="v_Rental">Rental</div>
        </div>

        <label>Inspection Type (Auto-Detect)</label>
        <div class="toggle-group" id="groupType">
            <div class="toggle-btn" id="btnPre">Precheck</div>
            <div class="toggle-btn" id="btnPost">Postcheck</div>
        </div>

        <label>1080p Video Sync</label>
        <div class="upload-area" onclick="document.getElementById('videoFile').click();">
            <span id="fileLabel">Tap to Record 1080p Video</span>
            <input type="file" id="videoFile" accept="video/*" capture="environment" style="display:none;">
        </div>

        <div id="progressContainer" style="display:none;"><div id="progressBar"></div></div>
        <button id="submitBtn">UPLOAD TO GOOGLE DRIVE</button>
        <div id="status" style="text-align:center; font-size:10px; margin-top:10px; color:var(--brand-blue);">System Online</div>
    </div>
</div>

<script>
    // VIN Mapping Data
    const FLEET_MAP = {
        '7867':'EDV','7871':'EDV','9412':'EDV','7872':'EDV','7866':'EDV','7860':'EDV','9418':'EDV','7863':'EDV','7859':'EDV','7857':'EDV',
        '4905':'CDV','7097':'CDV','2347':'CDV','1587':'CDV','6880':'CDV','6907':'CDV','1295':'CDV','6265':'CDV','6188':'CDV','1288':'CDV','6864':'CDV',
        '1051':'Cargo','9488':'Cargo','7088':'Cargo','1664':'Cargo','0871':'Cargo','3010':'Cargo','5344':'Cargo','0890':'Cargo','5341':'Cargo','3754':'Cargo'
    };

    let serviceTypeStr = '';

    function autoDetect() {
        const vin = document.getElementById('vin').value;
        const btns = document.querySelectorAll('#groupVehicle .toggle-btn');
        btns.forEach(b => { b.classList.remove('active'); b.style.pointerEvents = 'none'; });

        if (vin.length === 4) {
            const type = FLEET_MAP[vin];
            if (type) {
                serviceTypeStr = type;
                document.getElementById('v_' + type).classList.add('active');
            } else {
                serviceTypeStr = 'Rental';
                document.getElementById('v_Rental').classList.add('active');
            }
        }
    }

    // Fixed Inspection Auto-Selection Logic
    function checkShiftTime() {
        const now = new Date();
        const mins = (now.getHours() * 60) + now.getMinutes();
        const btnPre = document.getElementById('btnPre');
        const btnPost = document.getElementById('btnPost');

        btnPre.classList.remove('active', 'disabled-state');
        btnPost.classList.remove('active', 'disabled-state');
        btnPre.style.pointerEvents = 'none';
        btnPost.style.pointerEvents = 'none';

        // Precheck: 10:00 AM (600) to 3:00 PM (900)
        if (mins >= 600 && mins <= 900) {
            btnPre.classList.add('active');
            btnPost.classList.add('disabled-state');
        } 
        // Postcheck: 6:00 PM (1080) to 11:30 PM (1410)
        else if (mins >= 1080 && mins <= 1410) {
            btnPost.classList.add('active');
            btnPre.classList.add('disabled-state');
        }
    }

    document.getElementById('videoFile').onchange = (e) => {
        if (e.target.files.length > 0) {
            document.getElementById('fileLabel').innerText = "1080p READY";
        }
    };

    document.getElementById('submitBtn').onclick = async () => {
        const name = document.getElementById('driverName').value;
        const vin = document.getElementById('vin').value;
        const file = document.getElementById('videoFile').files[0];
        const inspection = document.querySelector('#groupType .active');

        if (!name || !vin || !file || !inspection) return alert("Missing fields!");

        document.getElementById('submitBtn').disabled = true;
        document.getElementById('progressContainer').style.display = 'block';

        const formData = new FormData();
        formData.append('driverName', name);
        formData.append('vin', vin);
        formData.append('serviceType', serviceTypeStr);
        formData.append('inspectionType', inspection.innerText);
        formData.append('video', file);

        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/upload-to-google-drive');
        xhr.upload.onprogress = (e) => {
            const pct = Math.round((e.loaded / e.total) * 100);
            document.getElementById('progressBar').style.width = pct + '%';
        };
        xhr.onload = () => {
            if (xhr.status === 200) alert("SUCCESSFULLY SYNCED TO DRIVE!");
            else alert("SYNC FAILED");
            location.reload();
        };
        xhr.send(formData);
    };

    // Run immediately on load
    window.onload = checkShiftTime;
</script>
</body>
</html>
