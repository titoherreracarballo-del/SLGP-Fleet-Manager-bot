<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLGP Fleet Portal</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SLGP Fleet">
    <link rel="apple-touch-icon" href="Final-01.jpg">
    
    <style>
        :root {
            --brand-blue: #0066ff;
            --brand-dark: #0a0e17;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --warning: #ff9d00;
            --error: #ff4d4d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--brand-dark);
            background-image: radial-gradient(circle at top right, #1a2a44, var(--brand-dark));
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 420px; margin-top: 10px; }

        .logo-container { text-align: center; margin-bottom: 20px; }
        .logo-container img { width: 100%; max-width: 280px; filter: drop-shadow(0 0 15px rgba(0, 102, 255, 0.4)); }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-size: 18px;
            font-weight: 800;
            text-align: center;
            margin: 0 0 20px 0;
            letter-spacing: 1px;
            color: var(--brand-blue);
            text-transform: uppercase;
        }

        .form-group { margin-bottom: 20px; }
        
        label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: var(--brand-blue);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        input[type="text"], input[type="tel"] {
            width: 100%;
            padding: 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .toggle-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }

        .toggle-btn {
            flex: 1 1 calc(50% - 8px);
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-dim);
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 11px;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #0066ff, #0044cc);
            color: white;
            border-color: var(--brand-blue);
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.3);
        }

        .toggle-btn.locked {
            opacity: 0.2;
            cursor: not-allowed;
            background: rgba(255,255,255,0.02);
        }

        .upload-area {
            background: rgba(255, 255, 255, 0.02);
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 25px;
            position: relative;
        }

        #fileLabel { font-size: 13px; font-weight: 600; color: var(--text-dim); }

        input[type="file"] { position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer; }

        #submitBtn {
            background: linear-gradient(135deg, #0066ff, #0044cc);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 14px;
            width: 100%;
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            cursor: pointer;
        }

        #submitBtn:disabled { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; }

        #status { margin-top: 15px; text-align: center; font-size: 11px; font-weight: 600; color: var(--brand-blue); }

        .success-screen { text-align: center; display: none; padding: 40px 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="Final-01.jpg" alt="Strategic Logistics">
    </div>

    <div class="card" id="mainCard">
        <h2>Fleet Inspection</h2>
        
        <div class="form-group">
            <label>Driver Full Name</label>
            <input type="text" id="driverName" placeholder="Full Name">
        </div>

        <div class="form-group">
            <label>Last 4 of VIN</label>
            <input type="tel" id="vin" placeholder="e.g. 1234" maxlength="4" pattern="\d*">
        </div>

        <label>Vehicle Type</label>
        <div class="toggle-group" id="groupVehicle">
            <div class="toggle-btn active" onclick="setVehicle('CDV')">CDV</div>
            <div class="toggle-btn" onclick="setVehicle('Cargo')">Cargo</div>
            <div class="toggle-btn" onclick="setVehicle('EDV')">EDV</div>
            <div class="toggle-btn" onclick="setVehicle('Rental')">Rental</div>
        </div>

        <label>Inspection Type</label>
        <div class="toggle-group" id="groupType">
            <div class="toggle-btn" id="btnPre" onclick="setType('Precheck')">Precheck</div>
            <div class="toggle-btn" id="btnPost" onclick="setType('Postcheck')">Postcheck</div>
        </div>

        <label>Walkaround Video</label>
        <div class="upload-area">
            <div id="fileLabel">
                <span>📸 Tap to Record Video</span>
                <br>
                <span style="font-size: 10px; color: var(--warning);">(Required: 720p HD Only)</span>
            </div>
            <input type="file" id="videoFile" accept="video/*" capture="environment">
        </div>

        <button id="submitBtn">SUBMIT TO DISCORD</button>
        <div id="status">Verifying Schedule...</div>
    </div>

    <div class="card success-screen" id="successCard">
        <h1 style="font-size: 60px;">✅</h1>
        <h2>REPORT SENT</h2>
        <p style="color: var(--text-dim);">Inspection transmitted successfully.</p>
        <button onclick="location.reload()" style="background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 12px 25px; border-radius: 10px;">New Submission</button>
    </div>
</div>

<script>
    const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1454676273140858932/06AdTvRi9R2NoPhwOva7f4332Gz69G2Uv7a0QS2nLA3erMEmh_taxyQRlDbpyk1-XxVx';
    const MAX_FILE_SIZE_MB = 25; // Discord limit

    let inspectionType = '';
    let vehicleType = 'CDV';
    
    const submitBtn = document.getElementById('submitBtn');
    const videoInput = document.getElementById('videoFile');
    const statusMsg = document.getElementById('status');
    const fileLabel = document.getElementById('fileLabel');

    function checkTimeLock() {
        const now = new Date();
        const hrs = now.getHours();
        const mins = now.getMinutes();
        const total = (hrs * 60) + mins;

        // User requested schedule
        const amStart = (10 * 60) + 20; // 10:20 AM
        const amEnd = (15 * 60);        // 3:00 PM
        const pmStart = (18 * 60);      // 6:00 PM
        const pmEnd = (23 * 60) + 59;   // 11:59 PM

        const btnPre = document.getElementById('btnPre');
        const btnPost = document.getElementById('btnPost');

        if (total >= amStart && total <= amEnd) {
            btnPost.classList.add('locked');
            btnPost.onclick = null;
            setType('Precheck');
            statusMsg.innerText = "AM PRECHECK ACTIVE";
        } 
        else if (total >= pmStart && total <= pmEnd) {
            btnPre.classList.add('locked');
            btnPre.onclick = null;
            setType('Postcheck');
            statusMsg.innerText = "PM POSTCHECK ACTIVE";
        } 
        else {
            btnPre.classList.add('locked'); btnPost.classList.add('locked');
            btnPre.onclick = null; btnPost.onclick = null;
            submitBtn.disabled = true;
            statusMsg.innerText = "OFF-SCHEDULE: PORTAL CLOSED";
            statusMsg.style.color = "var(--error)";
        }
    }

    function setType(type) {
        if (document.getElementById('btn' + type).classList.contains('locked')) return;
        inspectionType = type;
        document.getElementById('btnPre').classList.toggle('active', type === 'Precheck');
        document.getElementById('btnPost').classList.toggle('active', type === 'Postcheck');
    }

    function setVehicle(v) {
        vehicleType = v;
        const btns = document.querySelectorAll('#groupVehicle .toggle-btn');
        btns.forEach(b => b.classList.toggle('active', b.innerText.toUpperCase() === v.toUpperCase()));
    }

    // --- SIZE CHECK LOGIC ---
    videoInput.onchange = () => {
        if (videoInput.files.length > 0) {
            const file = videoInput.files[0];
            const sizeMB = (file.size / (1024 * 1024)).toFixed(1);

            if (sizeMB > MAX_FILE_SIZE_MB) {
                alert(`FILE TOO LARGE: ${sizeMB}MB\n\nYour camera is likely set to 1080p or 4K. Please go to Camera Settings, switch to 720p HD, and record again.`);
                videoInput.value = ""; // Clear file
                fileLabel.innerHTML = `<span style="color: var(--error);">❌ VIDEO REJECTED: TOO LARGE</span><br><span style="font-size:10px;">Switch Camera to 720p</span>`;
                submitBtn.disabled = true;
            } else {
                fileLabel.innerHTML = `<span style="color: #4ade80;">📹 VIDEO READY (${sizeMB}MB)</span>`;
                submitBtn.disabled = false;
            }
        }
    };

    submitBtn.onclick = async () => {
        const name = document.getElementById('driverName').value.trim();
        const vin = document.getElementById('vin').value.trim();
        const file = videoInput.files[0];

        if (!name || !vin || !file || !inspectionType) {
            alert("Complete all fields."); return;
        }

        submitBtn.disabled = true;
        statusMsg.innerHTML = "⏳ UPLOADING...";

        const formData = new FormData();
        const content = `**🚨 STRATEGIC LOGISTICS: ${inspectionType.toUpperCase()}**\n**Driver:** \`${name}\`\n**Vehicle:** \`${vehicleType}\`\n**VIN:** \`${vin}\`\n**Time:** ${new Date().toLocaleString()}`;
        
        formData.append('payload_json', JSON.stringify({ content: content, username: "SLGP Fleet Portal" }));
        formData.append('file', file);

        try {
            const response = await fetch(DISCORD_WEBHOOK_URL, { method: 'POST', body: formData });
            if (response.ok) {
                document.getElementById('mainCard').style.display = 'none';
                document.getElementById('successCard').style.display = 'block';
            } else { throw new Error(); }
        } catch (err) {
            statusMsg.innerHTML = "❌ UPLOAD FAILED.";
            submitBtn.disabled = false;
        }
    };

    checkTimeLock();
</script>

</body>
</html>
