<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLGP Fleet Health Check v1.2.1</title>
    <link rel="apple-touch-icon" href="Final-01.jpg">
    <style>
        :root { --brand-blue: #0066ff; --brand-dark: #0a0e17; --card-bg: rgba(255, 255, 255, 0.05); --success-green: #4ade80; }
        body { font-family: sans-serif; background-color: var(--brand-dark); color: white; padding: 15px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 420px; }
        .logo-container { text-align: center; margin-bottom: 20px; }
        .logo-container img { width: 100%; max-width: 280px; filter: drop-shadow(0 0 15px rgba(0, 102, 255, 0.4)); }
        .card { background: var(--card-bg); backdrop-filter: blur(20px); border-radius: 28px; padding: 25px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .form-group { margin-bottom: 20px; position: relative; }
        label { display: block; font-size: 10px; font-weight: 700; color: var(--brand-blue); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1.2px; }
        .success-indicator { position: absolute; right: 15px; bottom: 16px; color: var(--success-green); font-weight: bold; display: none; }
        input { width: 100%; padding: 16px; background: rgba(0,0,0,0.4); border: 1.5px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; box-sizing: border-box; }
        .toggle-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .toggle-btn { flex: 1 1 calc(50% - 8px); padding: 14px; background: rgba(255,255,255,0.05); border-radius: 12px; color: #a0a0a0; font-weight: 700; text-align: center; font-size: 11px; text-transform: uppercase; }
        .toggle-btn.active { background: var(--brand-blue); color: white; }
        .upload-area { background: rgba(255,255,255,0.02); border: 2px dashed rgba(255,255,255,0.15); border-radius: 14px; padding: 25px; text-align: center; position: relative; margin-bottom: 15px; }
        #submitBtn { width: 100%; padding: 18px; border-radius: 14px; background: var(--brand-blue); color: white; font-weight: 800; text-transform: uppercase; border: none; cursor: pointer; }
        #status { margin-top: 15px; text-align: center; font-size: 11px; color: var(--brand-blue); }
    </style>
</head>
<body>
<div class="container">
    <div class="logo-container"><img src="Final-01.jpg" alt="SLGP"></div>
    <div class="card" id="mainCard">
        <div id="timestampDisplay" style="text-align:center; font-size:11px; color:var(--success-green); font-weight:bold; margin-bottom:20px;">LOADING...</div>
        <div class="form-group"><label>Driver Full Name</label><input type="text" id="driverName" placeholder="Tito" oninput="validateName()"><span id="check_name" class="success-indicator">✓</span></div>
        <div class="form-group"><label>Last 4 of VIN</label><input type="tel" id="vin" placeholder="3754" maxlength="4" oninput="autoDetectVehicle()"><span id="check_vin" class="success-indicator">✓</span></div>
        <label>Service Type</label>
        <div class="toggle-group"><div class="toggle-btn" id="v_EDV">EDV</div><div class="toggle-btn" id="v_CDV">CDV</div><div class="toggle-btn" id="v_Cargo">Cargo</div><div class="toggle-btn" id="v_Rental">Rental</div></div>
        <label>Inspection</label>
        <div class="toggle-group"><div class="toggle-btn" id="btnPre">Precheck</div><div class="toggle-btn" id="btnPost">Postcheck</div></div>
        <div class="upload-area" id="uploadBox">
            <div id="fileLabel"><span>Tap to Record 1080p Video</span><br><span style="font-size:9px; color:var(--success-green);">HD BITRATE ENABLED</span></div>
            <input type="file" id="videoFile" accept="video/*" capture="environment" style="position:absolute; width:100%; height:100%; top:0; left:0; opacity:0;"><span id="check_video" class="success-indicator" style="top:10px; right:10px;">✓</span>
        </div>
        <button id="submitBtn">UPLOAD TO GOOGLE DRIVE</button>
        <div id="status">System Online</div>
    </div>
</div>
<script>
    const FLEET_MAP = {'7867':'EDV','4905':'CDV','1051':'Cargo','3754':'Cargo'}; // Complete map as before
    let serviceTypeStr = '';
    function validateName() { document.getElementById('check_name').style.display = (document.getElementById('driverName').value.length > 2) ? 'block' : 'none'; }
    function autoDetectVehicle() {
        const vin = document.getElementById('vin').value;
        const btns = document.querySelectorAll('#groupVehicle .toggle-btn');
        if (vin.length === 4) {
            document.getElementById('check_vin').style.display = 'block';
            const type = FLEET_MAP[vin] || 'Rental'; serviceTypeStr = type;
            document.getElementById('v_' + type).classList.add('active');
        } else { document.getElementById('check_vin').style.display = 'none'; }
    }
    document.getElementById('videoFile').onchange = (e) => {
        if (e.target.files.length > 0) {
            document.getElementById('check_video').style.display = 'block';
            document.getElementById('fileLabel').innerText = "1080p READY";
        }
    };
    // ...[Shift logic code same as v1.2.0]
    document.getElementById('submitBtn').onclick = async () => { /* AJAX code from v1.2.0 */ };
</script>
</body>
</html>
