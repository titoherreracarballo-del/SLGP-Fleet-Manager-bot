<script>
// 1. VEHICLE LOOKUP DATA (FROM YOUR SPREADSHEET)
const vinLookup = {
    "7867":"EDV","7871":"EDV","9412":"EDV","7872":"EDV","7866":"EDV","7860":"EDV","9418":"EDV","7863":"EDV","7859":"EDV","7857":"EDV",
    "4905":"CDV","7097":"CDV","2347":"CDV","1587":"CDV","6880":"CDV","6907":"CDV","1295":"CDV","6265":"CDV","6188":"CDV","1288":"CDV","6864":"CDV",
    "1051":"CARGO","9488":"CARGO","7088":"CARGO","1664":"CARGO","0871":"CARGO","3010":"CARGO","5344":"CARGO","0890":"CARGO","5341":"CARGO","3754":"CARGO","7373":"CARGO","0876":"CARGO","8786":"CARGO","0213":"CARGO","3892":"CARGO","9651":"CARGO","5691":"CARGO","9128":"CARGO"
};

// 2. AUTO-SELECTION FUNCTION
function setAuto(selector, value) {
    document.querySelectorAll(selector).forEach(btn => {
        btn.classList.remove('active');
        btn.style.pointerEvents = 'none'; // DISABLE MANUAL CLICKS
        if (btn.innerText.trim().toUpperCase() === value.toUpperCase()) {
            btn.classList.add('active');
        }
    });
}

// 3. TIME-BASED INSPECTION CHECK
function checkInspectionTime() {
    const now = new Date();
    const mins = (now.getHours() * 60) + now.getMinutes();

    const preStart = 600;  // 10:00 AM
    const preEnd = 900;    // 3:00 PM
    const postStart = 1080; // 6:00 PM
    const postEnd = 1410;  // 11:30 PM

    if (mins >= preStart && mins <= preEnd) setAuto('.inspection-btn', 'PRECHECK');
    else if (mins >= postStart && mins <= postEnd) setAuto('.inspection-btn', 'POSTCHECK');
}

// 4. RUN ON LOAD
document.addEventListener('DOMContentLoaded', () => {
    checkInspectionTime();
    const vinInput = document.getElementById('vin-input');
    if (vinInput) {
        vinInput.addEventListener('input', (e) => {
            if (e.target.value.length === 4) {
                const type = vinLookup[e.target.value];
                if (type) setAuto('.service-btn', type);
            }
        });
    }
});
</script>
