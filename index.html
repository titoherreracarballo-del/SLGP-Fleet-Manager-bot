<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLGP Fleet Health Check v1.2</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --brand-blue: #0066ff;
            --brand-dark: #0a0e17;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--brand-dark);
            background-image: radial-gradient(circle at top right, #1a2a44, var(--brand-dark));
            color: var(--text-main);
            margin: 0; padding: 15px; display: flex; justify-content: center; min-height: 100vh;
        }
        .container { width: 100%; max-width: 420px; margin-top: 10px; }
        .card {
            background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 28px; padding: 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }
        h2 { color: var(--brand-blue); text-align: center; text-transform: uppercase; margin-bottom: 20px; font-size: 16px; letter-spacing: 1px; }
        label { display: block; font-size: 10px; font-weight: 700; color: var(--brand-blue); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1.2px; }
        input[type="text"], input[type="tel"] {
            width: 100%; padding: 16px; background: rgba(0, 0, 0, 0.4);
            border: 1.5px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
            color: white; font-size: 16px; box-sizing: border-box; margin-bottom: 20px;
        }
        .toggle-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .toggle-btn {
            flex: 1 1 calc(50% - 8px); padding: 14px;
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; color: var(--text-dim); font-weight: 700;
            text-align: center; transition: all 0.3s; text-transform: uppercase; font-size: 11px; cursor: pointer;
        }
        .toggle-btn.active { 
            background: linear-gradient(135deg, #0066ff, #0044cc); color: white; border-color: var(--brand-blue); 
            box-shadow: 0 4px 15px rgba(0, 102, 255, 0.6);
        }
        .upload-area {
            background: rgba(255, 255, 255, 0.02); border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 14px; padding: 25px 15px; text-align: center; cursor: pointer; margin-bottom: 15px; position: relative;
        }
        #submitBtn {
            background: linear-gradient(135deg, #0066ff, #0044cc); color: white; border: none; padding: 18px; 
            border-radius: 14px; width: 100%; font-size: 15px; font-weight: 800; text-transform: uppercase; cursor: pointer;
        }
        #submitBtn:disabled { opacity: 0.5; filter: grayscale(1); }
        #progressContainer { width: 100%; background: rgba(255,255,255,0.1); border-radius: 10px; height: 10px; margin: 15px 0; display: none; overflow: hidden; }
        #progressBar { width: 0%; height: 100%; background: linear-gradient(90deg, #0066ff, #4ade80); transition: width 0.3s; }
        
        #liveClock {
            text-align: center; font-family: monospace; font-size: 14px; color: #4ade80; 
            margin-bottom: 15px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 8px;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container" style="text-align:center; margin-bottom:20px;">
        <img src="Final-01.jpg" style="max-width:280px; filter: drop-shadow(0 0 15px rgba(0,102,255,0.4));" alt="Logo">
    </div>

    <div class="card" id="mainCard">
        <h2>Fleet Health Check</h2>

        <div id="liveClock">Loading Date/Time...</div>

        <div class="form-group">
            <label>Driver Full Name</label>
            <input type="text" id="driverName" placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label>Last 4 of VIN</label>
            <input type="tel" id="vin" placeholder="Type 4 digits" maxlength="4" pattern="\d*" oninput="autoDetectVehicle()">
        </div>

        <label>Service Type</label>
        <div class="toggle-group" id="groupVehicle">
            <div class="toggle-btn" id="v_EDV">EDV</div>
            <div class="toggle-btn" id="v_CDV">CDV</div>
            <div class="toggle-btn" id="v_Cargo">Cargo</div>
            <div class="toggle-btn" id="v_Rental">Rental</div>
        </div>

        <label>Inspection Type (Auto-Selected)</label>
        <div class="toggle-group" id="groupType">
            <div class="toggle-btn" id="btnPre" onclick="manualSet('Precheck')">Precheck</div>
            <div class="toggle-btn" id="btnPost" onclick="manualSet('Postcheck')">Postcheck</div>
        </div>

        <label>1080p HD Video (Max 200MB)</label>
        <div class="upload-area">
            <div id="fileLabel">
                <span>Tap to Record Video</span><br>
                <span style="font-size: 9px; color: #4ade80;">1080p SUPPORTED</span>
            </div>
            <input type="file" id="videoFile" accept="video/*" capture="environment" style="position:absolute; width:100%; height:100%; top:0; left:0; opacity:0; cursor:pointer;">
        </div>

        <div id="progressContainer"><div id="progressBar"></div></div>
        <div id="status" style="text-align:center; font-size:11px; margin-top:10px; color:#0066ff;">System Online</div>
        
        <button id="submitBtn">UPLOAD TO GOOGLE DRIVE</button>
    </div>

    <div class="card" id="successCard" style="display:none; text-align:center;">
        <div style="font-size: 60px; margin-bottom: 20px;">✅</div>
        <h2>UPLOAD SUCCESSFUL</h2>
        <button onclick="location.reload()" style="background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 12px 25px; border-radius: 10px; margin-top: 20px;">New Submission</button>
    </div>
</div>

<script>
    const FLEET_MAP = {
        '7867': 'Electric RPV Medium', '7871': 'Electric RPV Medium', '9412': 'Electric RPV Medium'
    };

    let inspectionType = '';
    let serviceTypeStr = '';
    
    function updateTimeLogic() {
        const now = new Date();
        document.getElementById('liveClock').innerText = now.toLocaleString();
        const hour = now.getHours();
        
        document.getElementById('btnPre').classList.remove('active');
        document.getElementById('btnPost').classList.remove('active');

        if (hour >= 10 && hour < 15) { manualSet('Precheck'); } 
        else if (hour >= 18) { manualSet('Postcheck'); }
    }

    setInterval(updateTimeLogic, 1000);
    updateTimeLogic();

    function manualSet(type) {
        inspectionType = type;
        document.getElementById('btnPre').classList.toggle('active', type === 'Precheck');
        document.getElementById('btnPost').classList.toggle('active', type === 'Postcheck');
    }

    function autoDetectVehicle() {
        const vin = document.getElementById('vin').value;
        document.querySelectorAll('#groupVehicle .toggle-btn').forEach(b => b.classList.remove('active'));
        
        if (vin.length === 4) {
            if (FLEET_MAP[vin]) {
                serviceTypeStr = FLEET_MAP[vin];
                if (serviceTypeStr.includes('Electric')) document.getElementById('v_EDV').classList.add('active');
                else if (serviceTypeStr.includes('CDV')) document.getElementById('v_CDV').classList.add('active');
                else document.getElementById('v_Cargo').classList.add('active');
            } else {
                serviceTypeStr = 'Rental/External';
                document.getElementById('v_Rental').classList.add('active');
            }
        }
    }

    document.getElementById('videoFile').onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
            if (sizeMB > 199) {
                alert(`File too large (${sizeMB}MB). Limit is 200MB.`);
                document.getElementById('submitBtn').disabled = true;
            } else {
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('fileLabel').innerHTML = `<span style="color:#4ade80">READY: ${sizeMB}MB</span>`;
                document.getElementById('status').innerText = `SIZE OK: ${sizeMB}MB`;
            }
        }
    };

    document.getElementById('submitBtn').onclick = () => {
        const name = document.getElementById('driverName').value;
        const vin = document.getElementById('vin').value;
        const file = document.getElementById('videoFile').files[0];

        if (!name || !vin || !file || !inspectionType || !serviceTypeStr) {
            alert("Please fill in all fields."); return;
        }

        document.getElementById('submitBtn').disabled = true;
        document.getElementById('progressContainer').style.display = 'block';
        document.getElementById('status').innerText = "UPLOADING 1080p VIDEO...";

        const formData = new FormData();
        formData.append('file', file);
        formData.append('driver', name);
        formData.append('vin', vin);

        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/upload');

        xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
                const percent = Math.round((e.loaded / e.total) * 100);
                document.getElementById('progressBar').style.width = percent + '%';
                document.getElementById('status').innerText = `UPLOADING: ${percent}%`;
            }
        };

        xhr.onload = () => {
            if (xhr.status === 200) {
                document.getElementById('mainCard').style.display = 'none';
                document.getElementById('successCard').style.display = 'block';
            } else {
                alert("Upload failed.");
                document.getElementById('submitBtn').disabled = false;
            }
        };

        xhr.send(formData);
    };
</script>
</body>
</html>
