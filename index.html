<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLGP Fleet Portal</title>
    
    <style>
        :root {
            --brand-blue: #0066ff;
            --brand-dark: #0a0e17;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--brand-dark);
            background-image: radial-gradient(circle at top right, #1a2a44, var(--brand-dark));
            color: var(--text-main);
            margin: 0; padding: 15px;
            display: flex; justify-content: center; min-height: 100vh;
        }

        .container { width: 100%; max-width: 420px; }
        .logo-container { text-align: center; margin: 20px 0; }
        .logo-container img { width: 100%; max-width: 250px; }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .info-pill {
            background: rgba(0, 102, 255, 0.2);
            border: 1px solid var(--brand-blue);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            display: none; /* Hidden unless QR is used */
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 10px; font-weight: 700; color: var(--brand-blue); margin-bottom: 8px; text-transform: uppercase; }
        
        input[type="text"] {
            width: 100%; padding: 16px; background: rgba(0, 0, 0, 0.4);
            border: 1.5px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
            color: white; font-size: 16px; box-sizing: border-box;
        }

        .toggle-group { display: flex; gap: 8px; margin-bottom: 20px; }
        .toggle-btn {
            flex: 1; padding: 14px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
            color: var(--text-dim); font-weight: 700; text-align: center; text-transform: uppercase; font-size: 11px;
        }
        .toggle-btn.active { background: linear-gradient(135deg, #0066ff, #0044cc); color: white; }
        .toggle-btn.locked { opacity: 0.2; cursor: not-allowed; }

        .upload-area {
            background: rgba(255, 255, 255, 0.02); border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 14px; padding: 30px; text-align: center; margin-bottom: 15px; position: relative;
        }
        input[type="file"] { position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; }

        #timestampDisplay { text-align: center; font-size: 11px; color: #4ade80; font-weight: bold; margin-bottom: 15px; display: none; }

        #submitBtn {
            background: linear-gradient(135deg, #0066ff, #0044cc);
            color: white; border: none; padding: 18px; border-radius: 14px;
            width: 100%; font-size: 15px; font-weight: 800; text-transform: uppercase;
        }
        #submitBtn:disabled { opacity: 0.5; }
        #status { margin-top: 15px; text-align: center; font-size: 11px; font-weight: 600; color: var(--brand-blue); }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="Final-01.jpg" alt="Strategic Logistics">
    </div>

    <div class="card" id="mainCard">
        <div id="qrInfo" class="info-pill"></div>

        <div class="form-group">
            <label>Driver Full Name</label>
            <input type="text" id="driverName" placeholder="Full Name">
        </div>

        <div class="form-group" id="manualVinGroup">
            <label>Last 4 of VIN</label>
            <input type="text" id="vin" placeholder="Type 4 digits" maxlength="4">
        </div>

        <label>Inspection Type</label>
        <div class="toggle-group" id="groupType">
            <div class="toggle-btn" id="btnPre" onclick="setType('Precheck')">Precheck</div>
            <div class="toggle-btn" id="btnPost" onclick="setType('Postcheck')">Postcheck</div>
        </div>

        <label>Walkaround Video</label>
        <div class="upload-area">
            <span id="fileLabel">📸 Tap to Record Video</span>
            <input type="file" id="videoFile" accept="video/*" capture="environment">
        </div>

        <div id="timestampDisplay"></div>

        <button id="submitBtn">SUBMIT TO DISCORD</button>
        <div id="status">Checking schedule...</div>
    </div>
</div>

<script>
    const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1454676273140858932/06AdTvRi9R2NoPhwOva7f4332Gz69G2Uv7a0QS2nLA3erMEmh_taxyQRlDbpyk1-XxVx';

    let inspectionType = '';
    let autoVin = '';
    let autoType = '';
    let captureTimestamp = '';

    // --- AUTO-READ QR PARAMETERS ---
    function loadFromUrl() {
        const params = new URLSearchParams(window.location.search);
        autoVin = params.get('vin');
        autoType = params.get('type');

        if (autoVin && autoType) {
            document.getElementById('manualVinGroup').style.display = 'none';
            const info = document.getElementById('qrInfo');
            info.innerText = `VEHICLE IDENTIFIED: ${autoType} (VIN: ${autoVin})`;
            info.style.display = 'block';
        }
    }

    function checkTimeLock() {
        const now = new Date();
        const mins = (now.getHours() * 60) + now.getMinutes();
        const amStart = (10 * 60) + 20; // 10:20 AM
        const amEnd = (15 * 60);        // 3:00 PM
        const pmStart = (18 * 60);      // 6:00 PM
        const pmEnd = (23 * 60) + 59;   // 11:59 PM

        const btnPre = document.getElementById('btnPre');
        const btnPost = document.getElementById('btnPost');

        if (mins >= amStart && mins <= amEnd) {
            btnPost.classList.add('locked');
            setType('Precheck');
            document.getElementById('status').innerText = "AM SCHEDULE ACTIVE: PRECHECK ONLY";
        } else if (mins >= pmStart && mins <= pmEnd) {
            btnPre.classList.add('locked');
            setType('Postcheck');
            document.getElementById('status').innerText = "PM SCHEDULE ACTIVE: POSTCHECK ONLY";
        } else {
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('status').innerText = "OFF-SCHEDULE: PORTAL CLOSED";
        }
    }

    function setType(type) {
        if (document.getElementById('btn' + type).classList.contains('locked')) return;
        inspectionType = type;
        document.getElementById('btnPre').classList.toggle('active', type === 'Precheck');
        document.getElementById('btnPost').classList.toggle('active', type === 'Postcheck');
    }

    document.getElementById('videoFile').onchange = (e) => {
        if (e.target.files.length > 0) {
            const now = new Date();
            captureTimestamp = now.toLocaleString();
            document.getElementById('timestampDisplay').innerText = "Recorded: " + captureTimestamp;
            document.getElementById('timestampDisplay').style.display = 'block';
            document.getElementById('fileLabel').innerText = "📹 VIDEO READY";
        }
    };

    document.getElementById('submitBtn').onclick = async () => {
        const name = document.getElementById('driverName').value;
        const vin = autoVin || document.getElementById('vin').value;
        const file = document.getElementById('videoFile').files[0];

        if (!name || !vin || !file) {
            alert("Please complete all steps.");
            return;
        }

        document.getElementById('submitBtn').disabled = true;
        document.getElementById('status').innerText = "⏳ TRANSMITTING...";

        const formData = new FormData();
        const content = `**🚨 SLGP ${inspectionType.toUpperCase()}**\n**Driver:** \`${name}\`\n**VIN:** \`${vin}\`\n**Recorded:** \`${captureTimestamp}\``;
        
        formData.append('payload_json', JSON.stringify({ content: content, username: "SLGP Fleet Portal" }));
        formData.append('file', file);

        try {
            const res = await fetch(DISCORD_WEBHOOK_URL, { method: 'POST', body: formData });
            if (res.ok) location.reload();
        } catch (err) {
            document.getElementById('status').innerText = "❌ FAILED. TRY AGAIN.";
            document.getElementById('submitBtn').disabled = false;
        }
    };

    loadFromUrl();
    checkTimeLock();
</script>
</body>
</html>
