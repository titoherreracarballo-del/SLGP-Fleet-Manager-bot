<script>
// --- 1. VEHICLE DATA LOOKUP ---
const vinLookupTable = {
    "7867": "EDV", "7871": "EDV", "9412": "EDV", "7872": "EDV", "7866": "EDV", "7860": "EDV", "9418": "EDV", "7863": "EDV", "7859": "EDV", "7857": "EDV",
    "4905": "CDV", "7097": "CDV", "2347": "CDV", "1587": "CDV", "6880": "CDV", "6907": "CDV", "1295": "CDV", "6265": "CDV", "6188": "CDV", "1288": "CDV", "6864": "CDV",
    "1051": "CARGO", "9488": "CARGO", "7088": "CARGO", "1664": "CARGO", "0871": "CARGO", "3010": "CARGO", "5344": "CARGO", "0890": "CARGO", "5341": "CARGO", "3754": "CARGO", "7373": "CARGO", "0876": "CARGO", "8786": "CARGO", "0213": "CARGO", "3892": "CARGO", "9651": "CARGO", "5691": "CARGO", "9128": "CARGO"
};

// --- 2. AUTO-SELECTION FUNCTIONS ---
function applySelection(selector, value) {
    document.querySelectorAll(selector).forEach(btn => {
        btn.classList.remove('active');
        btn.style.pointerEvents = 'none'; // Lock manual clicking
        if (btn.innerText.trim().toUpperCase() === value.toUpperCase()) {
            btn.classList.add('active');
        }
    });
}

function runTimeCheck() {
    const now = new Date();
    const totalMinutes = (now.getHours() * 60) + now.getMinutes();

    // WIDENED TESTING WINDOWS:
    // Precheck: 8:00 AM - 5:00 PM (480 - 1020 mins)
    // Postcheck: 5:01 PM - 11:59 PM (1021 - 1439 mins)
    if (totalMinutes >= 480 && totalMinutes <= 1020) {
        applySelection('.inspection-btn', 'PRECHECK');
    } else {
        applySelection('.inspection-btn', 'POSTCHECK');
    }
}

// --- 3. INITIALIZATION ---
document.addEventListener('DOMContentLoaded', () => {
    // Run time check immediately
    runTimeCheck();

    // Watch VIN Input (Assuming your ID is 'vin-input')
    const vinInput = document.getElementById('vin-input');
    if (vinInput) {
        vinInput.addEventListener('input', (e) => {
            const val = e.target.value;
            if (val.length === 4) {
                const type = vinLookupTable[val];
                if (type) applySelection('.service-btn', type);
            }
        });
    }
});
</script>
</body>
