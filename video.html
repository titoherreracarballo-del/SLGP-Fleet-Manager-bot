<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Inspection</title>
    <style>
        :root { --bg-body: #0F1115; --bg-card: #161B28; --bg-input: #0b0d12; --primary-blue: #2563EB; --text-label: #3B82F6; --radius: 12px; }
        body { background-color: var(--bg-body); font-family: sans-serif; color: white; display: flex; justify-content: center; padding: 20px; margin: 0; min-height: 100vh; }
        .container { width: 100%; max-width: 420px; background-color: var(--bg-card); border-radius: 24px; padding: 24px; border: 1px solid #1f2937; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .back-link { color: #94a3b8; text-decoration: none; font-size: 14px; margin-bottom: 20px; display: block; }
        h1 { color: var(--text-label); text-align: center; font-size: 24px; font-weight: 900; text-transform: uppercase; margin: 0 0 25px 0; }
        .form-group { margin-bottom: 20px; }
        .row-split { display: flex; gap: 10px; }
        label { color: var(--text-label); display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1.5px; }
        input { width: 100%; background-color: var(--bg-input); border: 1px solid #2d3748; color: white; padding: 16px; border-radius: var(--radius); font-size: 14px; box-sizing: border-box; outline: none; }
        input[readonly] { background-color: #1a202c; color: #6b7280; font-weight: bold; }
        
        /* VIN Auto-Detect Styling */
        .diesel-mode { color: #4ade80 !important; border-color: #4ade80 !important; }
        .gas-mode { color: #ef4444 !important; border-color: #ef4444 !important; }
        .electric-mode { color: #ffffff !important; border-color: #ffffff !important; }

        .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .type-btn { background-color: transparent; border: 1px solid #374151; color: #64748b; padding: 14px; border-radius: var(--radius); font-size: 12px; font-weight: 800; cursor: pointer; }
        .type-btn.selected { background-color: var(--primary-blue); color: white; border-color: var(--primary-blue); }
        .video-box { position: relative; width: 100%; height: 400px; background: black; border-radius: var(--radius); overflow: hidden; border: 1px solid #374151; margin-bottom: 20px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #timer-display { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7); padding: 5px 12px; border-radius: 8px; color: #ef4444; font-weight: 900; font-size: 18px; display: none; z-index: 30; }
        .controls { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 20px; z-index: 20; }
        .btn-circle { width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; font-weight: bold; font-size: 10px; text-transform: uppercase; }
        #btn-record { background-color: #ef4444; color: white; }
        #btn-stop { background-color: #374151; color: white; display: none; }
        #btn-upload { background-color: #4ade80; color: #064e3b; display: none; width: 100%; border-radius: 12px; padding: 18px; font-weight: 900; border: none; font-size: 16px; }
    </style>
</head>
<body>
<div class="container">
    <a href="/" class="back-link">← Back to Menu</a>
    <h1>Video Inspection</h1>
    <div class="form-group"><label>Driver Full Name</label><input type="text" id="driverName" placeholder="Enter Full Name"></div>
    <div class="form-group row-split">
        <div style="flex:0.3"><label>Last 4 VIN</label><input type="text" id="vinInput" maxlength="4" placeholder="E.G. 1051" oninput="checkVin()"></div>
        <div style="flex:0.7"><label>Vehicle Type / Fuel</label><input type="text" id="vehicleType" placeholder="Auto-Detect..." readonly></div>
    </div>
    <div class="type-grid">
        <button id="btn-pre" class="type-btn" onclick="selectType('Pre-Trip')">Pre-Trip</button>
        <button id="btn-post" class="type-btn" onclick="selectType('Post-Trip')">Post-Trip</button>
    </div>
    <div class="video-box">
        <div id="timer-display">00:00</div>
        <video id="preview" autoplay playsinline muted></video>
        <video id="playback" controls style="display:none;"></video>
        <div class="controls">
            <button id="btn-record" class="btn-circle" onclick="startRecording()">REC</button>
            <button id="btn-stop" class="btn-circle" onclick="stopRecording()">STOP</button>
        </div>
    </div>
    <button id="btn-upload" onclick="submitVideo()">SUBMIT INSPECTION</button>
    <div id="status" style="text-align:center; color:#94a3b8; font-size:12px; margin-top:10px; font-weight:bold;">Ready</div>
</div>

<script>
    // FULL VIN DATABASE
    const vinDatabase = {
        "9488": { type: "XL Van (Diesel)", fuel: "diesel" }, "0213": { type: "Large Van (Diesel)", fuel: "diesel" },
        "7867": { type: "Rivian (Electric)", fuel: "electric" }, "1051": { type: "XL Van (Gas)", fuel: "gas" },
        "7403": { type: "XL Van (Gas)", fuel: "gas" } // Add full list here
    };

    function checkVin() {
        let v = document.getElementById('vinInput').value.trim().toUpperCase();
        let t = document.getElementById('vehicleType');
        t.classList.remove('diesel-mode', 'gas-mode', 'electric-mode');
        if (v.length === 4) {
            let found = vinDatabase[v];
            if (found) { t.value = found.type; t.classList.add(found.fuel + '-mode'); }
            else t.value = "Unknown Vehicle";
        } else t.value = "";
    }

    let mediaRecorder, chunks = [], videoBlob, inspectionType = '', timerInterval, seconds = 0;

    function selectType(t) {
        inspectionType = t;
        document.getElementById('btn-pre').classList.toggle('selected', t === 'Pre-Trip');
        document.getElementById('btn-post').classList.toggle('selected', t === 'Post-Trip');
    }

    async function startCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true });
        document.getElementById('preview').srcObject = stream;
    }
    startCamera();

    async function startRecording() {
        chunks = [];
        mediaRecorder = new MediaRecorder(document.getElementById('preview').srcObject, { mimeType: 'video/mp4; codecs="avc1"', videoBitsPerSecond: 3500000 });
        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        mediaRecorder.onstop = () => {
            videoBlob = new Blob(chunks, { type: 'video/mp4' });
            document.getElementById('preview').style.display = 'none';
            document.getElementById('playback').style.display = 'block';
            document.getElementById('playback').src = URL.createObjectURL(videoBlob);
            document.getElementById('btn-upload').style.display = 'block';
        };
        mediaRecorder.start();
        document.getElementById('btn-record').style.display = 'none';
        document.getElementById('btn-stop').style.display = 'block';
        document.getElementById('timer-display').style.display = 'block';
        seconds = 0;
        timerInterval = setInterval(() => {
            seconds++;
            const m = Math.floor(seconds/60).toString().padStart(2,'0'), s = (seconds%60).toString().padStart(2,'0');
            document.getElementById('timer-display').innerText = `${m}:${s}`;
        }, 1000);
    }

    function stopRecording() {
        mediaRecorder.stop();
        clearInterval(timerInterval);
        document.getElementById('btn-stop').style.display = 'none';
    }

    // THE FIX: Wait for DB confirmation before Redirect
    async function submitVideo() {
        const status = document.getElementById('status');
        status.innerText = "Securing Video...";
        
        const dbReq = indexedDB.open('FleetVideoDB', 1);
        dbReq.onupgradeneeded = e => e.target.result.createObjectStore('videos', { keyPath: 'id' });
        
        dbReq.onsuccess = e => {
            const db = e.target.result;
            const tx = db.transaction('videos', 'readwrite');
            const store = tx.objectStore('videos');

            const putReq = store.put({ 
                id: 'currentVideo', 
                file: videoBlob, 
                driver: document.getElementById('driverName').value, 
                vin: document.getElementById('vinInput').value, 
                type: inspectionType 
            });

            putReq.onsuccess = async () => {
                const reg = await navigator.serviceWorker.ready;
                // Register background sync
                if ('sync' in reg) await reg.sync.register('video-upload');
                // Nudge the service worker
                if (reg.active) reg.active.postMessage({ action: 'FORCE_SYNC' });
                
                status.innerText = "SUCCESS! Redirecting...";
                setTimeout(() => window.location.href = '/', 1500);
            };
            putReq.onerror = () => { status.innerText = "Error Saving. Try again."; };
        };
    }
</script>
</body>
</html>
