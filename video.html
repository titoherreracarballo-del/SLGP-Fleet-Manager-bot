<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Inspection DIAGNOSTIC</title>
    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: monospace;
            padding: 20px;
            font-size: 14px;
        }
        #diagnostic {
            background: #111;
            border: 2px solid #0f0;
            padding: 20px;
            margin-bottom: 20px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        .error { color: #f00; }
        .success { color: #0f0; }
        .warning { color: #ff0; }
        .info { color: #0ff; }
    </style>
</head>
<body>
    <h1>🔍 DIAGNOSTIC MODE</h1>
    <div id="diagnostic">Initializing...</div>
    <div id="camera-container" style="display:none;">
        <video id="preview" autoplay playsinline muted style="width:100%; max-width:400px; border:2px solid #0f0;"></video>
    </div>

<script>
const diag = document.getElementById('diagnostic');
const cameraContainer = document.getElementById('camera-container');
let logCount = 0;

function log(msg, type = 'info') {
    logCount++;
    const timestamp = new Date().toLocaleTimeString();
    const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : type === 'warning' ? '⚠️' : '📝';
    diag.innerHTML += `<div class="${type}">${logCount}. [${timestamp}] ${prefix} ${msg}</div>`;
    diag.scrollTop = diag.scrollHeight;
    console.log(`[${timestamp}] ${msg}`);
}

// IMMEDIATE TEST
log('JavaScript is running!', 'success');
log(`User Agent: ${navigator.userAgent}`, 'info');
log(`Location: ${window.location.href}`, 'info');

// Test 1: Check HTTPS
if (!window.location.protocol.includes('https') && !window.location.hostname.includes('localhost')) {
    log('WARNING: Not using HTTPS! Camera may not work.', 'warning');
} else {
    log('Protocol OK: ' + window.location.protocol, 'success');
}

// Test 2: Check if getUserMedia exists
if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    log('CRITICAL: getUserMedia not available!', 'error');
    log('This browser does not support camera access.', 'error');
} else {
    log('getUserMedia available', 'success');
}

// Test 3: Check permissions API
log('Checking camera permissions...', 'info');

async function checkPermissions() {
    try {
        if (navigator.permissions) {
            const result = await navigator.permissions.query({ name: 'camera' });
            log(`Permission state: ${result.state}`, result.state === 'granted' ? 'success' : 'warning');
        } else {
            log('Permissions API not available', 'warning');
        }
    } catch (e) {
        log(`Permission check failed: ${e.message}`, 'warning');
    }
}

checkPermissions();

// Test 4: Enumerate devices
log('Enumerating video devices...', 'info');

async function listDevices() {
    try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');
        
        log(`Found ${videoDevices.length} camera(s)`, videoDevices.length > 0 ? 'success' : 'error');
        
        videoDevices.forEach((device, i) => {
            log(`  Camera ${i}: "${device.label}" (ID: ${device.deviceId.substring(0, 20)}...)`, 'info');
        });
        
        if (videoDevices.length === 0) {
            log('No cameras found!', 'error');
            return false;
        }
        
        return true;
    } catch (error) {
        log(`Device enumeration failed: ${error.message}`, 'error');
        return false;
    }
}

// Test 5: Request camera permission
async function testCamera() {
    log('Requesting camera access...', 'info');
    
    try {
        // First, try basic permission request
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: true,
            audio: false 
        });
        
        log('Camera permission granted!', 'success');
        log('Stream obtained successfully', 'success');
        
        const videoTrack = stream.getVideoTracks()[0];
        const settings = videoTrack.getSettings();
        
        log(`Camera active: ${settings.width}x${settings.height}`, 'success');
        log(`Facing mode: ${settings.facingMode || 'unknown'}`, 'info');
        log(`Device: ${videoTrack.label}`, 'info');
        
        // Display video
        const preview = document.getElementById('preview');
        preview.srcObject = stream;
        cameraContainer.style.display = 'block';
        
        log('✅ CAMERA WORKING!', 'success');
        log('If you can see the video above, camera is functional.', 'success');
        
        return true;
        
    } catch (error) {
        log(`Camera access FAILED: ${error.name}`, 'error');
        log(`Error message: ${error.message}`, 'error');
        
        if (error.name === 'NotAllowedError') {
            log('Fix: Go to Settings → Apps → Browser → Permissions → Camera → Allow', 'warning');
        } else if (error.name === 'NotFoundError') {
            log('Fix: No camera found on device', 'error');
        } else if (error.name === 'NotReadableError') {
            log('Fix: Camera is being used by another app. Close other camera apps.', 'warning');
        }
        
        return false;
    }
}

// Run tests in sequence
async function runDiagnostics() {
    log('='.repeat(50), 'info');
    log('STARTING DIAGNOSTICS', 'info');
    log('='.repeat(50), 'info');
    
    await new Promise(resolve => setTimeout(resolve, 500));
    
    const hasDevices = await listDevices();
    
    if (!hasDevices) {
        log('Cannot proceed: No cameras detected', 'error');
        return;
    }
    
    await new Promise(resolve => setTimeout(resolve, 500));
    
    const cameraWorks = await testCamera();
    
    if (cameraWorks) {
        log('='.repeat(50), 'info');
        log('DIAGNOSTIC COMPLETE: CAMERA WORKING ✅', 'success');
        log('='.repeat(50), 'info');
    } else {
        log('='.repeat(50), 'info');
        log('DIAGNOSTIC COMPLETE: CAMERA FAILED ❌', 'error');
        log('='.repeat(50), 'info');
    }
}

// Start diagnostics after 1 second
setTimeout(runDiagnostics, 1000);

// Also log any uncaught errors
window.addEventListener('error', (e) => {
    log(`Uncaught error: ${e.message} at ${e.filename}:${e.lineno}`, 'error');
});

log('Diagnostic script loaded. Tests will begin in 1 second...', 'info');
</script>
</body>
</html>
