<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Inspection ULTRA DEBUG</title>
    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: monospace;
            padding: 10px;
            margin: 0;
        }
        #bigstatus {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            z-index: 9999;
            background: rgba(0,0,0,0.9);
            padding: 30px;
            border: 3px solid #0f0;
            border-radius: 10px;
            min-width: 300px;
        }
        #log {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #000;
            border-top: 2px solid #0f0;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 11px;
        }
        .error { color: #f00; }
        .success { color: #0f0; }
        video {
            width: 100%;
            max-width: 400px;
            border: 2px solid #0f0;
            display: none;
        }
    </style>
</head>
<body>

<div id="bigstatus">🔍 INITIALIZING...</div>
<div id="log"></div>
<video id="preview" autoplay playsinline muted></video>

<script>
// ULTRA AGGRESSIVE LOGGING
const bigStatus = document.getElementById('bigstatus');
const log = document.getElementById('log');
const preview = document.getElementById('preview');

let step = 0;

function updateStatus(msg) {
    step++;
    bigStatus.innerHTML = `STEP ${step}<br>${msg}`;
    addLog(msg);
}

function addLog(msg, isError = false) {
    const time = new Date().toLocaleTimeString();
    const className = isError ? 'error' : 'success';
    log.innerHTML += `<div class="${className}">[${time}] ${msg}</div>`;
    log.scrollTop = log.scrollHeight;
    console.log(msg);
}

// IMMEDIATE TEST
updateStatus('JavaScript Running!');

// Test basic functionality
setTimeout(() => {
    updateStatus('Checking getUserMedia...');
    
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        updateStatus('❌ NO CAMERA API!');
        addLog('getUserMedia not available!', true);
        bigStatus.style.borderColor = '#f00';
        bigStatus.style.color = '#f00';
        return;
    }
    
    updateStatus('✅ Camera API Found');
    
    setTimeout(() => {
        updateStatus('Enumerating devices...');
        
        navigator.mediaDevices.enumerateDevices()
            .then(devices => {
                const cams = devices.filter(d => d.kind === 'videoinput');
                updateStatus(`Found ${cams.length} camera(s)`);
                
                cams.forEach((cam, i) => {
                    addLog(`Camera ${i}: ${cam.label}`);
                });
                
                if (cams.length === 0) {
                    updateStatus('❌ NO CAMERAS!');
                    bigStatus.style.borderColor = '#f00';
                    bigStatus.style.color = '#f00';
                    return;
                }
                
                setTimeout(() => {
                    updateStatus('Requesting camera access...');
                    
                    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                        .then(stream => {
                            updateStatus('✅ CAMERA WORKING!');
                            bigStatus.style.borderColor = '#0f0';
                            addLog('Camera stream obtained!');
                            
                            const track = stream.getVideoTracks()[0];
                            const settings = track.getSettings();
                            addLog(`Resolution: ${settings.width}x${settings.height}`);
                            addLog(`Device: ${track.label}`);
                            
                            preview.srcObject = stream;
                            preview.style.display = 'block';
                            
                            setTimeout(() => {
                                bigStatus.innerHTML = '✅ SUCCESS!<br><small>Camera is functional</small>';
                            }, 2000);
                        })
                        .catch(error => {
                            updateStatus(`❌ CAMERA FAILED!`);
                            bigStatus.style.borderColor = '#f00';
                            bigStatus.style.color = '#f00';
                            addLog(`Error: ${error.name}`, true);
                            addLog(`Message: ${error.message}`, true);
                            
                            if (error.name === 'NotAllowedError') {
                                addLog('Fix: Enable camera permission in settings', true);
                            } else if (error.name === 'NotReadableError') {
                                addLog('Fix: Close other camera apps', true);
                            }
                        });
                }, 500);
            })
            .catch(error => {
                updateStatus('❌ DEVICE ENUM FAILED!');
                bigStatus.style.borderColor = '#f00';
                bigStatus.style.color = '#f00';
                addLog(`Error: ${error.message}`, true);
            });
    }, 500);
}, 500);

// Safety timeout
setTimeout(() => {
    if (bigStatus.innerText.includes('STEP')) {
        updateStatus('⏰ TIMEOUT!');
        bigStatus.style.borderColor = '#ff0';
        bigStatus.style.color = '#ff0';
        addLog('Took too long - something hung!', true);
    }
}, 15000);

addLog('=== ULTRA DEBUG MODE ACTIVE ===');
addLog('Watch the big status box above');
</script>

</body>
</html>
