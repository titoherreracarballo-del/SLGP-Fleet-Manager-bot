<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLGP Fleet Portal</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon.jpg">
    <link rel="icon" type="image/jpeg" href="icon.jpg">
    <style>
        body {
            background-color: #0a0e17;
            background-image: radial-gradient(circle at top right, #1a2a44, #0a0e17);
            color: white; font-family: -apple-system, system-ui, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 20px; text-align: center;
        }
        
        /* LOGO BADGE STYLE */
        .logo-container { 
            background: white; padding: 15px 25px; border-radius: 20px; 
            margin-bottom: 30px; box-shadow: 0 0 20px rgba(0, 102, 255, 0.3); display: inline-block;
        }
        .logo-container img { width: 100%; max-width: 250px; display: block; }
        
        /* BUTTON CONTAINER */
        .menu-btn {
            display: flex; flex-direction: column; width: 100%; max-width: 320px; 
            margin-bottom: 25px; border-radius: 18px; text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4); padding: 0; 
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden; 
        }
        .menu-btn:active { transform: scale(0.97); }

        /* IMAGE BOX */
        .btn-img-box { width: 100%; height: 180px; overflow: hidden; }
        .btn-img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* LABEL STYLE */
        .btn-label {
            padding: 15px; font-size: 16px; font-weight: 800; color: white;
            text-transform: uppercase; letter-spacing: 1px;
        }
        
        /* COLOR BARS */
        .lbl-video { border-bottom: 4px solid #0066ff; }
        .lbl-issue { border-bottom: 4px solid #ff9900; }
        .lbl-accident { border-bottom: 4px solid #ff4444; }
        .lbl-insurance { border-bottom: 4px solid #00cc66; } /* Green for Insurance */

        .footer { margin-top: 40px; font-size: 11px; color: #444; }
    </style>
</head>
<body>
    <div class="logo-container"><img src="Final-01.jpg" alt="SLGP Logo"></div>

    <a href="/video" class="menu-btn">
        <div class="btn-img-box"><img src="Pre & Post Fleet Vids.jpg" class="btn-img" alt="Video"></div>
        <div class="btn-label lbl-video">Pre & Post Fleet Vids</div>
    </a>

    <a href="/report?mode=issue" class="menu-btn">
        <div class="btn-img-box"><img src="Report An Issue.jpg" class="btn-img" alt="Issue"></div>
        <div class="btn-label lbl-issue">Report Issue</div>
    </a>

    <a href="/report?mode=accident" class="menu-btn">
        <div class="btn-img-box"><img src="Accident or Incident Reporting.jpg" class="btn-img" alt="Accident"></div>
        <div class="btn-label lbl-accident">Report Accident</div>
    </a>

    <a href="/report?mode=insurance" class="menu-btn">
        <div class="btn-img-box"><img src="Vehicle Insurance Card.jpg" class="btn-img" alt="Insurance"></div>
        <div class="btn-label lbl-insurance">Insurance Cards</div>
    </a>

    <div class="footer">SLGP Fleet Portal v6.0</div>
</body>
</html>
