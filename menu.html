<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLGP Fleet Portal</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon.jpg">
    <link rel="icon" type="image/jpeg" href="icon.jpg">
    <style>
        :root {
            /* MODERN DARK THEME COLORS */
            --bg-main: #0B0F19;
            --bg-card: #1A1F2E;
            --bg-card-hover: #242938;
            --accent-blue: #3B82F6;
            --accent-glow: rgba(59, 130, 246, 0.15);
            --text-primary: #FFFFFF;
            --text-secondary: #94A3B8;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-card-hover: 0 12px 48px rgba(59, 130, 246, 0.2);
            
            /* FLUID SPACING */
            --space-xs: clamp(4px, 1vw, 6px);
            --space-sm: clamp(8px, 2vw, 12px);
            --space-md: clamp(12px, 3vw, 16px);
            --space-lg: clamp(16px, 4vw, 24px);
            --space-xl: clamp(24px, 6vw, 32px);
            
            /* FLUID FONTS */
            --font-xs: clamp(10px, 2.2vw, 12px);
            --font-sm: clamp(12px, 2.8vw, 14px);
            --font-base: clamp(14px, 3.2vw, 16px);
            --font-md: clamp(15px, 3.6vw, 17px);
            --font-lg: clamp(17px, 4.2vw, 19px);
            --font-xl: clamp(20px, 5vw, 24px);
            
            /* MODERN RADIUS */
            --radius-sm: clamp(12px, 3vw, 16px);
            --radius-md: clamp(16px, 4vw, 20px);
            --radius-lg: clamp(20px, 5vw, 24px);
            --radius-xl: clamp(24px, 6vw, 28px);
            
            --min-touch: 44px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            padding: var(--space-lg);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-size: var(--font-base);
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* HEADER */
        .header {
            margin-bottom: var(--space-xl);
            text-align: center;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: var(--font-xs);
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            margin-bottom: var(--space-lg);
        }

        .logo-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            padding: var(--space-lg);
            box-shadow: var(--shadow-card);
            overflow: hidden;
            position: relative;
        }

        .logo-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
            opacity: 0.5;
        }

        .logo-card img {
            width: 100%;
            border-radius: var(--radius-sm);
            display: block;
        }

        /* NOTIFICATION BUTTON */
        .notify-btn {
            width: 100%;
            padding: var(--space-md);
            margin: var(--space-lg) 0;
            background: rgba(59, 130, 246, 0.1);
            border: 2px solid var(--accent-blue);
            border-radius: var(--radius-lg);
            color: var(--accent-blue);
            font-weight: 700;
            font-size: var(--font-sm);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: var(--min-touch);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .notify-btn:hover {
            background: rgba(59, 130, 246, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        .notify-active {
            border-color: #EF4444 !important;
            color: #EF4444 !important;
            background: rgba(239, 68, 68, 0.1) !important;
        }

        .notify-inactive {
            border-color: #10B981 !important;
            color: #10B981 !important;
            background: rgba(16, 185, 129, 0.1) !important;
        }

        /* MENU CARDS - MODERN STYLE */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        .menu-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            overflow: hidden;
            text-decoration: none;
            display: block;
            box-shadow: var(--shadow-card);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .menu-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-lg);
            padding: 1px;
            background: linear-gradient(135deg, transparent, var(--accent-blue), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .menu-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: var(--shadow-card-hover);
            background: var(--bg-card-hover);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .menu-card:hover::before {
            opacity: 0.6;
        }

        .menu-card:active {
            transform: translateY(-2px) scale(0.99);
        }

        /* Image container */
        .card-image {
            width: 100%;
            height: clamp(120px, 32vw, 140px);
            overflow: hidden;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            position: relative;
        }

        .card-image::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(to top, var(--bg-card), transparent);
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-card:hover .card-image img {
            transform: scale(1.05);
        }

        /* Card content */
        .card-content {
            padding: var(--space-md) var(--space-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: var(--min-touch);
            background: var(--bg-card);
        }

        .card-label {
            font-size: var(--font-md);
            font-weight: 700;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }

        .menu-card:hover .card-label {
            color: var(--accent-blue);
        }

        .card-arrow {
            width: clamp(20px, 5vw, 24px);
            height: clamp(20px, 5vw, 24px);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-card:hover .card-arrow {
            transform: translateX(4px);
        }

        .card-arrow svg {
            width: 100%;
            height: 100%;
            fill: var(--accent-blue);
        }

        /* BUILD NOTES CARD - SPECIAL STYLING */
        .build-notes-card {
            background: linear-gradient(135deg, #4C1D95 0%, #5B21B6 100%);
            border-color: rgba(139, 92, 246, 0.3);
        }

        .build-notes-card .card-image {
            background: linear-gradient(135deg, #5B21B6 0%, #6D28D9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .build-notes-card .card-icon {
            width: clamp(48px, 12vw, 64px);
            height: clamp(48px, 12vw, 64px);
            fill: #A78BFA;
            opacity: 0.9;
        }

        .build-notes-card::before {
            background: linear-gradient(135deg, transparent, #A78BFA, transparent);
        }

        .build-notes-card:hover {
            box-shadow: 0 12px 48px rgba(139, 92, 246, 0.3);
        }

        /* FOOTER */
        .footer {
            margin-top: var(--space-xl);
            padding-top: var(--space-lg);
            border-top: 1px solid var(--border-subtle);
            text-align: center;
            color: var(--text-secondary);
            font-size: var(--font-xs);
        }

        /* RESPONSIVE */
        @media (max-width: 340px) {
            body { padding: var(--space-sm); }
        }

        @media (min-width: 768px) {
            :root {
                --font-xs: 12px;
                --font-sm: 14px;
                --font-base: 16px;
                --font-md: 17px;
                --font-lg: 19px;
                --font-xl: 24px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        <div class="status-bar">
            <span>SYSTEM ONLINE</span>
            <span>v4.5.0</span>
        </div>
        
        <div class="logo-card">
            <img src="./Final-01.jpg" alt="Strategic Logistics">
        </div>
    </div>

    <!-- NOTIFICATION TOGGLE -->
    <button id="notifyBtn" class="notify-btn">
        ⚠️ RESET NOTIFICATIONS
    </button>

    <!-- MENU CARDS -->
    <div class="menu-grid">
        <!-- Fleet Inspection -->
        <a href="/video" class="menu-card">
            <div class="card-image">
                <img src="https://i.postimg.cc/mkh8L6K2/fdc00fc8-3ec1-4da0-968a-0caeacf6e621.webp" alt="Fleet Inspection">
            </div>
            <div class="card-content">
                <span class="card-label">Fleet Inspection Vids</span>
                <div class="card-arrow">
                    <svg viewBox="0 0 24 24">
                        <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                    </svg>
                </div>
            </div>
        </a>

        <!-- Report Issue -->
        <a href="/report?mode=issue" class="menu-card">
            <div class="card-image">
                <img src="https://i.postimg.cc/28Dj4GKF/12e4e15a-2c05-46d8-a6d7-46fe69c9bb2e.webp" alt="Report Issue">
            </div>
            <div class="card-content">
                <span class="card-label">Report Issue</span>
                <div class="card-arrow">
                    <svg viewBox="0 0 24 24">
                        <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                    </svg>
                </div>
            </div>
        </a>

        <!-- Accident Report -->
        <a href="/report?mode=accident" class="menu-card">
            <div class="card-image">
                <img src="https://i.postimg.cc/XqKKS7vz/9f6f50f7-3d46-48dd-9bf7-6d91c40f3c83.webp" alt="Accident Report">
            </div>
            <div class="card-content">
                <span class="card-label">Accident Report</span>
                <div class="card-arrow">
                    <svg viewBox="0 0 24 24">
                        <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                    </svg>
                </div>
            </div>
        </a>

        <!-- Insurance Cards -->
        <a href="/report?mode=insurance" class="menu-card">
            <div class="card-image">
                <img src="https://i.postimg.cc/sXb6jvP5/0871cf75-a4be-424b-ba92-e93327e9dd04.webp" alt="Insurance Cards">
            </div>
            <div class="card-content">
                <span class="card-label">Insurance Cards</span>
                <div class="card-arrow">
                    <svg viewBox="0 0 24 24">
                        <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                    </svg>
                </div>
            </div>
        </a>

        <!-- Build Notes -->
        <a href="/build-notes" class="menu-card build-notes-card">
            <div class="card-image">
                <svg class="card-icon" viewBox="0 0 24 24">
                    <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/>
                </svg>
            </div>
            <div class="card-content">
                <span class="card-label">Build Notes</span>
                <div class="card-arrow">
                    <svg viewBox="0 0 24 24">
                        <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                    </svg>
                </div>
            </div>
        </a>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        Strategic Logistics Group • Fleet Management System
    </div>
</div>

<script>
// Notification toggle
const notifyBtn = document.getElementById('notifyBtn');
notifyBtn.addEventListener('click', function() {
    if (Notification.permission === "granted") {
        notifyBtn.classList.add('notify-active');
        notifyBtn.classList.remove('notify-inactive');
        notifyBtn.textContent = '⚠️ RESET NOTIFICATIONS';
    } else if (Notification.permission === "denied") {
        notifyBtn.classList.add('notify-inactive');
        notifyBtn.classList.remove('notify-active');
        notifyBtn.textContent = '🔕 NOTIFICATIONS BLOCKED';
    } else {
        Notification.requestPermission().then(permission => {
            if (permission === "granted") {
                notifyBtn.classList.add('notify-inactive');
                notifyBtn.classList.remove('notify-active');
                notifyBtn.textContent = '✅ NOTIFICATIONS ENABLED';
            }
        });
    }
});
</script>

</body>
</html>
