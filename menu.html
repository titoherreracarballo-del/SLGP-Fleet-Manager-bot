<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLGP Fleet Portal</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon.jpg">
    <link rel="icon" type="image/jpeg" href="icon.jpg">
    <style>
        /* --- DIGITAL HUD THEME --- */
        :root {
            --bg-dark: #050B14;
            --bg-card-metal: linear-gradient(135deg, #242a38 0%, #121621 100%);
            --border-glass: rgba(255, 255, 255, 0.1);
            --text-primary: #E2E8F0;
            --text-dim: #64748B;
            --neon-blue: #00f2ff;
            --neon-orange: #ffaa00;
            --neon-red: #ff2a2a;
            --neon-green: #00ff88;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* --- SECURITY GATE SCREEN --- */
        #security-gate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }

        .gate-content {
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border: 2px solid var(--neon-red);
            border-radius: 20px;
            background: rgba(255, 42, 42, 0.05);
            box-shadow: 0 0 30px rgba(255, 42, 42, 0.2);
            text-align: left;
        }

        .disclaimer-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            color: var(--neon-red);
        }

        .exclamation-icon {
            font-size: 40px;
            font-weight: bold;
        }

        .checklist-container {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .check-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 14px;
            line-height: 1.4;
            color: var(--text-primary);
        }

        .check-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--neon-red);
            cursor: pointer;
            flex-shrink: 0;
        }

        .ack-container {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border-glass);
        }

        .ack-input {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            color: white;
            margin-top: 10px;
            box-sizing: border-box;
        }

        .gate-btn {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            background: var(--neon-red);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: not-allowed;
            letter-spacing: 2px;
            opacity: 0.5;
        }

        .gate-btn.active {
            cursor: pointer;
            opacity: 1;
            box-shadow: 0 0 15px var(--neon-red);
        }

        /* --- MAIN UI --- */
        #main-ui { display: none; width: 100%; max-width: 340px; }

        .system-header {
            width: 100%; display: flex; justify-content: space-between;
            font-size: 10px; color: var(--neon-blue); text-transform: uppercase;
            letter-spacing: 2px; margin-bottom: 20px; opacity: 0.8; font-weight: 700;
        }

        .logo-container { 
            width: 100%;
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass); padding: 20px; 
            border-radius: 24px; margin-bottom: 30px; 
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            text-align: center; box-sizing: border-box;
        }
        .logo-container img { width: 100%; border-radius: 12px; }
        
        .menu-grid { display: flex; flex-direction: column; gap: 25px; }

        .menu-btn {
            position: relative;
            display: flex; flex-direction: column; 
            width: 100%; border-radius: 16px; text-decoration: none;
            background: var(--bg-card-metal); border: 2px solid var(--border-glass);
            overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        .btn-img-box { width: 100%; height: 130px; overflow: hidden; background: #000; }
        .btn-img { width: 100%; height: 100%; object-fit: cover; }

        .btn-content {
            padding: 18px 20px; display: flex; justify-content: space-between; align-items: center;
        }

        .btn-label { font-size: 15px; font-weight: 900; color: white; text-transform: uppercase; }
        .btn-icon { width: 24px; height: 24px; fill: white; }

        #notifyBtn {
            width: 100%; padding: 15px; margin-bottom: 20px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--neon-blue);
            color: var(--neon-blue); font-weight: bold; border-radius: 12px;
        }
        
        .notify-active { border-color: var(--neon-red) !important; color: var(--neon-red) !important; }
        .notify-inactive { border-color: var(--neon-green) !important; color: var(--neon-green) !important; }

        .footer { margin-top: 40px; font-size: 10px; color: var(--text-dim); text-align: center; }
    </style>
</head>
<body>

    <div id="security-gate">
        <div class="gate-content">
            <div class="disclaimer-header">
                <span class="exclamation-icon">⚠</span>
                <h2 style="margin:0; letter-spacing: 1px;">SLGP STANDARDS</h2>
            </div>
            
            <p style="font-size: 13px; color: var(--text-dim); margin-bottom: 20px;">
                All SLGP employees are required to adhere to the following standards prior to beginning their shift:
            </p>

            <div class="checklist-container">
                <label class="check-item">
                    <input type="checkbox" class="gate-check">
                    <span>Ensure that their work device is fully functional.</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" class="gate-check">
                    <span>Verify that their van bag contains all necessary operational tools and that each item is in working condition (e.g., power bank, charging cable, gas card).</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" class="gate-check">
                    <span>Confirm that their van is equipped with a phone mount, unless operating an EDV.</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" class="gate-check">
                    <span>Complete and submit the required pre‑check health video.</span>
                </label>
                <label class="check-item">
                    <input type="checkbox" class="gate-check">
                    <span>Complete the DVIC within the Flex app.</span>
                </label>
            </div>

            <div class="ack-container">
                <label style="font-size: 12px; color: var(--neon-red); font-weight: bold;">DA ACKNOWLEDGMENT</label>
                <input type="text" id="da-name" class="ack-input" placeholder="Enter Full Name to Confirm" oninput="validateGate()">
            </div>

            <button id="gate-submit" class="gate-btn" onclick="unlockPortal()">Enter Portal</button>
        </div>
    </div>

    <div id="main-ui">
        <div class="system-header">
            <span>System: Online</span>
            <span>SLGP-NET v6.5</span>
        </div>

        <div class="logo-container">
            <img src="Final-01.jpg" alt="SLGP Logo">
        </div>

        <button id="notifyBtn">Checking Connection...</button>

        <div class="menu-grid">
            <a href="/video" class="menu-btn" style="border-color: var(--neon-blue);">
                <div class="btn-img-box"><img src="fleet.jpg" class="btn-img"></div>
                <div class="btn-content">
                    <div class="btn-label">Pre & Post Fleet Vids</div>
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </div>
            </a>

            <a href="/report?mode=issue" class="menu-btn" style="border-color: var(--neon-orange);">
                <div class="btn-img-box"><img src="issue.jpg" class="btn-img"></div>
                <div class="btn-content">
                    <div class="btn-label">Report Issue</div>
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </div>
            </a>

            <a href="/report?mode=accident" class="menu-btn" style="border-color: var(--neon-red);">
                <div class="btn-img-box"><img src="accident.jpg" class="btn-img"></div>
                <div class="btn-content">
                    <div class="btn-label">Accident Report</div>
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </div>
            </a>

            <a href="/report?mode=insurance" class="menu-btn" style="border-color: var(--neon-green);">
                <div class="btn-img-box"><img src="insurance.jpg" class="btn-img"></div>
                <div class="btn-content">
                    <div class="btn-label">Insurance Cards</div>
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </div>
            </a>
        </div>

        <div class="footer">
            Secure Fleet Portal • <span id="app-version">v1.0.2</span>
        </div>
    </div>

    <script>
        // 1. SECURITY GATE VALIDATION
        const checkboxes = document.querySelectorAll('.gate-check');
        const nameInput = document.getElementById('da-name');
        const submitBtn = document.getElementById('gate-submit');

        checkboxes.forEach(cb => cb.addEventListener('change', validateGate));

        function validateGate() {
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            const nameEntered = nameInput.value.trim().length > 3;
            
            if (allChecked && nameEntered) {
                submitBtn.classList.add('active');
            } else {
                submitBtn.classList.remove('active');
            }
        }

        function unlockPortal() {
            if (!submitBtn.classList.contains('active')) return;
            
            document.getElementById('security-gate').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('security-gate').style.display = 'none';
                document.getElementById('main-ui').style.display = 'block';
            }, 500);
        }

        // 2. VERSION LOGIC
        async function updateVersion() {
            try {
                const res = await fetch('/version');
                const data = await res.json();
                document.getElementById('app-version').innerText = "Build: " + data.version;
            } catch (e) { console.log("Version fetch failed."); }
        }
        updateVersion();

        // 3. PUSH NOTIFICATION LOGIC (Preserved)
        const btn = document.getElementById('notifyBtn');
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').then(() => initializeUI());
        }

        async function initializeUI() {
            const reg = await navigator.serviceWorker.ready;
            const sub = await reg.pushManager.getSubscription();
            btn.innerText = sub ? "⚠️ RESET NOTIFICATIONS" : "✅ ENABLE NOTIFICATIONS";
            btn.className = sub ? "notify-active" : "notify-inactive";
        }

        btn.addEventListener('click', async () => {
            const reg = await navigator.serviceWorker.ready;
            const sub = await reg.pushManager.getSubscription();
            if (sub) { await sub.unsubscribe(); initializeUI(); } 
            else {
                const res = await fetch('/vapid-key');
                const data = await res.json();
                const key = urlBase64ToUint8Array(data.publicKey);
                await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
                const newSub = await reg.pushManager.getSubscription();
                await fetch('/subscribe', {
                    method: 'POST',
                    body: JSON.stringify(newSub),
                    headers: { 'content-type': 'application/json' }
                });
                initializeUI();
            }
        });

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) { outputArray[i] = rawData.charCodeAt(i); }
            return outputArray;
        }
    </script>
</body>
</html>
