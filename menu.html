<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLGP Fleet Portal</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon.jpg">
    <link rel="icon" type="image/jpeg" href="icon.jpg">
    <style>
        body {
            background-color: #0a0e17;
            background-image: radial-gradient(circle at top right, #1a2a44, #0a0e17);
            color: white; font-family: -apple-system, system-ui, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 20px; text-align: center;
        }
        .logo { width: 280px; margin-bottom: 30px; filter: drop-shadow(0 0 15px rgba(0, 102, 255, 0.4)); }
        
        .menu-btn {
            display: block; /* Standard block for full images */
            width: 100%; max-width: 320px; 
            margin-bottom: 20px;
            border-radius: 18px; 
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4); 
            padding: 0; /* Remove padding so image touches edges */
            background: transparent; /* No background color needed */
            border: none; /* Let the image define the edge */
            overflow: hidden; /* Keeps corners rounded */
        }
        
        .menu-btn:active { transform: scale(0.97); }

        /* IMAGE STYLING */
        .btn-img {
            width: 100%;       
            height: auto;      
            display: block;    /* Removes tiny gap at bottom of images */
            border-radius: 18px;
        }

        .footer { margin-top: 40px; font-size: 11px; color: #444; }
    </style>
</head>
<body>
    <img src="Final-01.jpg" alt="SLGP Logo" class="logo">

    <a href="/video" class="menu-btn">
        <img src="Pre & Post Fleet Vids.jpg" class="btn-img" alt="Daily Video Check">
    </a>

    <a href="/report?mode=issue" class="menu-btn">
        <img src="Report An Issue.jpg" class="btn-img" alt="Report Issue">
    </a>

    <a href="/report?mode=accident" class="menu-btn">
        <img src="Accident or Incident Reporting.jpg" class="btn-img" alt="Report Accident">
    </a>

    <div class="footer">SLGP Fleet Portal v5.5</div>
</body>
</html>
