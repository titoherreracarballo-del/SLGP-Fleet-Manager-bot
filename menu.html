<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLGP Fleet Portal</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon.jpg">
    <link rel="icon" type="image/jpeg" href="icon.jpg">
    <style>
        /* --- DIGITAL HUD THEME --- */
        :root {
            --bg-dark: #050B14;
            --bg-card-metal: linear-gradient(135deg, #242a38 0%, #121621 100%);
            --border-glass: rgba(255, 255, 255, 0.1);
            --text-primary: #E2E8F0;
            --text-dim: #64748B;
            --neon-blue: #00f2ff;
            --neon-orange: #ffaa00;
            --neon-red: #ff2a2a;
            --neon-green: #00ff88;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* --- SECURITY GATE SCREEN --- */
        #security-gate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: opacity 0.5s ease;
        }

        .gate-content {
            padding: 40px;
            border: 1px solid var(--neon-blue);
            border-radius: 20px;
            background: rgba(0, 242, 255, 0.05);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2);
        }

        .gate-btn {
            margin-top: 30px;
            padding: 15px 40px;
            background: var(--neon-blue);
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 2px;
        }

        /* --- MAIN UI (Hidden initially) --- */
        #main-ui { display: none; width: 100%; max-width: 340px; }

        .system-header {
            width: 100%; display: flex; justify-content: space-between;
            font-size: 10px; color: var(--neon-blue); text-transform: uppercase;
            letter-spacing: 2px; margin-bottom: 20px; opacity: 0.8; font-weight: 700;
        }

        .logo-container { 
            width: 100%;
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass); padding: 20px; 
            border-radius: 24px; margin-bottom: 30px; 
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            text-align: center; box-sizing: border-box;
        }
        .logo-container img { width: 100%; border-radius: 12px; }
        
        .menu-grid { display: flex; flex-direction: column; gap: 25px; }

        .menu-btn {
            position: relative;
            display: flex; flex-direction: column; 
            width: 100%; 
            border-radius: 16px; 
            text-decoration: none;
            background: var(--bg-card-metal);
            border: 2px solid var(--border-glass);
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        .btn-img-box { width: 100%; height: 130px; overflow: hidden; background: #000; }
        .btn-img { width: 100%; height: 100%; object-fit: cover; }

        .btn-content {
            padding: 18px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .btn-label { font-size: 15px; font-weight: 900; color: white; text-transform: uppercase; }
        .btn-icon { width: 24px; height: 24px; fill: white; }

        #notifyBtn {
            width: 100%; padding: 15px; margin-bottom: 20px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--neon-blue);
            color: var(--neon-blue); font-weight: bold; border-radius: 12px;
        }
        
        .notify-active { border-color: var(--neon-red) !important; color: var(--neon-red) !important; }
        .notify-inactive { border-color: var(--neon-green) !important; color: var(--neon-green) !important; }

        /* THEME ACCENTS */
        .theme-video { border-color: var(--neon-blue); }
        .theme-issue { border-color: var(--neon-orange); }
        .theme-accident { border-color: var(--neon-red); }
        .theme-insurance { border-color: var(--neon-green); }

        .footer { 
            margin-top: 40px; font-size: 10px; color: var(--text-dim); 
            text-align: center; letter-spacing: 1px; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="security-gate">
        <div class="gate-content">
            <h1 style="color: var(--neon-blue); margin: 0;">SECURITY CHECK</h1>
            <p style="color: var(--text-dim); font-size: 12px;">AUTHORIZED PERSONNEL ONLY</p>
            <button class="gate-btn" onclick="unlockPortal()">Enter Portal</button>
        </div>
    </div>

    <div id="main-ui">
        <div class="system-header">
            <span>System: Online</span>
            <span>SLGP-NET v6.5</span>
        </div>

        <div class="logo-container">
            <img src="Final-01.jpg" alt="SLGP Logo">
        </div>

        <button id="notifyBtn">Checking Connection...</button>

        <div class="menu-grid">
            <a href="/video" class="menu-btn theme-video">
                <div class="btn-img-box"><img src="fleet.jpg" class="btn-img"></div>
                <div class="btn-content">
                    <div class="btn-label">Pre & Post Fleet Vids</div>
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </div>
            </a>

            <a href="/report?mode=issue" class="menu-btn theme-issue">
                <div class="btn-img-box"><img src="issue.jpg" class="btn-img"></div>
                <div class="btn-content">
                    <div class="btn-label">Report Issue</div>
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </div>
            </a>

            <a href="/report?mode=accident" class="menu-btn theme-accident">
                <div class="btn-img-box"><img src="accident.jpg" class="btn-img"></div>
                <div class="btn-content">
                    <div class="btn-label">Accident Report</div>
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </div>
            </a>

            <a href="/report?mode=insurance" class="menu-btn theme-insurance">
                <div class="btn-img-box"><img src="insurance.jpg" class="btn-img"></div>
                <div class="btn-content">
                    <div class="btn-label">Insurance Cards</div>
                    <svg class="btn-icon" viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </div>
            </a>
        </div>

        <div class="footer">
            Secure Fleet Portal • <span id="app-version">v1.0.2</span>
        </div>
    </div>

    <script>
        // 1. SECURITY GATE LOGIC
        function unlockPortal() {
            document.getElementById('security-gate').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('security-gate').style.display = 'none';
                document.getElementById('main-ui').style.display = 'block';
            }, 500);
        }

        // 2. VERSION LOGIC
        async function updateVersion() {
            try {
                const res = await fetch('/version');
                const data = await res.json();
                // If your server sends Date.now() as version, we format it or use static 1.0.2
                document.getElementById('app-version').innerText = "Build: " + data.version;
            } catch (e) {
                console.log("Version fetch failed, using default.");
            }
        }
        updateVersion();

        // 3. PUSH NOTIFICATION LOGIC (Preserved from your code)
        const btn = document.getElementById('notifyBtn');
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').then(() => initializeUI());
        }

        async function initializeUI() {
            const reg = await navigator.serviceWorker.ready;
            const sub = await reg.pushManager.getSubscription();
            btn.innerText = sub ? "⚠️ RESET NOTIFICATIONS" : "✅ ENABLE NOTIFICATIONS";
            btn.className = sub ? "notify-active" : "notify-inactive";
        }

        btn.addEventListener('click', async () => {
            const reg = await navigator.serviceWorker.ready;
            const sub = await reg.pushManager.getSubscription();
            if (sub) {
                await sub.unsubscribe();
                initializeUI();
            } else {
                const res = await fetch('/vapid-key');
                const data = await res.json();
                const key = urlBase64ToUint8Array(data.publicKey);
                await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
                const newSub = await reg.pushManager.getSubscription();
                await fetch('/subscribe', {
                    method: 'POST',
                    body: JSON.stringify(newSub),
                    headers: { 'content-type': 'application/json' }
                });
                initializeUI();
            }
        });

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }
    </script>
</body>
</html>
