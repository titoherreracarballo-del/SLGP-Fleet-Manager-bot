<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLGP Fleet Portal</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon.jpg">
    <link rel="icon" type="image/jpeg" href="icon.jpg">
    <style>
        body {
            background-color: #0a0e17;
            background-image: radial-gradient(circle at top right, #1a2a44, #0a0e17);
            color: white; font-family: -apple-system, system-ui, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 20px; text-align: center;
        }
        .logo { width: 280px; margin-bottom: 40px; filter: drop-shadow(0 0 15px rgba(0, 102, 255, 0.4)); }
        h1 { font-size: 20px; margin-bottom: 30px; letter-spacing: 1px; color: #0066ff; text-transform: uppercase; }
        .menu-btn {
            display: flex; align-items: center; justify-content: center;
            width: 100%; max-width: 320px; padding: 25px; margin-bottom: 20px;
            border-radius: 18px; text-decoration: none; font-weight: 800; font-size: 16px;
            text-transform: uppercase; transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .btn-video {
            background: linear-gradient(135deg, #0066ff, #0044cc); color: white; border: 1px solid #0055aa;
        }
        .btn-report {
            background: rgba(255, 170, 0, 0.1); color: #ffaa00; border: 2px solid #ffaa00;
        }
        .menu-btn:active { transform: scale(0.96); }
        .icon { font-size: 24px; margin-right: 12px; }
        .footer { margin-top: 40px; font-size: 11px; color: #444; }
    </style>
</head>
<body>
    <img src="Final-01.jpg" alt="SLGP Logo" class="logo">
    <h1>Select Action</h1>

    <a href="/video" class="menu-btn btn-video">
        <span class="icon">📹</span> Daily Video Inspection
    </a>

    <a href="/report" class="menu-btn btn-report">
        <span class="icon">⚠️</span> Report Issue / Accident
    </a>

    <div class="footer">SLGP Fleet Portal v5.0</div>
</body>
</html>
