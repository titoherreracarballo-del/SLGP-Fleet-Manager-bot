<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLGP Fleet Portal</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon.jpg">
    <link rel="icon" type="image/jpeg" href="icon.jpg">
    <style>
        body {
            background-color: #0a0e17;
            background-image: radial-gradient(circle at top right, #1a2a44, #0a0e17);
            color: white; font-family: -apple-system, system-ui, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; padding: 20px; text-align: center;
        }
        .logo { width: 280px; margin-bottom: 30px; filter: drop-shadow(0 0 15px rgba(0, 102, 255, 0.4)); }
        
        /* UPDATED BUTTON CONTAINER */
        .menu-btn {
            display: flex;
            flex-direction: column; /* Stacks image on top of text */
            width: 100%; max-width: 320px; 
            margin-bottom: 25px;
            border-radius: 18px; 
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4); 
            padding: 0; 
            background: rgba(255, 255, 255, 0.05); /* Background for text area */
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden; 
        }
        
        .menu-btn:active { transform: scale(0.97); }

        /* NEW: IMAGE BOX (Enforces Uniform Height) */
        .btn-img-box {
            width: 100%;
            height: 180px; /* FIXED HEIGHT for all buttons */
            overflow: hidden;
        }

        /* UPDATED IMAGE STYLE */
        .btn-img {
            width: 100%;       
            height: 100%;      
            object-fit: cover; /* Fills the box perfectly without stretching */
            display: block;
        }

        /* NEW: LABEL STYLE */
        .btn-label {
            padding: 15px;
            font-size: 16px;
            font-weight: 800;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* COLOR-CODED BOTTOM BARS */
        .lbl-video { border-bottom: 4px solid #0066ff; }
        .lbl-issue { border-bottom: 4px solid #ff9900; }
        .lbl-accident { border-bottom: 4px solid #ff4444; }

        .footer { margin-top: 40px; font-size: 11px; color: #444; }
    </style>
</head>
<body>
    <img src="Final-01.jpg" alt="SLGP Logo" class="logo">

    <a href="/video" class="menu-btn">
        <div class="btn-img-box">
            <img src="Pre & Post Fleet Vids.jpg" class="btn-img" alt="Daily Video Check">
        </div>
        <div class="btn-label lbl-video">Daily Video Check</div>
    </a>

    <a href="/report?mode=issue" class="menu-btn">
        <div class="btn-img-box">
            <img src="Report An Issue.jpg" class="btn-img" alt="Report Issue">
        </div>
        <div class="btn-label lbl-issue">Report Issue</div>
    </a>

    <a href="/report?mode=accident" class="menu-btn">
        <div class="btn-img-box">
            <img src="Accident or Incident Reporting.jpg" class="btn-img" alt="Report Accident">
        </div>
        <div class="btn-label lbl-accident">Report Accident</div>
    </a>

    <div class="footer">SLGP Fleet Portal v5.6</div>
</body>
</html>
