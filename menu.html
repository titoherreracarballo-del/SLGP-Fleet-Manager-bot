<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategic Logistics Dashboard</title>
    <style>
        /* --- RESET & BASIC SETUP --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050b14; /* Deep dark blue background */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- HEADER --- */
        .status-bar {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #00ffff;
            margin-bottom: 20px;
            letter-spacing: 1px;
            font-weight: bold;
            opacity: 0.8;
        }

        .logo-container {
            background: #0b1629;
            border: 1px solid #1c2e4a;
            border-radius: 12px;
            padding: 15px 30px;
            margin-bottom: 30px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .logo-text {
            font-style: italic;
            font-weight: 900;
            font-size: 1.5rem;
            color: #fff;
            text-transform: uppercase;
        }
        .logo-highlight { color: #007bff; }

        /* --- MENU GRID --- */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        /* --- CARD STYLES --- */
        .card {
            background: #1a2639;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 2px solid transparent;
            text-decoration: none;
            display: block;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        
        .card:active {
            transform: translateY(1px);
        }

        .card-image {
            width: 100%;
            height: 120px;
            object-fit: cover;
            background-color: #333;
            display: block;
        }

        .card-footer {
            padding: 12px 15px;
            background: linear-gradient(90deg, #101926 0%, #162030 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .card-title {
            color: #fff;
            font-weight: 900;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .arrow-icon {
            font-weight: bold;
            font-size: 1.2rem;
        }

        /* --- SPECIFIC CARD COLORS --- */
        .card-fleet { border-color: #00d2ff; }
        .card-fleet .arrow-icon { color: #00d2ff; }
        .card-fleet:hover { box-shadow: 0 0 15px rgba(0, 210, 255, 0.3); }

        .card-issue { border-color: #ff9d00; }
        .card-issue .arrow-icon { color: #ff9d00; }
        .card-issue:hover { box-shadow: 0 0 15px rgba(255, 157, 0, 0.3); }

        .card-accident { border-color: #ff3333; }
        .card-accident .arrow-icon { color: #ff3333; }
        .card-accident:hover { box-shadow: 0 0 15px rgba(255, 51, 51, 0.3); }

        .card-insurance { border-color: #00ff88; }
        .card-insurance .arrow-icon { color: #00ff88; }
        .card-insurance:hover { box-shadow: 0 0 15px rgba(0, 255, 136, 0.3); }

        /* --- FORCE ENABLE UTILITY --- */
        .force-enable {
            pointer-events: auto !important;
            opacity: 1 !important;
            filter: none !important;
        }

    </style>
</head>
<body>

    <div class="status-bar">
        <span>SYSTEM: ONLINE</span>
        <span>SLGP-NET V6.4</span>
    </div>

    <div class="logo-container">
        <h1 class="logo-text">Strategic <span class="logo-highlight">Logistics</span></h1>
    </div>

    <div class="menu-grid">

        <a href="/video" class="card card-fleet force-enable">
            <img src="https://placehold.co/600x300/222/00d2ff?text=Fleet+Vids" alt="Fleet Vids" class="card-image">
            <div class="card-footer">
                <span class="card-title">Pre & Post Fleet Vids</span>
                <span class="arrow-icon">&rsaquo;</span>
            </div>
        </a>

        <a href="/report?mode=issue" class="card card-issue force-enable">
            <img src="https://placehold.co/600x300/222/ff9d00?text=Report+Issue" alt="Report Issue" class="card-image">
            <div class="card-footer">
                <span class="card-title">Report Issue</span>
                <span class="arrow-icon">&rsaquo;</span>
            </div>
        </a>

        <a href="/report?mode=accident" class="card card-accident force-enable">
            <img src="https://placehold.co/600x300/222/ff3333?text=Accident+Report" alt="Accident Report" class="card-image">
            <div class="card-footer">
                <span class="card-title">Accident/Incident Report</span>
                <span class="arrow-icon">&rsaquo;</span>
            </div>
        </a>

        <a href="/report?mode=insurance" class="card card-insurance force-enable">
            <img src="https://placehold.co/600x300/222/00ff88?text=Insurance+Cards" alt="Insurance Cards" class="card-image">
            <div class="card-footer">
                <span class="card-title">Insurance Cards</span>
                <span class="arrow-icon">&rsaquo;</span>
            </div>
        </a>

    </div>

</body>
</html>
