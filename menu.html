<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategic Logistics Dashboard</title>
    <style>
        /* --- RESET & BASIC SETUP --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050b14;
            /* The subtle grid background */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- HEADER --- */
        .status-bar {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #00ffff;
            margin-bottom: 20px;
            letter-spacing: 1px;
            font-weight: bold;
            opacity: 0.8;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
        }

        .logo-container {
            background: #0b1629;
            border: 1px solid #1c2e4a;
            border-radius: 12px;
            padding: 15px 30px;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
            max-width: 400px;
            width: 100%;
            text-align: center;
            /* Added a subtle inner glow to match the tech feel */
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .logo-text {
            font-style: italic;
            font-weight: 900;
            font-size: 1.8rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: -1px;
        }
        .logo-highlight { color: #007bff; }

        /* --- MENU GRID --- */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        /* --- CARD STYLES --- */
        .card {
            background: #1a2639;
            border-radius: 16px; /* Slightly more rounded */
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            display: block;
            border: 2px solid; /* Border color is defined by specific classes below */
        }

        .card:hover {
            transform: scale(1.02);
            z-index: 10;
        }

        .card-image {
            width: 100%;
            height: 140px; /* Slightly taller to match screenshot */
            object-fit: cover;
            background-color: #222;
            display: block;
            border-bottom: 2px solid rgba(0,0,0,0.3);
        }

        /* --- THE DARK STRIPED FOOTER --- */
        .card-footer {
            height: 50px;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            
            /* This creates the diagonal stripe pattern */
            background: repeating-linear-gradient(
                45deg,
                #131b26,
                #131b26 10px,
                #18212e 10px,
                #18212e 20px
            );
            color: white;
            position: relative;
        }

        /* The text inside the footer */
        .card-title {
            color: #fff;
            font-weight: 900;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            z-index: 2;
        }

        .arrow-icon {
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 2;
        }

        /* --- SPECIFIC CARD THEMES (Borders & Glows) --- */

        /* 1. Fleet Vids (Cyan) */
        .card-fleet { 
            border-color: #00d2ff; 
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.1);
        }
        .card-fleet .arrow-icon { color: #00d2ff; }
        .card-fleet:hover { box-shadow: 0 0 20px rgba(0, 210, 255, 0.4); }

        /* 2. Report Issue (Orange) */
        .card-issue { 
            border-color: #ff9d00; 
            box-shadow: 0 0 10px rgba(255, 157, 0, 0.1);
        }
        .card-issue .arrow-icon { color: #ff9d00; }
        .card-issue:hover { box-shadow: 0 0 20px rgba(255, 157, 0, 0.4); }

        /* 3. Accident Report (Red) */
        .card-accident { 
            border-color: #ff3333; 
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.1);
        }
        .card-accident .arrow-icon { color: #ff3333; }
        .card-accident:hover { box-shadow: 0 0 20px rgba(255, 51, 51, 0.4); }

        /* 4. Insurance Cards (Green) */
        .card-insurance { 
            border-color: #00ff88; 
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.1);
        }
        .card-insurance .arrow-icon { color: #00ff88; }
        .card-insurance:hover { box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); }

    </style>
</head>
<body>

    <div class="status-bar">
        <span>SYSTEM: ONLINE</span>
        <span>SLGP-NET V6.4</span>
    </div>

    <div class="logo-container">
        <h1 class="logo-text">Strategic <span class="logo-highlight">Logistics</span></h1>
    </div>

    <div class="menu-grid">

        <a href="/video" class="card card-fleet">
            <img src="https://placehold.co/600x300/1a2639/00d2ff?text=Fleet+Video" alt="Fleet Vids" class="card-image">
            <div class="card-footer">
                <span class="card-title">Pre & Post Fleet Vids</span>
                <span class="arrow-icon">&rsaquo;</span>
            </div>
        </a>

        <a href="/report?mode=issue" class="card card-issue">
            <img src="https://placehold.co/600x300/1a2639/ff9d00?text=Report+Issue" alt="Report Issue" class="card-image">
            <div class="card-footer">
                <span class="card-title">Report Issue</span>
                <span class="arrow-icon">&rsaquo;</span>
            </div>
        </a>

        <a href="/report?mode=accident" class="card card-accident">
            <img src="https://placehold.co/600x300/1a2639/ff3333?text=Accident+Report" alt="Accident Report" class="card-image">
            <div class="card-footer">
                <span class="card-title">Accident/Incident Report</span>
                <span class="arrow-icon">&rsaquo;</span>
            </div>
        </a>

        <a href="/report?mode=insurance" class="card card-insurance">
            <img src="https://placehold.co/600x300/1a2639/00ff88?text=Insurance+Cards" alt="Insurance Cards" class="card-image">
            <div class="card-footer">
                <span class="card-title">Insurance Cards</span>
                <span class="arrow-icon">&rsaquo;</span>
            </div>
        </a>

    </div>

</body>
</html>
