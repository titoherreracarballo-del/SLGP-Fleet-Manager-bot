<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLGP Fleet Portal</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon.jpg">
    <link rel="icon" type="image/jpeg" href="icon.jpg">
    <style>
        /* --- DIGITAL HUD THEME STYLES --- */
        :root {
            --bg-dark: #050B14;
            --bg-card-dark: linear-gradient(135deg, #1a1f2c, #0d1117);
            --text-primary: #E2E8F0;
            --text-dim: #64748B;
            
            /* Neon Accents */
            --neon-blue: #00f2ff;
            --neon-orange: #ffaa00;
            --neon-red: #ff2a2a;
            --neon-green: #00ff88;
        }

        body {
            background-color: var(--bg-dark);
            /* Abstract circuit/grid background */
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.02) 0%, transparent 60%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* --- HEADER ELEMENTS --- */
        .system-header {
            width: 100%; max-width: 360px; display: flex; justify-content: space-between;
            font-size: 10px; color: var(--neon-blue); text-transform: uppercase;
            letter-spacing: 2px; margin-bottom: 20px; opacity: 0.8; font-weight: 700;
        }

        .logo-container { 
            width: 100%; max-width: 300px;
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 20px; 
            border-radius: 20px; margin-bottom: 30px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .logo-container img { width: 100%; display: block; border-radius: 12px; }
        
        /* --- MENU GRID --- */
        .menu-grid {
            width: 100%; max-width: 360px;
            display: flex; flex-direction: column; gap: 20px;
        }

        /* --- DIGITAL CREDIT CARD STYLE --- */
        .menu-card {
            position: relative;
            display: block;
            width: 100%;
            height: 160px; /* Credit card aspect ratio */
            border-radius: 20px;
            text-decoration: none;
            background: var(--bg-card-dark);
            border: 2px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        .menu-card:active { transform: scale(0.98); }
        .menu-card:hover { transform: translateY(-5px); }

        /* Background Image Integration */
        .card-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            opacity: 0.15; /* Subtle background texture */
            mix-blend-mode: luminosity;
            z-index: 0; transition: opacity 0.3s;
        }
        .menu-card:hover .card-bg { opacity: 0.3; }

        /* Card Overlays (Scanlines/Glare) */
        .menu-card::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 100% 3px; pointer-events: none; z-index: 1; opacity: 0.3;
        }

        /* Content Layout */
        .card-content {
            position: relative; z-index: 2; height: 100%; padding: 20px;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        /* Top Section (Chips/Icons) */
        .card-top { display: flex; justify-content: space-between; align-items: center; }
        
        /* Fake EMV Chip */
        .chip {
            width: 45px; height: 35px;
            background: linear-gradient(135deg, #d4af37, #a8860b);
            border-radius: 6px; position: relative; overflow: hidden;
            border: 1px solid rgba(0,0,0,0.2);
        }
        .chip::before {
            content: ""; position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(0,0,0,0.3);
        }
        .chip::after {
             content: ""; position: absolute; left: 33%; top: 0; width: 33%; height: 100%; border-left: 1px solid rgba(0,0,0,0.3); border-right: 1px solid rgba(0,0,0,0.3);
        }

        .contactless { width: 24px; height: 24px; fill: rgba(255,255,255,0.7); transform: rotate(90deg); }

        /* Bottom Section (Title/Arrow) */
        .card-bottom { display: flex; justify-content: space-between; align-items: flex-end; }

        .btn-label {
            font-size: 18px; font-weight: 900; color: white;
            text-transform: uppercase; letter-spacing: 1px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
            max-width: 80%;
        }

        .btn-icon {
            width: 24px; height: 24px; opacity: 0.7;
            transition: transform 0.3s, opacity 0.3s;
        }
        .menu-card:hover .btn-icon { transform: translateX(5px); opacity: 1; }

        /* --- THEME GLOWS --- */
        .theme-video { border-color: rgba(0, 242, 255, 0.4); }
        .theme-video:hover { box-shadow: 0 0 25px rgba(0, 242, 255, 0.4); }
        .theme-video .btn-icon, .theme-video .contactless { fill: var(--neon-blue); }

        .theme-issue { border-color: rgba(255, 170, 0, 0.4); }
        .theme-issue:hover { box-shadow: 0 0 25px rgba(255, 170, 0, 0.4); }
        .theme-issue .btn-icon, .theme-issue .contactless { fill: var(--neon-orange); }

        .theme-accident { border-color: rgba(255, 42, 42, 0.4); }
        .theme-accident:hover { box-shadow: 0 0 25px rgba(255, 42, 42, 0.4); }
        .theme-accident .btn-icon, .theme-accident .contactless { fill: var(--neon-red); }

        .theme-insurance { border-color: rgba(0, 255, 136, 0.4); }
        .theme-insurance:hover { box-shadow: 0 0 25px rgba(0, 255, 136, 0.4); }
        .theme-insurance .btn-icon, .theme-insurance .contactless { fill: var(--neon-green); }

        .footer { 
            margin-top: 30px; font-size: 10px; color: var(--text-dim); 
            letter-spacing: 1px; text-transform: uppercase;
        }
    </style>
</head>
