<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accident Report</title>
    <style>
        /* --- MATCHING THEME --- */
        :root {
            --bg-body: #0F1115;
            --bg-card: #161B28;
            --bg-input: #0b0d12;
            --bg-btn: #242c3d;
            --primary-blue: #2563EB;
            --primary-red: #EF4444; /* Keep Red ONLY for header/submit urgency */
            --text-label: #3B82F6;
            --text-green: #4ade80;
            --radius: 12px;
        }

        body {
            background-color: var(--bg-body);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: var(--bg-card);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid #1f2937;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .back-link { color: #94a3b8; text-decoration: none; display: block; margin-bottom: 20px; }
        .timestamp { color: var(--text-green); text-align: center; font-size: 13px; font-weight: 700; margin-bottom: 5px; }
        
        h1 {
            color: var(--primary-red); /* Red for accident urgency */
            text-align: center; font-size: 24px; font-weight: 900; 
            text-transform: uppercase; margin: 0 0 25px 0; letter-spacing: 1px;
        }

        .form-group { margin-bottom: 20px; }
        label {
            color: var(--text-label); display: block; font-size: 11px; font-weight: 800; 
            text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px;
        }
        input, textarea {
            width: 100%; background-color: var(--bg-input); border: 1px solid #1f2937; color: white;
            padding: 16px; border-radius: var(--radius); font-size: 16px; box-sizing: border-box; outline: none;
        }
        input:focus, textarea:focus { border-color: var(--primary-red); }

        .btn-option {
            width: 100%; background-color: var(--bg-btn); border: 1px solid #2d3748; color: #cbd5e1;
            padding: 14px; border-radius: var(--radius); font-weight: 700; font-size: 13px;
            text-transform: uppercase; cursor: pointer; margin-bottom: 10px; transition: all 0.2s;
        }
        .btn-option:hover { background-color: #334155; }
        .btn-option.selected { background-color: #1e293b; border-color: var(--text-label); color: white; }

        .btn-submit {
            width: 100%; background-color: var(--primary-red); color: white; border: none;
            padding: 18px; border-radius: var(--radius); font-weight: 900; font-size: 16px;
            text-transform: uppercase; margin-top: 10px; cursor: pointer;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="/" class="back-link">← Back to Menu</a>
        <div class="timestamp">1/3/2026, 12:12:00 PM</div>
        <h1>Accident Report</h1>

        <div class="form-group">
            <label>Driver Full Name</label>
            <input type="text" placeholder="Name">
        </div>

        <div class="form-group">
            <label>Incident Type</label>
            <button class="btn-option">Collision</button>
            <button class="btn-option">Parked / Hit & Run</button>
            <button class="btn-option">Theft / Vandalism</button>
            <button class="btn-option">Property Damage</button>
        </div>

        <div class="form-group">
            <label>Location</label>
            <input type="text" placeholder="Address or Intersection">
        </div>

        <div class="form-group">
            <label>Statement</label>
            <textarea style="min-height: 100px;" placeholder="Describe what happened..."></textarea>
        </div>

        <button class="btn-submit">Submit Accident Report</button>
    </div>

    <script>
        document.querySelectorAll('.btn-option').forEach(btn => {
            btn.addEventListener('click', function() {
                // Deselect siblings
                this.parentElement.querySelectorAll('.btn-option').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
            });
        });
    </script>
</body>
</html>
