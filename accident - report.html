<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accident Report - Fleet Health</title>
    <style>
        /* --- THEME SETTINGS --- */
        :root {
            --bg-body: #0F1115;
            --bg-card: #161B28;
            --bg-input: #0b0d12;
            --bg-button: #242c3d;
            --primary-red: #EF4444;   /* RED for Accident */
            --text-label: #3B82F6;
            --text-green: #4ade80;
            --radius: 12px;
        }

        body {
            background-color: var(--bg-body);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
            color: white;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background-color: var(--bg-card);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid #1f2937;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* --- HEADER --- */
        .back-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 20px;
            transition: color 0.2s;
        }
        .back-link:hover { color: white; }

        .timestamp {
            color: var(--text-green);
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        h1 {
            color: var(--primary-red); /* Red Header */
            text-align: center;
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 30px 0;
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }

        /* --- FORMS --- */
        .form-group { margin-bottom: 20px; }

        label {
            color: var(--text-label);
            display: block;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        input, textarea {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid #1f2937;
            color: white;
            padding: 16px;
            border-radius: var(--radius);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
        }

        input:focus, textarea:focus {
            border-color: var(--primary-red); /* Red Focus Border */
        }

        /* --- BUTTONS --- */
        .btn-option {
            width: 100%;
            background-color: var(--bg-button);
            border: 1px solid #374151;
            color: #cbd5e1;
            padding: 14px;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            cursor: pointer;
            margin-bottom: 10px;
            transition: background 0.2s;
        }

        .btn-option:hover { background-color: #334155; color: white; }
        
        .btn-option.selected {
            background-color: #1e293b;
            border-color: var(--text-label);
            color: white;
        }

        .row-split { display: flex; gap: 10px; }
        .row-split .btn-option { margin-bottom: 0; }

        /* --- CAMERA BOX --- */
        .camera-box {
            border: 2px dashed #4b5563;
            border-radius: 16px;
            height: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background-color: rgba(255,255,255,0.02);
            transition: border-color 0.2s;
        }
        .camera-box:hover { border-color: var(--primary-red); }
        
        .camera-icon { width: 32px; height: 32px; fill: #64748b; margin-bottom: 5px; }
        .camera-text { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }

        /* --- SUBMIT BUTTON (RED) --- */
        .btn-submit {
            width: 100%;
            background-color: var(--primary-red);
            color: white;
            border: none;
            padding: 18px;
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: var(--radius);
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
            transition: transform 0.1s;
        }
        .btn-submit:active { transform: scale(0.98); }

    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">← Back to Menu</a>
        
        <div class="timestamp">1/2/2026, 6:48:10 PM</div>
        <h1>Accident Report</h1>

        <div class="form-group">
            <label>Incident Type</label>
            <button class="btn-option selected">Collision (Traffic)</button>
            <button class="btn-option">Parked / Hit & Run</button>
            <button class="btn-option">Theft / Vandalism</button>
            <button class="btn-option">Property Damage</button>
        </div>

        <div class="form-group">
            <label>Third Party Involved?</label>
            <div class="row-split">
                <button class="btn-option">No</button>
                <button class="btn-option selected">Yes</button>
            </div>
        </div>

        <div class="form-group">
            <label>Location</label>
            <input type="text" placeholder="Street Address or Intersection">
        </div>

        <div class="form-group">
            <label>Driver Statement</label>
            <textarea style="min-height: 100px;" placeholder="Briefly describe how the incident occurred..."></textarea>
        </div>

        <div class="form-group">
            <label>Required Photos</label>
            <div class="camera-box">
                <svg class="camera-icon" viewBox="0 0 24 24">
                    <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v12h16V6h-2.5L15.5 4h-7L6.5 6H4zm8 11a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                </svg>
                <span class="camera-text">4 Sides + Scene Context</span>
            </div>
        </div>

        <button class="btn-submit">Submit Accident Report</button>
    </div>

</body>
</html>
