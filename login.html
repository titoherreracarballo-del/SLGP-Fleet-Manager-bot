<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SLGP Fleet Portal</title>
    <style>
        :root {
            --bg-dark: #000000;
            --bg-card: #161B28;
            --neon-blue: #00A8E1;
            --text-white: #ffffff;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(0, 168, 225, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 168, 225, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .login-container {
            background: var(--bg-card);
            border: 2px solid var(--neon-blue);
            border-radius: 24px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 50px rgba(0, 168, 225, 0.3);
            text-align: center;
        }

        .logo {
            width: 100%;
            max-width: 280px;
            margin-bottom: 30px;
            border-radius: 8px;
        }

        h1 {
            color: var(--neon-blue);
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0 0 10px 0;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        input[type="password"] {
            width: 100%;
            padding: 16px;
            background: #0b0d12;
            border: 1px solid #2d3748;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
        }

        input[type="password"]:focus {
            border-color: var(--neon-blue);
        }

        .login-btn {
            width: 100%;
            padding: 18px;
            background: var(--neon-blue);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            box-shadow: 0 0 20px rgba(0, 168, 225, 0.5);
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-msg {
            color: #ef4444;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }

        .security-notice {
            margin-top: 30px;
            padding: 15px;
            background: rgba(255, 153, 0, 0.1);
            border: 1px solid #FF9900;
            border-radius: 8px;
            font-size: 12px;
            color: #fbbf24;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="/Final-01.jpg" alt="SLGP Logo" class="logo">
        <h1>Fleet Portal</h1>
        <p class="subtitle">Enter password to access</p>
        
        <form id="loginForm">
            <input 
                type="password" 
                id="password" 
                placeholder="Enter Password" 
                autocomplete="current-password"
                required
            >
            <button type="submit" class="login-btn" id="loginBtn">Access Portal</button>
        </form>
        
        <div class="error-msg" id="errorMsg">Invalid password. Please try again.</div>
        
        <div class="security-notice">
            🔒 This portal is for authorized personnel only. Unauthorized access is prohibited.
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            btn.disabled = true;
            btn.textContent = 'Verifying...';
            errorMsg.style.display = 'none';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = '/';
                } else {
                    errorMsg.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Access Portal';
                    document.getElementById('password').value = '';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMsg.textContent = 'Connection error. Please try again.';
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Access Portal';
            }
        });
    </script>
</body>
</html>
