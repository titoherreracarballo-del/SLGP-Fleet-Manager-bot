<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Received</title>
    <style>
        :root {
            --bg-body: #0F1115;       
            --bg-card: #161B28;       
            --primary-blue: #2563EB;  
            --text-label: #3B82F6;    
            --text-white: #ffffff;
            --text-gray: #94a3b8;
            --radius: 24px;
        }

        body {
            background-color: var(--bg-body);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: var(--bg-card);
            border-radius: var(--radius);
            padding: 40px 24px;
            border: 1px solid #1f2937;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            animation: fadeIn 0.5s ease-out;
        }

        h1 {
            color: var(--text-white);
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0 0 15px 0;
            letter-spacing: 1px;
        }

        p {
            color: var(--text-gray);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* The "Note" Box */
        .note-box {
            background-color: rgba(239, 68, 68, 0.1); /* Red tint */
            border: 1px solid #ef4444;
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            margin-bottom: 30px;
        }

        .note-title {
            color: #ef4444;
            font-weight: 900;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
        }

        .note-text {
            color: #fca5a5;
            font-size: 13px;
            margin: 0;
        }

        .home-btn {
            display: block;
            width: 100%;
            background-color: var(--primary-blue);
            color: white;
            text-decoration: none;
            padding: 18px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 16px;
            text-transform: uppercase;
            box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
            transition: transform 0.2s;
        }

        .home-btn:active { transform: scale(0.98); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .check-icon {
            width: 80px; height: 80px; fill: #4ade80; margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <svg class="check-icon" viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
    </svg>

    <h1>Thank You For Your Submission</h1>
    
    <p>Your reported issue(s) will be assessed during fleet operating hours (11:00 PM to 9:00 AM).</p>

    <div class="note-box">
        <span class="note-title">Please Note:</span>
        <p class="note-text">Any EDV-related issues can only be repaired by Rivian (up to 3 weeks).</p>
    </div>

    <a href="/" class="home-btn">Return to Menu</a>
</div>

</body>
</html>
