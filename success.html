<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Received</title>
    <style>
        :root {
            --bg-body: #0F1115;       
            --bg-card: #161B28;       
            --primary-blue: #2563EB;  
            --text-white: #ffffff;
            --text-bright: #E2E8F0;
            --radius: 24px;
        }

        body {
            background-color: var(--bg-body);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: var(--bg-card);
            border-radius: var(--radius);
            padding: 40px 24px;
            border: 1px solid #1f2937;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            animation: fadeIn 0.5s ease-out;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        /* --- LOGO WATERMARK --- */
        .container::before {
            content: "";
            background-image: url('/Final-01.jpg'); 
            background-repeat: no-repeat;
            background-position: center center;
            background-size: 80%; 
            opacity: 0.08; 
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1; 
            pointer-events: none;
        }

        h1 {
            color: var(--text-white);
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0 0 20px 0;
            letter-spacing: 1.5px;
            line-height: 1.2;
            position: relative;
        }

        /* BOLD MAIN TEXT */
        .main-text {
            color: var(--text-bright);
            font-size: 19px;
            font-weight: 900; /* Extra Bold */
            line-height: 1.5;
            margin-bottom: 35px;
            position: relative;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .note-box {
            background-color: rgba(239, 68, 68, 0.15);
            border: 2px solid #ef4444;
            border-radius: 16px;
            padding: 20px;
            text-align: left;
            margin-bottom: 35px;
            position: relative;
            background-color: rgba(239, 68, 68, 0.15);
        }

        .note-title {
            color: #ef4444;
            font-weight: 900;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: block;
        }

        /* OPTION 3 WORDING + BOLD */
        .note-text {
            color: #fca5a5;
            font-size: 16px;
            font-weight: 700;
            margin: 0;
            line-height: 1.4;
        }

        .home-btn {
            display: block;
            width: 100%;
            background-color: var(--primary-blue);
            color: white;
            text-decoration: none;
            padding: 20px;
            border-radius: 16px;
            font-weight: 900;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-sizing: border-box;
            box-shadow: 0 6px 25px rgba(37, 99, 235, 0.5);
            transition: transform 0.2s;
            position: relative;
        }

        .home-btn:active { transform: scale(0.97); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        .check-icon {
            width: 90px; height: 90px; fill: #4ade80; margin-bottom: 25px; filter: drop-shadow(0 0 10px rgba(74, 222, 128, 0.3)); position: relative;
        }
    </style>
</head>
<body>

<div class="container">
    <svg class="check-icon" viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
    </svg>

    <h1>Thank You For Your Submission</h1>
    
    <p class="main-text">Your reported issue(s) will be assessed during fleet operating hours (11:00 PM to 9:00 AM).</p>

    <div class="note-box">
        <span class="note-title">Please Note:</span>
        <p class="note-text">EDV issues require specialized service from Rivian. Please anticipate a repair timeline of up to 3 weeks.</p>
    </div>

    <a href="/" class="home-btn">Return to Menu</a>
</div>

</body>
</html>
