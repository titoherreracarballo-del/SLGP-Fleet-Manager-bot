<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Issue</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        /* --- THEME SETTINGS --- */
        :root {
            --bg-body: #0F1115;       
            --bg-card: #161B28;       
            --bg-input: #0b0d12;      
            --primary-blue: #2563EB;  
            --primary-glow: rgba(37, 99, 235, 0.4);
            --text-label: #3B82F6;    
            --text-white: #ffffff;
            --text-gray: #94a3b8;
            --border-color: #2d3748;
            --radius: 12px;
        }

        body {
            background-color: var(--bg-body);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: var(--bg-card);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid #1f2937;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        /* --- HEADERS --- */
        .back-link {
            color: var(--text-gray); text-decoration: none; font-size: 14px; margin-bottom: 20px; display: block;
        }
        .timestamp {
            color: #4ade80; text-align: center; font-size: 13px; font-weight: 700; margin-bottom: 5px;
        }
        h1 {
            color: var(--text-label); text-align: center; font-size: 24px; font-weight: 900; 
            text-transform: uppercase; margin: 0 0 25px 0; letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        /* --- INPUTS --- */
        .form-group { margin-bottom: 20px; }
        
        /* ADJUSTED LAYOUT FOR LONG NAMES */
        .row-split { display: flex; gap: 15px; }
        
        /* VIN Box = Smaller (30%) */
        .vin-col { flex: 0.4; min-width: 80px; } 
        
        /* Vehicle Type Box = Larger (70%) */
        .type-col { flex: 1.6; }

        label {
            color: var(--text-label); display: block; font-size: 11px; font-weight: 800; 
            text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px;
            white-space: nowrap; /* Prevents label wrapping */
        }
        input, textarea {
            width: 100%; background-color: var(--bg-input); border: 1px solid var(--border-color); color: white;
            padding: 16px; border-radius: var(--radius); font-size: 14px; box-sizing: border-box; outline: none;
            transition: border-color 0.2s;
            text-overflow: ellipsis; /* Handles extremely long text gracefully */
        }
        input:focus, textarea:focus { border-color: var(--text-label); }

        /* Readonly VIN Display */
        input[readonly] {
            background-color: #1a202c; 
            font-weight: bold;
            cursor: not-allowed;
            border-color: #2d3748;
            color: #6b7280; 
        }
        
        /* Auto-Fix Colors */
        input[readonly].gas-mode { color: #ef4444 !important; border-color: #ef4444; }
        input[readonly].diesel-mode { color: #4ade80 !important; border-color: #4ade80; }
        input[readonly].electric-mode { color: #ffffff !important; border-color: #ffffff; }

        /* --- CATEGORY TABS --- */
        .tabs {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px;
        }
        .tab-btn {
            background-color: transparent; border: 1px solid #374151; color: #64748b;
            padding: 12px; border-radius: var(--radius); font-size: 11px; font-weight: 800;
            text-transform: uppercase; cursor: pointer; transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: #1e3a8a; border-color: var(--text-label); color: white;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.2);
        }

        /* --- LIST BUTTONS --- */
        .section { display: none; }
        .section.active { display: block; }
        .list-options { display: flex; flex-direction: column; gap: 10px; }

        .list-btn {
            width: 100%; display: flex; align-items: center; gap: 15px; text-align: left;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid #334155; color: #E2E8F0;
            padding: 16px 20px; border-radius: var(--radius);
            font-size: 14px; font-weight: 600; cursor: pointer;
            transition: all 0.2s ease; position: relative;
        }
        .list-btn:hover { border-color: var(--text-label); background-color: rgba(59, 130, 246, 0.1); }
        .list-btn.selected {
            background-color: var(--primary-blue); border-color: var(--primary-blue);
            color: white; box-shadow: 0 4px 15px var(--primary-glow); transform: translateY(-1px);
        }
        .list-btn.selected::after { content: "✓"; position: absolute; right: 20px; font-weight: bold; }

        /* Icons */
        .opt-icon { width: 24px; height: 24px; object-fit: contain; flex-shrink: 0; fill: #94a3b8; }
        .list-btn.selected .opt-icon { fill: white; } 

        /* --- CAMERA BOX --- */
        .camera-box {
            border: 2px dashed #4b5563; border-radius: 16px; height: 140px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; background-color: rgba(255,255,255,0.02);
            position: relative; overflow: hidden; transition: border-color 0.2s;
        }
        .camera-box:hover { border-color: var(--text-label); background-color: rgba(59, 130, 246, 0.05); }
        #photoInput { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10; }
        .camera-icon { width: 40px; height: 40px; fill: #cbd5e1; margin-bottom: 10px; }
        .camera-title { font-size: 13px; font-weight: 800; color: white; letter-spacing: 0.5px; margin-bottom: 4px; }
        .camera-sub { font-size: 10px; font-weight: 700; color: #ef4444; text-transform: uppercase; letter-spacing: 0.5px; }

        /* --- MAP --- */
        #map { height: 180px; width: 100%; border-radius: var(--radius); margin-top: 10px; border: 1px solid #374151; }
        #gpsStatus { font-size: 11px; color: #4ade80; margin-top: 5px; text-align: right; display: none; }

        /* --- HIDDEN NOTES --- */
        #otherNotesContainer { display: none; margin-top: 20px; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- SUBMIT --- */
        .submit-btn {
            width: 100%; background-color: var(--primary-blue); color: white; border: none;
            padding: 18px; border-radius: var(--radius); font-weight: 900; font-size: 16px;
            text-transform: uppercase; margin-top: 25px; cursor: pointer;
            box-shadow: 0 4px 20px var(--primary-glow);
        }
    </style>
</head>
<body>

<div class="container">
    <a href="/" class="back-link">← Back to Menu</a>
    <div class="timestamp" id="ts">Loading...</div>
    <h1>Report Issue</h1>
    
    <div class="form-group">
        <label>Driver Full Name</label>
        <input type="text" id="driverName" placeholder="Enter Full Name">
    </div>

    <div class="form-group row-split">
        <div class="vin-col">
            <label>Last 4 VIN</label>
            <input type="text" id="vinInput" placeholder="e.g. 1051" maxlength="4" onkeyup="checkVin()" style="text-transform:uppercase;">
        </div>
        <div class="type-col">
            <label>Vehicle Service Type</label>
            <input type="text" id="vehicleType" placeholder="Auto-Detect..." readonly>
        </div>
    </div>

    <label>Issue Category</label>
    <div class="tabs">
        <button class="tab-btn active" onclick="setTab('high')">High Priority</button>
        <button class="tab-btn" onclick="setTab('edv')">EDV / Electric</button>
        <button class="tab-btn" onclick="setTab('low')">Low Priority</button>
        <button class="tab-btn" onclick="setTab('mph')">MPH Error</button>
    </div>

    <div id="high" class="section active">
        <div class="list-options">
            <button class="list-btn"><svg class="opt-icon" viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm1 14h-2v2h2v-2zm0-6h-2v4h2v-4z"/></svg> Brakes Squealing / Grinding</button>
            <button class="list-btn"><svg class="opt-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg> Tire Blowout / Extreme Wear</button>
            <button class="list-btn">Steering Column Loose</button>
            <button class="list-btn">Vehicle Will Not Start</button>
            <button class="list-btn">Burning Smell / Fluid Leak</button>
            <button class="list-btn">Sliding / Rear Door Stuck</button>
            <button class="list-btn">Headlight / Taillight Out</button>
            <button class="list-btn">Backup Camera No Image</button>
            <button class="list-btn">Low DEF Light On</button>
            <button class="list-btn">Flat Tire / Battery Dead</button>
            <button class="list-btn">Missing Plate / Tag</button>
            <button class="list-btn">Other (See Notes)</button>
        </div>
    </div>

    <div id="edv" class="section">
        <div class="list-options">
            <button class="list-btn">Key Fob Battery Low</button>
            <button class="list-btn">Vehicle Not Charging</button>
            <button class="list-btn">Warning Light On</button>
            <button class="list-btn">Bulkhead Door Issue</button>
            <button class="list-btn">Severe Body Damage</button>
            <button class="list-btn">Broken Mirror / Glass</button>
            <button class="list-btn">Other (See Notes)</button>
        </div>
    </div>

    <div id="low" class="section">
        <div class="list-options">
            <button class="list-btn">Light Scratches</button>
            <button class="list-btn">Interior Dirty</button>
            <button class="list-btn">Door Sensor Error</button>
            <button class="list-btn">Seat Adjustment Stuck</button>
            <button class="list-btn">Radio / Audio Issue</button>
            <button class="list-btn">QR Code Faded</button>
            <button class="list-btn">Other (See Notes)</button>
        </div>
    </div>

    <div id="mph" class="section">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <label>Road / Location Details</label>
            <span id="gpsStatus">◎ GPS LOCKED</span>
        </div>
        <input type="text" id="street" placeholder="Auto-Detecting Street..." style="margin-bottom:10px;">
        <input type="text" id="city" placeholder="Auto-Detecting City..." style="margin-bottom:10px;">
        <input type="text" id="state" placeholder="Auto-Detecting State...">
        <div id="map"></div>
    </div>

    <div class="form-group" id="otherNotesContainer">
        <label>Additional Notes (Required for "Other")</label>
        <textarea id="notes" rows="3" placeholder="Describe the specific issue..."></textarea>
    </div>

    <div class="form-group" style="margin-top: 25px;">
        <label>LIVE CAMERA (NO UPLOADS)</label>
        <div class="camera-box">
            <input type="file" id="photoInput" multiple accept="image/*" capture="environment">
            <svg class="camera-icon" viewBox="0 0 24 24">
                <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v12h16V6h-2.5L15.5 4h-7L6.5 6H4zm8 11a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
            </svg>
            <div class="camera-title">TAP TO START CAMERA</div>
            <div class="camera-sub">GALLERY ACCESS DISABLED</div>
        </div>
    </div>

    <button class="submit-btn" onclick="submitForm()">Submit Report</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    document.getElementById('ts').innerText = new Date().toLocaleString();

    // ----------------------------------------------------
    //  FULL VIN DATABASE (From your Screenshot)
    // ----------------------------------------------------
    const vinDatabase = {
        // --- DIESEL (GREEN) ---
        "9488": { type: "Standard Parcel - Extra Large Van - US", fuel: "diesel" },
        "0213": { type: "Standard Parcel - Large Van", fuel: "diesel" },
        "8929": { type: "Standard Parcel - Extra Large Van - US", fuel: "diesel" },
        "5691": { type: "Standard Parcel - Extra Large Van - US", fuel: "diesel" },

        // --- ELECTRIC (WHITE) ---
        "7867": { type: "Standard Parcel Electric - Rivian MEDIUM", fuel: "electric" },
        "27867":{ type: "Standard Parcel Electric - Rivian MEDIUM", fuel: "electric" }, // Full 5 check
        "27871":{ type: "Standard Parcel Electric - Rivian MEDIUM", fuel: "electric" },
        "7871": { type: "Standard Parcel Electric - Rivian MEDIUM", fuel: "electric" },
        "29412":{ type: "Standard Parcel Electric - Rivian MEDIUM", fuel: "electric" },
        "9412": { type: "Standard Parcel Electric - Rivian MEDIUM", fuel: "electric" },
        "27866":{ type: "Standard Parcel Electric - Rivian MEDIUM", fuel: "electric" },
        "7866": { type: "Standard Parcel Electric - Rivian MEDIUM", fuel: "electric" },
        "27865":{ type: "Standard Parcel Electric - Rivian MEDIUM", fuel: "electric" },
        "7865": { type: "Standard Parcel Electric - Rivian MEDIUM", fuel: "electric" },
        "27860":{ type: "Standard Parcel Electric - Rivian MEDIUM", fuel: "electric" },
        "7860": { type: "Standard Parcel Electric - Rivian MEDIUM", fuel: "electric" },
        "29418":{ type: "Standard Parcel Electric - Rivian MEDIUM", fuel: "electric" },
        "9418": { type: "Standard Parcel Electric - Rivian MEDIUM", fuel: "electric" },
        "27863":{ type: "Standard Parcel Electric - Rivian MEDIUM", fuel: "electric" },
        "7863": { type: "Standard Parcel Electric - Rivian MEDIUM", fuel: "electric" },
        "27859":{ type: "Standard Parcel Electric - Rivian MEDIUM", fuel: "electric" },
        "7859": { type: "Standard Parcel Electric - Rivian MEDIUM", fuel: "electric" },
        "27857":{ type: "Standard Parcel Electric - Rivian MEDIUM", fuel: "electric" },
        "7857": { type: "Standard Parcel Electric - Rivian MEDIUM", fuel: "electric" },

        // --- GAS (RED) ---
        "1051": { type: "Standard Parcel - Extra Large Van - US", fuel: "gas" },
        "5490": { type: "Standard Parcel - Custom Delivery Van 16ft", fuel: "gas" },
        "7097": { type: "Standard Parcel - Custom Delivery Van 12ft", fuel: "gas" },
        "5311": { type: "Standard Parcel - Custom Delivery Van 16ft", fuel: "gas" },
        "3010": { type: "Standard Parcel - Extra Large Van - US", fuel: "gas" },
        "1587": { type: "Standard Parcel - Custom Delivery Van 16ft", fuel: "gas" },
        "5344": { type: "Standard Parcel - Extra Large Van - US", fuel: "gas" },
        "3344": { type: "Standard Parcel - Extra Large Van - US", fuel: "gas" }, // Typo safety
        "2347": { type: "Standard Parcel - Custom Delivery Van 14ft", fuel: "gas" },
        "0890": { type: "Standard Parcel - Extra Large Van - US", fuel: "gas" },
        "6880": { type: "Standard Parcel - Custom Delivery Van 12ft", fuel: "gas" },
        "1853": { type: "Standard Parcel - Extra Large Van - US", fuel: "gas" },
        "7373": { type: "Standard Parcel - Extra Large Van - US", fuel: "gas" },
        "0876": { type: "Standard Parcel - Extra Large Van - US", fuel: "gas" },
        "8786": { type: "Standard Parcel - Extra Large Van - US", fuel: "gas" },
        "6907": { type: "Standard Parcel - Custom Delivery Van 12ft", fuel: "gas" },
        "1295": { type: "Standard Parcel - Custom Delivery Van 12ft", fuel: "gas" },
        "9651": { type: "Standard Parcel - Extra Large Van - US", fuel: "gas" },
        "6265": { type: "Standard Parcel - Custom Delivery Van 16ft", fuel: "gas" },
        "6188": { type: "Standard Parcel - Custom Delivery Van 14ft", fuel: "gas" },
        "3754": { type: "Standard Parcel - Extra Large Van - US", fuel: "gas" },
        "1288": { type: "Standard Parcel - Custom Delivery Van 12ft", fuel: "gas" },
        "6864": { type: "Standard Parcel - Custom Delivery Van 12ft", fuel: "gas" },
        "7403": { type: "Standard Parcel - Extra Large Van - US", fuel: "gas" },
        "87373":{ type: "Standard Parcel - Extra Large Van - US", fuel: "gas" },
        "50876":{ type: "Standard Parcel - Extra Large Van - US", fuel: "gas" },
        "28786":{ type: "Standard Parcel - Extra Large Van - US", fuel: "gas" },
        "136907":{type: "Standard Parcel - Custom Delivery Van 12ft", fuel: "gas" },
        "138929":{type: "Standard Parcel - Extra Large Van - US", fuel: "gas" },
        "141295":{type: "Standard Parcel - Custom Delivery Van 12ft", fuel: "gas" },
        "49651":{ type: "Standard Parcel - Extra Large Van - US", fuel: "gas" },
        "46265":{ type: "Standard Parcel - Custom Delivery Van 16ft", fuel: "gas" },
        "46188":{ type: "Standard Parcel - Custom Delivery Van 14ft", fuel: "gas" },
        "503754":{type: "Standard Parcel - Extra Large Van - US", fuel: "gas" },
        "141288":{type: "Standard Parcel - Custom Delivery Van 12ft", fuel: "gas" },
        "145691":{type: "Standard Parcel - Extra Large Van - US", fuel: "gas" },
        "136864":{type: "Standard Parcel - Custom Delivery Van 12ft", fuel: "gas" },
        "587403":{type: "Standard Parcel - Extra Large Van - US", fuel: "gas" }
    };

    function checkVin() {
        let vin = document.getElementById('vinInput').value.toUpperCase();
        const typeBox = document.getElementById('vehicleType');
        
        typeBox.classList.remove('diesel-mode', 'gas-mode', 'electric-mode');
        
        if (vin.length >= 4) {
            // Check Database using last 4 or full entry
            let found = vinDatabase[vin];
            
            // Also try to match just the last 4 digits if user types more
            if(!found && vin.length > 4) {
                found = vinDatabase[vin.slice(-4)];
            }

            if (vin.startsWith("W")) {
                typeBox.value = "Mercedes (Diesel)";
                typeBox.classList.add('diesel-mode'); 
                setTab('high'); 
                return;
            }

            if (found) {
                typeBox.value = found.type; 
                
                if (found.fuel === 'diesel') {
                    typeBox.classList.add('diesel-mode');
                    setTab('high');
                } else if (found.fuel === 'electric') {
                    typeBox.classList.add('electric-mode');
                    setTab('edv');
                } else if (found.fuel === 'gas') {
                    typeBox.classList.add('gas-mode');
                    setTab('high');
                }
            } else {
                typeBox.value = "Unknown Vehicle";
            }
        } else {
            typeBox.value = "";
        }
    }

    // --- TAB & GPS LOGIC ---
    let activeTab = 'high';
    function setTab(id) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        
        const tabs = ['high', 'edv', 'low', 'mph'];
        const index = tabs.indexOf(id);
        document.querySelectorAll('.tab-btn')[index].classList.add('active');
        document.getElementById(id).classList.add('active');
        activeTab = id;
        checkForOther();

        if(id === 'mph') {
            setTimeout(() => { map.invalidateSize(); }, 100);
            if (navigator.geolocation) {
                document.getElementById('street').placeholder = "Locating...";
                document.getElementById('gpsStatus').style.display = "block";
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    map.setView([lat, lng], 18);
                    L.marker([lat, lng]).addTo(map);
                    try {
                        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
                        const data = await response.json();
                        if(data.address) {
                            document.getElementById('street').value = data.address.road || "";
                            document.getElementById('city').value = data.address.city || data.address.town || "";
                            document.getElementById('state').value = data.address.state || "";
                        }
                        document.getElementById('gpsStatus').innerText = "✓ GPS AUTO-FILLED";
                    } catch (err) {}
                });
            }
        }
    }

    // --- GENERAL LOGIC ---
    document.querySelectorAll('.list-btn').forEach(btn => {
        btn.addEventListener('click', function() { 
            this.classList.toggle('selected');
            checkForOther();
        });
    });

    function checkForOther() {
        const notesDiv = document.getElementById('otherNotesContainer');
        const anyOtherSelected = Array.from(document.querySelectorAll('.list-btn.selected'))
                                      .some(btn => btn.innerText.includes("Other"));
        if (anyOtherSelected) {
            notesDiv.style.display = 'block';
        } else {
            notesDiv.style.display = 'none';
        }
    }

    var map = L.map('map').setView([39.82, -98.58], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    const photoInput = document.getElementById('photoInput');
    let photos = [];
    photoInput.addEventListener('change', function(e) {
        const files = Array.from(e.target.files);
        if(files.length > 0) {
            document.querySelector('.camera-title').innerText = `${files.length} PHOTOS CAPTURED`;
            document.querySelector('.camera-sub').innerText = "READY TO SUBMIT";
            document.querySelector('.camera-sub').style.color = "#4ade80"; 
            document.querySelector('.camera-icon').style.fill = '#4ade80';
            
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    photos.push({ name: file.name, data: evt.target.result.split(',')[1] });
                };
                reader.readAsDataURL(file);
            });
        }
    });

    async function submitForm() {
        const driverName = document.getElementById('driverName').value;
        const vin = document.getElementById('vinInput').value;
        const vehicleType = document.getElementById('vehicleType').value;
        const notes = document.getElementById('notes').value;
        let selectedTags = [];
        let reportType = "Issue Report";

        if (activeTab === 'mph') {
            reportType = "Road MPH Error";
        } else {
            const activeSection = document.getElementById(activeTab);
            activeSection.querySelectorAll('.list-btn.selected').forEach(btn => {
                selectedTags.push(btn.innerText.replace('✓', '').trim());
            });
        }

        if(!driverName) { alert("Please enter Driver Name"); return; }
        if(!vin || vin.length < 4) { alert("Please enter VIN"); return; }
        if(activeTab !== 'mph' && selectedTags.length === 0) { alert("Please select at least one issue."); return; }
        
        const anyOther = selectedTags.some(t => t.includes("Other"));
        if(anyOther && !notes) { alert("Please describe the issue in Additional Notes."); return; }

        const payload = {
            reportType: reportType,
            driverName: driverName,
            vinLast4: vin,
            vehicleType: vehicleType,
            tags: selectedTags,
            otherDescription: notes,
            addressStreet: document.getElementById('street').value,
            addressCity: document.getElementById('city').value,
            addressState: document.getElementById('state').value,
            date: new Date().toLocaleDateString(),
            time: new Date().toLocaleTimeString(),
            photos: photos
        };

        const btn = document.querySelector('.submit-btn');
        btn.innerText = "UPLOADING...";
        btn.style.opacity = "0.7";

        try {
            const res = await fetch('/submit-report', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            if(result.success) {
                alert("Report Submitted Successfully!");
                window.location.href = '/';
            } else {
                alert("Error: " + result.error);
                btn.innerText = "SUBMIT REPORT";
                btn.style.opacity = "1";
            }
        } catch (e) {
            console.error(e);
            alert("Network Error");
            btn.innerText = "SUBMIT REPORT";
            btn.style.opacity = "1";
        }
    }
</script>

</body>
</html>
