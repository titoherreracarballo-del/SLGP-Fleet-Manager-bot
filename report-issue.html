<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Issue</title>
    <style>
        :root {
            --bg-body: #0A6CF1;
            --bg-card: #1C1C1E;
            --bg-input: #2C2C2E;
            --primary-blue: #1976D2;
            --primary-blue-light: #64B5F6;
            --primary-gradient: linear-gradient(135deg, #1E88E5 0%, #42A5F5 100%);
            --primary-glow: rgba(30, 136, 229, 0.4);
            --text-label: #1976D2;
            --text-white: #ffffff;
            --text-primary: #FFFFFF;
            --text-gray: #8E8E93;
            --text-on-blue: #FFFFFF;
            --border-color: rgba(255, 255, 255, 0.1);
            --space-xs: clamp(4px, 1vw, 6px);
            --space-sm: clamp(6px, 1.5vw, 10px);
            --space-md: clamp(10px, 2.5vw, 15px);
            --space-lg: clamp(15px, 3.5vw, 20px);
            --space-xl: clamp(20px, 4.5vw, 30px);
            --font-xs: clamp(10px, 2.2vw, 12px);
            --font-sm: clamp(12px, 2.8vw, 14px);
            --font-base: clamp(14px, 3.2vw, 16px);
            --font-md: clamp(16px, 3.6vw, 18px);
            --font-lg: clamp(18px, 4.2vw, 20px);
            --font-xl: clamp(22px, 5vw, 26px);
            --radius: clamp(12px, 3vw, 16px);
            --min-touch: 44px;
        }
        * { -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-body);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            padding: clamp(10px, 4vw, 20px);
            margin: 0;
            min-height: 100vh;
            font-size: var(--font-base);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background-color: var(--bg-card);
            border-radius: clamp(18px, 5vw, 24px);
            padding: clamp(18px, 5vw, 24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .logo-header {
            display: block;
            margin: 0 auto var(--space-md) auto;
            max-width: 100%;
            width: clamp(220px, 60vw, 280px);
            height: auto;
            border-radius: 4px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            color: #ffffff;
            background: var(--primary-gradient);
            text-decoration: none;
            font-size: var(--font-md);
            font-weight: 700;
            padding: var(--space-md) var(--space-lg);
            border-radius: var(--radius);
            border: none;
            box-shadow: 0 4px 12px rgba(30, 136, 229, 0.35);
            transition: all 0.2s ease;
            margin-bottom: var(--space-lg);
        }
        .back-link:hover {
            background: linear-gradient(135deg, #1565C0 0%, #42A5F5 100%);
            box-shadow: 0 6px 16px rgba(30, 136, 229, 0.45);
            transform: translateY(-2px);
        }
        .back-link:active { transform: translateY(0); box-shadow: 0 2px 8px rgba(30, 136, 229, 0.35); }
        .timestamp { color: #4ade80; text-align: center; font-size: var(--font-sm); font-weight: 700; margin-bottom: var(--space-xs); }
        h1 {
            color: var(--text-label);
            text-align: center;
            font-size: var(--font-xl);
            font-weight: 900;
            text-transform: uppercase;
            margin: 0 0 var(--space-xl) 0;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }
        .form-group { margin-bottom: var(--space-lg); }
        .row-split { display: flex; gap: var(--space-sm); }
        .vin-col { flex: 0.3; min-width: 70px; }
        .type-col { flex: 0.7; }
        label {
            color: var(--text-label);
            display: block;
            font-size: var(--font-xs);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: var(--space-xs);
            white-space: nowrap;
        }
        input, textarea {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: white;
            padding: var(--space-md);
            border-radius: var(--radius);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
            min-height: var(--min-touch);
        }
        #vehicleType { font-size: var(--font-sm); white-space: normal; overflow: hidden; text-overflow: ellipsis; }
        input:focus, textarea:focus { border-color: var(--text-label); }
        input[readonly] { background-color: #1a202c; font-weight: bold; cursor: not-allowed; border-color: #2d3748; color: #6b7280; }
        input[readonly].gas-mode { color: #ef4444 !important; border-color: #ef4444; }
        input[readonly].diesel-mode { color: #4ade80 !important; border-color: #4ade80; }
        input[readonly].electric-mode { color: #ffffff !important; border-color: #ffffff; }
        #issueDescription { min-height: 120px; font-size: 16px; line-height: 1.5; resize: vertical; }
        .camera-box {
            border: 2px dashed #4b5563;
            border-radius: var(--radius);
            height: clamp(120px, 32vw, 140px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background-color: rgba(255,255,255,0.02);
            position: relative;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .camera-box:hover { border-color: var(--text-label); background-color: rgba(59, 130, 246, 0.05); }
        #photoInput { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10; }
        .camera-icon { width: clamp(32px, 9vw, 40px); height: clamp(32px, 9vw, 40px); fill: #cbd5e1; margin-bottom: var(--space-sm); z-index: 6; }
        .camera-title { font-size: var(--font-sm); font-weight: 800; color: white; letter-spacing: 0.5px; margin-bottom: var(--space-xs); z-index: 6; }
        .camera-sub { font-size: var(--font-xs); font-weight: 700; color: #ef4444; text-transform: uppercase; letter-spacing: 0.5px; z-index: 6; }
        .submit-btn {
            width: 100%;
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: var(--space-lg);
            border-radius: clamp(12px, 3vw, 16px);
            font-weight: 900;
            font-size: var(--font-md);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: var(--space-xl);
            cursor: pointer;
            box-shadow: 0 6px 24px rgba(30, 136, 229, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: clamp(50px, 12vw, 56px);
        }
        .submit-btn:hover:not(:disabled) { background: linear-gradient(135deg, #1565C0 0%, #42A5F5 100%); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(30, 136, 229, 0.5); }
        .submit-btn:active:not(:disabled) { transform: translateY(0); box-shadow: 0 4px 16px rgba(30, 136, 229, 0.4); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        @media (max-width: 340px) { body { padding: 8px; } .container { padding: 12px; } }
        @media (min-width: 768px) { :root { --font-xs: 12px; --font-sm: 13px; --font-base: 15px; --font-md: 16px; --font-lg: 18px; --font-xl: 24px; } }
        @media (max-height: 600px) and (orientation: landscape) { .camera-box { height: clamp(100px, 25vw, 120px); } }
        @supports (-webkit-touch-callout: none) { input, textarea, select { font-size: 16px !important; } }
    </style>
</head>
<body>
<div class="container">
    <a href="/" class="back-link">← Back to Menu</a>
    <div style="text-align: center; color: #8E8E93; font-size: var(--font-xs); font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: var(--space-sm);">v4.6.6</div>
    <img src="./Final-01.jpg" alt="Strategic Logistics Logo" class="logo-header">
    <div class="timestamp" id="ts">Loading...</div>
    <h1>Report Issue</h1>
    <div class="form-group">
        <label>Driver Full Name</label>
        <input type="text" id="driverName" placeholder="Enter Full Name">
    </div>
    <div class="form-group row-split">
        <div class="vin-col">
            <label>Last 4 VIN</label>
            <input type="text" id="vinInput" placeholder="e.g. 1051" maxlength="4" style="text-transform:uppercase;">
        </div>
        <div class="type-col">
            <label>Vehicle Type / Fuel</label>
            <input type="text" id="vehicleType" placeholder="Auto-Detect..." readonly>
        </div>
    </div>
    <div class="form-group">
        <label>Describe the Issue (1-2 sentences)</label>
        <textarea id="issueDescription" placeholder="Example: 'The brakes are making a loud grinding noise when I press them' or 'The vehicle won't start and the battery light is on'" required></textarea>
    </div>
    <div class="form-group" style="margin-top: 25px;">
        <label>LIVE CAMERA (PHOTO/VIDEO REQUIRED)</label>
        <div class="camera-box">
            <input type="file" id="photoInput" accept="image/*" capture="environment">
            <svg class="camera-icon" viewBox="0 0 24 24">
                <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v12h16V6h-2.5L15.5 4h-7L6.5 6H4zm8 11a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
            </svg>
            <div class="camera-title">TAP TO CAPTURE</div>
            <div class="camera-sub">PHOTO/VIDEO REQUIRED</div>
        </div>
    </div>
    <button class="submit-btn" onclick="submitForm()">Submit Report</button>
</div>
<script>
const vinDatabase = {
    "7097": { type: "Custom Delivery Van 12ft (Gas)", fuel: "gas", hasTow: false },
    "1288": { type: "Custom Delivery Van 12ft (Gas)", fuel: "gas", hasTow: false },
    "1295": { type: "Custom Delivery Van 12ft (Gas)", fuel: "gas", hasTow: false },
    "6880": { type: "Custom Delivery Van 12ft (Gas)", fuel: "gas", hasTow: false },
    "6864": { type: "Custom Delivery Van 12ft (Gas)", fuel: "gas", hasTow: false },
    "6907": { type: "Custom Delivery Van 12ft (Gas)", fuel: "gas", hasTow: false },
    "1051": { type: "Extra Large Van (Gas)", fuel: "gas", hasTow: false },
    "7373": { type: "Extra Large Van (Gas)", fuel: "gas", hasTow: false },
    "7863": { type: "Rivian MEDIUM (Electric)", fuel: "electric", hasTow: false },
    "9418": { type: "Rivian MEDIUM (Electric)", fuel: "electric", hasTow: false },
    "7860": { type: "Rivian MEDIUM (Electric)", fuel: "electric", hasTow: false },
    "9412": { type: "Rivian MEDIUM (Electric)", fuel: "electric", hasTow: false },
    "7859": { type: "Rivian MEDIUM (Electric)", fuel: "electric", hasTow: false },
    "7867": { type: "Rivian MEDIUM (Electric)", fuel: "electric", hasTow: false },
    "7871": { type: "Rivian MEDIUM (Electric)", fuel: "electric", hasTow: false },
    "7857": { type: "Rivian MEDIUM (Electric)", fuel: "electric", hasTow: false },
    "7865": { type: "Rivian MEDIUM (Electric)", fuel: "electric", hasTow: false },
    "7866": { type: "Rivian MEDIUM (Electric)", fuel: "electric", hasTow: false },
    "9488": { type: "Extra Large Van (Diesel)", fuel: "diesel", hasTow: true },
    "0213": { type: "Large Van (Diesel)", fuel: "diesel", hasTow: true },
    "8929": { type: "Extra Large Van (Diesel)", fuel: "diesel", hasTow: true },
    "5691": { type: "Extra Large Van (Diesel)", fuel: "diesel", hasTow: true },
    "8125": { type: "Rivian MEDIUM (Electric)", fuel: "electric", hasTow: false },
    "8084": { type: "Rivian MEDIUM (Electric)", fuel: "electric", hasTow: false },
    "7918": { type: "Rivian MEDIUM (Electric)", fuel: "electric", hasTow: false },
    "7898": { type: "Rivian MEDIUM (Electric)", fuel: "electric", hasTow: false },
    "5490": { type: "Custom Delivery Van 16ft (Gas)", fuel: "gas", hasTow: true },
    "5311": { type: "Custom Delivery Van 16ft (Gas)", fuel: "gas", hasTow: true },
    "3010": { type: "Extra Large Van (Gas)", fuel: "gas", hasTow: true },
    "1587": { type: "Custom Delivery Van 16ft (Gas)", fuel: "gas", hasTow: true },
    "5344": { type: "Extra Large Van (Gas)", fuel: "gas", hasTow: true },
    "3344": { type: "Extra Large Van (Gas)", fuel: "gas", hasTow: true },
    "2347": { type: "Custom Delivery Van 14ft (Gas)", fuel: "gas", hasTow: true },
    "0890": { type: "Extra Large Van (Gas)", fuel: "gas", hasTow: true },
    "1853": { type: "Extra Large Van (Gas)", fuel: "gas", hasTow: true },
    "0876": { type: "Extra Large Van (Gas)", fuel: "gas", hasTow: true },
    "8786": { type: "Extra Large Van (Gas)", fuel: "gas", hasTow: true },
    "9651": { type: "Extra Large Van (Gas)", fuel: "gas", hasTow: true },
    "6265": { type: "Custom Delivery Van 16ft (Gas)", fuel: "gas", hasTow: true },
    "6188": { type: "Custom Delivery Van 14ft (Gas)", fuel: "gas", hasTow: true },
    "3754": { type: "Extra Large Van (Gas)", fuel: "gas", hasTow: true },
    "7403": { type: "Extra Large Van (Gas)", fuel: "gas", hasTow: true },
    "9575": { type: "Rivian EDV 700 (Electric)", fuel: "electric", hasTow: false },
    "4905": { type: "Custom Delivery Van 14ft (Gas)", fuel: "gas", hasTow: false },
    "0994": { type: "Rivian EDV 700 (Electric)", fuel: "electric", hasTow: false },
    "9411": { type: "Rivian EDV 700 (Electric)", fuel: "electric", hasTow: false },
    "0945": { type: "Extra Large Van (Gas)", fuel: "gas", hasTow: false },
    "9408": { type: "Rivian EDV 700 (Electric)", fuel: "electric", hasTow: false },
    "0243": { type: "Extra Large Van (Gas)", fuel: "gas", hasTow: false },
    "5434": { type: "Custom Delivery Van 14ft (Gas)", fuel: "gas", hasTow: false },
    "9406": { type: "Rivian EDV 700 (Electric)", fuel: "electric", hasTow: false }
};

let photos = [];
let photosReady = false;  // true once all FileReaders complete
let isSubmitting = false;

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('ts').innerText = new Date().toLocaleString();
    document.getElementById('vinInput').addEventListener('keyup', checkVin);

    const photoInput = document.getElementById('photoInput');
    photoInput.addEventListener('change', function(e) {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        // Accumulate — don't reset; driver taps once per photo
        photosReady = false;

        document.querySelector('.camera-title').innerText = 'PROCESSING...';
        document.querySelector('.camera-sub').innerText = 'COMPRESSING...';
        document.querySelector('.camera-sub').style.color = "#f59e0b";
        document.querySelector('.camera-icon').style.fill = '#f59e0b';

        let loaded = 0;

        function compressPhoto(file) {
            return new Promise((resolve) => {
                // Videos — send as-is, no canvas trick
                if (file.type.startsWith('video/')) {
                    const reader = new FileReader();
                    reader.onload = e => resolve({ name: file.name, data: e.target.result.split(',')[1] });
                    reader.onerror = () => resolve(null);
                    reader.readAsDataURL(file);
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const MAX = 1024;
                        let { width, height } = img;
                        if (width > height) {
                            if (width > MAX) { height = Math.round(height * MAX / width); width = MAX; }
                        } else {
                            if (height > MAX) { width = Math.round(width * MAX / height); height = MAX; }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        resolve({ name: file.name.replace(/\.[^/.]+$/, '') + '.jpg', data: canvas.toDataURL('image/jpeg', 0.7).split(',')[1] });
                    };
                    img.onerror = () => resolve(null);
                    img.src = e.target.result;
                };
                reader.onerror = () => resolve(null);
                reader.readAsDataURL(file);
            });
        }

        Promise.all(files.map(compressPhoto)).then(results => {
            const newPhotos = results.filter(Boolean);
            photos = photos.concat(newPhotos);   // accumulate across taps
            photosReady = photos.length > 0;
            const total = photos.length;
            document.querySelector('.camera-title').innerText = total === 1 ? '1 PHOTO CAPTURED' : `${total} PHOTOS CAPTURED`;
            document.querySelector('.camera-sub').innerText = photosReady ? "TAP TO ADD MORE" : "ERROR — TRY AGAIN";
            document.querySelector('.camera-sub').style.color = photosReady ? "#4ade80" : "#ef4444";
            document.querySelector('.camera-icon').style.fill = photosReady ? '#4ade80' : '#ef4444';
            // Reset input so same photo can be re-selected if needed
            photoInput.value = '';
        });
    });
});

function checkVin() {
    let vin = document.getElementById('vinInput').value.toUpperCase();
    const typeBox = document.getElementById('vehicleType');
    typeBox.classList.remove('diesel-mode', 'gas-mode', 'electric-mode');
    if (vin.length === 4) {
        let found = vinDatabase[vin];
        if (vin.startsWith("W")) {
            typeBox.value = "Mercedes (Diesel)";
            typeBox.classList.add('diesel-mode');
            return;
        }
        if (found) {
            typeBox.value = found.type;
            if (found.fuel === 'electric') { typeBox.classList.add('electric-mode'); }
            else if (found.fuel === 'diesel') { typeBox.classList.add('diesel-mode'); }
            else { typeBox.classList.add('gas-mode'); }
        } else {
            typeBox.value = "Unknown Vehicle";
        }
    } else {
        typeBox.value = "";
    }
}

async function submitForm() {
    if (isSubmitting) return;
    const driverName = document.getElementById('driverName').value;
    const vin = document.getElementById('vinInput').value;
    const vehicleType = document.getElementById('vehicleType').value;
    const issueDescription = document.getElementById('issueDescription').value;
    if(!driverName) { alert("Please enter Driver Name"); return; }
    if(!vin || vin.length < 4) { alert("Please enter VIN"); return; }
    if(!issueDescription || issueDescription.trim().length === 0) { alert("Please describe the issue in 1-2 sentences."); return; }
    if (photos.length === 0) {
        alert("Photo or video documentation is required.");
        return;
    }
    if (!photosReady) {
        alert("Photos are still compressing — please wait a moment and try again.");
        return;
    }
    isSubmitting = true;
    const btn = document.querySelector('.submit-btn');
    btn.innerText = "SUBMITTING...";
    btn.style.opacity = "0.7";
    btn.disabled = true;
    const payload = {
        driverName: driverName,
        vinLast4: vin,
        vehicleType: vehicleType,
        issueDescription: issueDescription,
        date: new Date().toLocaleDateString(),
        time: new Date().toLocaleTimeString(),
        photos: photos
    };
    try {
        const res = await fetch('/submit-issue-ai', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const result = await res.json();
        if(result.success) {
            window.location.href = '/success';
        } else {
            throw new Error(result.error);
        }
    } catch (e) {
        console.error(e);
        alert("Upload Error. Please try again.");
        isSubmitting = false;
        btn.innerText = "SUBMIT REPORT";
        btn.style.opacity = "1";
        btn.disabled = false;
        // Don't reset photos/photosReady — driver can retry with same files
    }
}
</script>
<script src="/auto-refresh.js"></script>
</body>
</html>
