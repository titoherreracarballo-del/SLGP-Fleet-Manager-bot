<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Issue</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        :root {
            --bg-body: #111827;       /* Dark Background */
            --bg-card: #1F2937;       /* Card Background */
            --accent: #8B5CF6;        /* The Purple from your screenshots */
            --text-white: #F9FAFB;
            --text-gray: #9CA3AF;
        }

        body {
            background-color: var(--bg-body);
            font-family: sans-serif;
            color: var(--text-white);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* TABS */
        .tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        .tab-btn {
            background: #374151;
            border: 1px solid #4B5563;
            color: #D1D5DB;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
        }
        .tab-btn.active {
            background-color: var(--accent);
            border-color: var(--accent);
            color: white;
            font-weight: bold;
        }

        /* PILL BUTTONS */
        .grid-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .pill-btn {
            background-color: #374151;
            border: 1px solid #4B5563;
            color: #E5E7EB;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pill-btn:hover { background-color: #4B5563; }
        .pill-btn.selected {
            background-color: #2e1065;
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 8px rgba(139, 92, 246, 0.4);
        }

        /* SECTIONS */
        .section { display: none; }
        .section.active { display: block; }
        
        label { display: block; color: var(--accent); font-size: 14px; font-weight: bold; margin-bottom: 10px; margin-top: 15px; }
        
        input, textarea {
            width: 100%; box-sizing: border-box; background: #111827;
            border: 1px solid #374151; color: white; padding: 12px;
            border-radius: 8px; margin-bottom: 10px;
        }

        #map { height: 200px; width: 100%; border-radius: 8px; margin-top: 10px; }

        .submit-btn {
            width: 100%; background-color: var(--accent); color: white;
            padding: 16px; border: none; border-radius: 12px;
            font-weight: bold; font-size: 16px; margin-top: 20px; cursor: pointer;
        }
        
        a { color: #9CA3AF; text-decoration: none; font-size: 13px; display: block; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <a href="/">← Back to Menu</a>
    
    <div class="form-group">
        <input type="text" id="driverName" placeholder="Driver Full Name (Required)">
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="setTab('high')">High Priority</button>
        <button class="tab-btn" onclick="setTab('edv')">EDV Issue</button>
        <button class="tab-btn" onclick="setTab('low')">Low Priority</button>
        <button class="tab-btn" onclick="setTab('mph')">Road MPH Error</button>
    </div>

    <div id="high" class="section active">
        <div class="grid-options">
            <button class="pill-btn">Brakes squealing or grinding</button>
            <button class="pill-btn">Tire blowout / extreme wear</button>
            <button class="pill-btn">Steering column loose</button>
            <button class="pill-btn">Vehicle will not start</button>
            <button class="pill-btn">Burning smell</button>
            <button class="pill-btn">Fluid leak</button>
            <button class="pill-btn">Sliding door off track</button>
            <button class="pill-btn">Rear van door will not open</button>
            <button class="pill-btn">Headlight bulb out</button>
            <button class="pill-btn">Taillight bulb out</button>
            <button class="pill-btn">Turn signal bulb out</button>
            <button class="pill-btn">Backup camera no image</button>
            <button class="pill-btn">Phone mount broken</button>
            <button class="pill-btn">Low DEF light on</button>
            <button class="pill-btn">Flat tire</button>
            <button class="pill-btn">Power bank not working</button>
            <button class="pill-btn">Charger cable needs replaced</button>
            <button class="pill-btn">Gas card missing</button>
            <button class="pill-btn">Dog deterrent missing</button>
            <button class="pill-btn">Broken key</button>
            <button class="pill-btn">Work phone damaged</button>
            <button class="pill-btn">AVI Grounded</button>
            <button class="pill-btn">Missing license plate</button>
            <button class="pill-btn">Missing temp tag</button>
            <button class="pill-btn">Package spill</button>
            <button class="pill-btn">Missing windshield wiper</button>
            <button class="pill-btn">Other (describe)</button>
        </div>
    </div>

    <div id="edv" class="section">
        <div class="grid-options">
            <button class="pill-btn">EDV key fob battery low</button>
            <button class="pill-btn">EDV not charging</button>
            <button class="pill-btn">EDV warning light (describe)</button>
            <button class="pill-btn">Bulkhead door not opening</button>
            <button class="pill-btn">Rear cargo door not opening</button>
            <button class="pill-btn">Severe dent</button>
            <button class="pill-btn">Minor dent</button>
            <button class="pill-btn">Severe damages</button>
            <button class="pill-btn">Broken light fixture</button>
            <button class="pill-btn">Broken mirror</button>
            <button class="pill-btn">Broken windshield</button>
            <button class="pill-btn">Other (describe)</button>
        </div>
    </div>

    <div id="low" class="section">
        <div class="grid-options">
            <button class="pill-btn">Light scratches</button>
            <button class="pill-btn">Interior dirty</button>
            <button class="pill-btn">Door closes but sensor says open</button>
            <button class="pill-btn">Seat does not adjust</button>
            <button class="pill-btn">Radio not working</button>
            <button class="pill-btn">QR code faded</button>
            <button class="pill-btn">Other</button>
        </div>
    </div>

    <div id="mph" class="section">
        <label>Road MPH Sign Error</label>
        <input type="text" placeholder="Street or Road Name *">
        <input type="text" placeholder="City *">
        <input type="text" placeholder="State *">
        <div id="map"></div>
    </div>

    <label style="margin-top: 20px;">Additional Notes</label>
    <textarea rows="3" placeholder="Describe specific details..."></textarea>

    <button class="submit-btn">Submit Report</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Tab Logic
    function setTab(id) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        
        // Activate clicked tab based on text/order is hard, so we assume logic based on ID order or manually match
        const tabs = ['high', 'edv', 'low', 'mph'];
        const index = tabs.indexOf(id);
        document.querySelectorAll('.tab-btn')[index].classList.add('active');
        document.getElementById(id).classList.add('active');

        if(id === 'mph') {
            setTimeout(() => { map.invalidateSize(); }, 100);
        }
    }

    // Pill Select Logic
    document.querySelectorAll('.pill-btn').forEach(btn => {
        btn.addEventListener('click', function() { this.classList.toggle('selected'); });
    });

    // Map Init
    var map = L.map('map').setView([39.82, -98.58], 4); // Center of US
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);
    
    // Attempt to get user location
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
            map.setView([pos.coords.latitude, pos.coords.longitude], 15);
            L.marker([pos.coords.latitude, pos.coords.longitude]).addTo(map);
        });
    }
</script>

</body>
</html>
