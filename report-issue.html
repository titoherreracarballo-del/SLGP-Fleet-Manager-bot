<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Issue</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        /* --- THEME SETTINGS --- */
        :root {
            --bg-body: #0F1115;       /* Deepest Navy */
            --bg-card: #161B28;       /* Card Background */
            --bg-input: #0b0d12;      /* Input Background */
            --primary-blue: #2563EB;  /* Bright Blue */
            --primary-glow: rgba(37, 99, 235, 0.4);
            --text-label: #3B82F6;    /* Neon Blue Text */
            --text-white: #ffffff;
            --text-gray: #94a3b8;
            --border-color: #2d3748;
            --radius: 12px;
        }

        body {
            background-color: var(--bg-body);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: var(--bg-card);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid #1f2937;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        /* --- HEADERS --- */
        .back-link {
            color: var(--text-gray); text-decoration: none; font-size: 14px; margin-bottom: 20px; display: block;
        }
        .timestamp {
            color: #4ade80; text-align: center; font-size: 13px; font-weight: 700; margin-bottom: 5px;
        }
        h1 {
            color: var(--text-label); text-align: center; font-size: 24px; font-weight: 900; 
            text-transform: uppercase; margin: 0 0 25px 0; letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        /* --- INPUTS --- */
        .form-group { margin-bottom: 20px; }
        
        .row-split { display: flex; gap: 15px; }
        .half-width { flex: 1; }

        label {
            color: var(--text-label); display: block; font-size: 11px; font-weight: 800; 
            text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px;
        }
        input, textarea {
            width: 100%; background-color: var(--bg-input); border: 1px solid var(--border-color); color: white;
            padding: 16px; border-radius: var(--radius); font-size: 16px; box-sizing: border-box; outline: none;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus { border-color: var(--text-label); }

        /* Readonly VIN Display */
        input[readonly] {
            background-color: #1a202c; 
            color: #4ade80; /* Green Text for success */
            font-weight: bold;
            cursor: not-allowed;
            border-color: #2d3748;
        }

        /* --- CATEGORY TABS --- */
        .tabs {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px;
        }
        .tab-btn {
            background-color: transparent; border: 1px solid #374151; color: #64748b;
            padding: 12px; border-radius: var(--radius); font-size: 11px; font-weight: 800;
            text-transform: uppercase; cursor: pointer; transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: #1e3a8a; border-color: var(--text-label); color: white;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.2);
        }

        /* --- MODERN LIST BUTTONS --- */
        .section { display: none; }
        .section.active { display: block; }
        .list-options { display: flex; flex-direction: column; gap: 10px; }

        .list-btn {
            width: 100%; text-align: left;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid #334155; color: #E2E8F0;
            padding: 16px 20px; border-radius: var(--radius);
            font-size: 14px; font-weight: 600; cursor: pointer;
            transition: all 0.2s ease; position: relative;
        }
        .list-btn:hover { border-color: var(--text-label); background-color: rgba(59, 130, 246, 0.1); }
        .list-btn.selected {
            background-color: var(--primary-blue); border-color: var(--primary-blue);
            color: white; box-shadow: 0 4px 15px var(--primary-glow); transform: translateY(-1px);
        }
        .list-btn.selected::after { content: "✓"; position: absolute; right: 20px; font-weight: bold; }

        /* --- CAMERA BOX (FORCED LIVE CAPTURE) --- */
        .camera-box {
            border: 2px dashed #4b5563; border-radius: 16px; height: 140px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; background-color: rgba(255,255,255,0.02);
            position: relative; overflow: hidden; transition: border-color 0.2s;
        }
        .camera-box:hover { border-color: var(--text-label); background-color: rgba(59, 130, 246, 0.05); }
        
        /* capture="environment" forces rear camera on mobile */
        #photoInput { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10; }
        
        .camera-icon { width: 40px; height: 40px; fill: #cbd5e1; margin-bottom: 10px; }
        .camera-title { font-size: 13px; font-weight: 800; color: white; letter-spacing: 0.5px; margin-bottom: 4px; }
        .camera-sub { font-size: 10px; font-weight: 700; color: #ef4444; text-transform: uppercase; letter-spacing: 0.5px; }

        /* --- MAP --- */
        #map { height: 180px; width: 100%; border-radius: var(--radius); margin-top: 10px; border: 1px solid #374151; }
        
        /* --- HIDDEN NOTES --- */
        #otherNotesContainer { display: none; margin-top: 20px; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- SUBMIT --- */
        .submit-btn {
            width: 100%; background-color: var(--primary-blue); color: white; border: none;
            padding: 18px; border-radius: var(--radius); font-weight: 900; font-size: 16px;
            text-transform: uppercase; margin-top: 25px; cursor: pointer;
            box-shadow: 0 4px 20px var(--primary-glow);
        }
    </style>
</head>
<body>

<div class="container">
    <a href="/" class="back-link">← Back to Menu</a>
    <div class="timestamp" id="ts">Loading...</div>
    <h1>Report Issue</h1>
    
    <div class="form-group">
        <label>Driver Full Name</label>
        <input type="text" id="driverName" placeholder="Enter Full Name">
    </div>

    <div class="form-group row-split">
        <div class="half-width">
            <label>Last 4 of VIN</label>
            <input type="number" id="vinInput" placeholder="e.g. 7867" onkeyup="checkVin()">
        </div>
        <div class="half-width">
            <label>Vehicle Type</label>
            <input type="text" id="vehicleType" placeholder="Auto-Detect..." readonly>
        </div>
    </div>

    <label>Issue Category</label>
    <div class="tabs">
        <button class="tab-btn active" onclick="setTab('high')">High Priority</button>
        <button class="tab-btn" onclick="setTab('edv')">EDV / Electric</button>
        <button class="tab-btn" onclick="setTab('low')">Low Priority</button>
        <button class="tab-btn" onclick="setTab('mph')">MPH Error</button>
    </div>

    <div id="high" class="section active">
        <div class="list-options">
            <button class="list-btn">Brakes Squealing / Grinding</button>
            <button class="list-btn">Tire Blowout / Extreme Wear</button>
            <button class="list-btn">Steering Column Loose</button>
            <button class="list-btn">Vehicle Will Not Start</button>
            <button class="list-btn">Burning Smell / Fluid Leak</button>
            <button class="list-btn">Sliding / Rear Door Stuck</button>
            <button class="list-btn">Headlight / Taillight Out</button>
            <button class="list-btn">Backup Camera No Image</button>
            <button class="list-btn">Low DEF Light On</button>
            <button class="list-btn">Flat Tire / Battery Dead</button>
            <button class="list-btn">Missing Plate / Tag</button>
            <button class="list-btn">Other (See Notes)</button>
        </div>
    </div>

    <div id="edv" class="section">
        <div class="list-options">
            <button class="list-btn">Key Fob Battery Low</button>
            <button class="list-btn">Vehicle Not Charging</button>
            <button class="list-btn">Warning Light On</button>
            <button class="list-btn">Bulkhead Door Issue</button>
            <button class="list-btn">Severe Body Damage</button>
            <button class="list-btn">Broken Mirror / Glass</button>
            <button class="list-btn">Other (See Notes)</button>
        </div>
    </div>

    <div id="low" class="section">
        <div class="list-options">
            <button class="list-btn">Light Scratches</button>
            <button class="list-btn">Interior Dirty</button>
            <button class="list-btn">Door Sensor Error</button>
            <button class="list-btn">Seat Adjustment Stuck</button>
            <button class="list-btn">Radio / Audio Issue</button>
            <button class="list-btn">QR Code Faded</button>
            <button class="list-btn">Other (See Notes)</button>
        </div>
    </div>

    <div id="mph" class="section">
        <label>Road / Location Details</label>
        <input type="text" id="street" placeholder="Street Name" style="margin-bottom:10px;">
        <input type="text" id="city" placeholder="City" style="margin-bottom:10px;">
        <input type="text" id="state" placeholder="State">
        <div id="map"></div>
    </div>

    <div class="form-group" id="otherNotesContainer">
        <label>Additional Notes (Required for "Other")</label>
        <textarea id="notes" rows="3" placeholder="Describe the specific issue..."></textarea>
    </div>

    <div class="form-group" style="margin-top: 25px;">
        <label>LIVE CAMERA (NO UPLOADS)</label>
        <div class="camera-box">
            <input type="file" id="photoInput" multiple accept="image/*" capture="environment">
            <svg class="camera-icon" viewBox="0 0 24 24">
                <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v12h16V6h-2.5L15.5 4h-7L6.5 6H4zm8 11a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
            </svg>
            <div class="camera-title">TAP TO START CAMERA</div>
            <div class="camera-sub">GALLERY ACCESS DISABLED</div>
        </div>
    </div>

    <button class="submit-btn" onclick="submitForm()">Submit Report</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. Timestamp
    document.getElementById('ts').innerText = new Date().toLocaleString();

    // 2. VIN DATABASE (Based on your Screenshot)
    const vinDatabase = {
        // GAS VANS (CDV, XL, LARGE)
        "1051": "Extra Large Van (Gas)",
        "5490": "CDV 16ft (Gas)",
        "9488": "Extra Large Van (Gas)",
        "7097": "CDV 12ft (Gas)",
        "5311": "CDV 16ft (Gas)",
        "3010": "Extra Large Van (Gas)",
        "1587": "CDV 16ft (Gas)",
        "5344": "Extra Large Van (Gas)",
        "2347": "CDV 14ft (Gas)",
        "0890": "Extra Large Van (Gas)",
        "6880": "CDV 12ft (Gas)",
        "1853": "Extra Large Van (Gas)",
        "7373": "Extra Large Van (Gas)",
        "0876": "Extra Large Van (Gas)",
        "8786": "Extra Large Van (Gas)",
        "6907": "CDV 12ft (Gas)",
        "0213": "Large Van (Gas)",
        "8929": "Extra Large Van (Gas)",
        "1295": "CDV 12ft (Gas)",
        "9651": "Extra Large Van (Gas)",
        "6265": "CDV 16ft (Gas)",
        "6188": "CDV 14ft (Gas)",
        "3754": "Extra Large Van (Gas)",
        "1288": "CDV 12ft (Gas)",
        "5691": "Extra Large Van (Gas)",
        "6864": "CDV 12ft (Gas)",
        "7403": "Extra Large Van (Gas)",

        // ELECTRIC (RIVIAN EDV)
        "7867": "Rivian MEDIUM (Electric)",
        "7871": "Rivian MEDIUM (Electric)",
        "9412": "Rivian MEDIUM (Electric)",
        "7866": "Rivian MEDIUM (Electric)",
        "7865": "Rivian MEDIUM (Electric)",
        "7860": "Rivian MEDIUM (Electric)",
        "9418": "Rivian MEDIUM (Electric)",
        "7863": "Rivian MEDIUM (Electric)",
        "7859": "Rivian MEDIUM (Electric)",
        "7857": "Rivian MEDIUM (Electric)"
    };

    function checkVin() {
        const vin = document.getElementById('vinInput').value;
        const typeBox = document.getElementById('vehicleType');

        if (vin.length === 4) {
            if (vinDatabase[vin]) {
                const vehicle = vinDatabase[vin];
                typeBox.value = vehicle; // Show detected vehicle
                
                // Smart Switch: If Rivian, go to EDV tab. Else go to High Priority.
                if(vehicle.toLowerCase().includes("rivian")) {
                    setTab('edv');
                } else {
                    setTab('high');
                }
            } else {
                typeBox.value = "Unknown Vehicle";
            }
        } else {
            typeBox.value = "";
        }
    }

    // 3. Tab Logic
    let activeTab = 'high';
    function setTab(id) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        
        const tabs = ['high', 'edv', 'low', 'mph'];
        const index = tabs.indexOf(id);
        document.querySelectorAll('.tab-btn')[index].classList.add('active');
        document.getElementById(id).classList.add('active');
        activeTab = id;

        if(id === 'mph') { setTimeout(() => { map.invalidateSize(); }, 100); }
        checkForOther();
    }

    // 4. Selection Logic
    document.querySelectorAll('.list-btn').forEach(btn => {
        btn.addEventListener('click', function() { 
            this.classList.toggle('selected');
            checkForOther();
        });
    });

    function checkForOther() {
        const notesDiv = document.getElementById('otherNotesContainer');
        const anyOtherSelected = Array.from(document.querySelectorAll('.list-btn.selected'))
                                      .some(btn => btn.innerText.includes("Other"));
        if (anyOtherSelected) {
            notesDiv.style.display = 'block';
        } else {
            notesDiv.style.display = 'none';
        }
    }

    // 5. Map Init
    var map = L.map('map').setView([39.82, -98.58], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // 6. Photo Logic (Live Camera Only)
    const photoInput = document.getElementById('photoInput');
    let photos = [];
    photoInput.addEventListener('change', function(e) {
        const files = Array.from(e.target.files);
        if(files.length > 0) {
            document.querySelector('.camera-title').innerText = `${files.length} PHOTOS CAPTURED`;
            document.querySelector('.camera-sub').innerText = "READY TO SUBMIT";
            document.querySelector('.camera-sub').style.color = "#4ade80"; // Turn Green
            document.querySelector('.camera-icon').style.fill = '#4ade80';
            
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    photos.push({ name: file.name, data: evt.target.result.split(',')[1] });
                };
                reader.readAsDataURL(file);
            });
        }
    });

    // 7. Submit Logic
    async function submitForm() {
        const driverName = document.getElementById('driverName').value;
        const vin = document.getElementById('vinInput').value;
        const vehicleType = document.getElementById('vehicleType').value;
        const notes = document.getElementById('notes').value;
        let selectedTags = [];
        let reportType = "Issue Report";

        if (activeTab === 'mph') {
            reportType = "Road MPH Error";
        } else {
            const activeSection = document.getElementById(activeTab);
            activeSection.querySelectorAll('.list-btn.selected').forEach(btn => {
                selectedTags.push(btn.innerText.replace('✓', '').trim());
            });
        }

        if(!driverName) { alert("Please enter Driver Name"); return; }
        if(!vin || vin.length < 4) { alert("Please enter VIN"); return; }
        if(activeTab !== 'mph' && selectedTags.length === 0) { alert("Please select at least one issue."); return; }
        
        const anyOther = selectedTags.some(t => t.includes("Other"));
        if(anyOther && !notes) { alert("Please describe the issue in Additional Notes."); return; }

        const payload = {
            reportType: reportType,
            driverName: driverName,
            vinLast4: vin,
            vehicleType: vehicleType,
            tags: selectedTags,
            otherDescription: notes,
            addressStreet: document.getElementById('street').value,
            addressCity: document.getElementById('city').value,
            addressState: document.getElementById('state').value,
            date: new Date().toLocaleDateString(),
            time: new Date().toLocaleTimeString(),
            photos: photos
        };

        const btn = document.querySelector('.submit-btn');
        btn.innerText = "UPLOADING...";
        btn.style.opacity = "0.7";

        try {
            const res = await fetch('/submit-report', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            if(result.success) {
                alert("Report Submitted Successfully!");
                window.location.href = '/';
            } else {
                alert("Error: " + result.error);
                btn.innerText = "SUBMIT REPORT";
                btn.style.opacity = "1";
            }
        } catch (e) {
            console.error(e);
            alert("Network Error");
            btn.innerText = "SUBMIT REPORT";
            btn.style.opacity = "1";
        }
    }
</script>

</body>
</html>
